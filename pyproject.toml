[project]
# 実行ファイルは Go（go/）。ここはテスト（tests/、Python）を回すための定義で、パッケージとしては配らない。
# name は実行ファイルが ccnavi 自身のソースツリーを見分ける目印、version は実行ファイルの版と揃える
# （go/internal/infra/config・go/internal/entry/version が読む）。
name = "ccnavi"
version = "0.1.0"
description = "Claude Code のツール呼び出しを止め、代わりに取る手段を返す hook"
requires-python = ">=3.12"
# テストが読む依存。チケットの frontmatter と設定が YAML で、テストもそれを読み書きする。
dependencies = ["pyyaml>=6.0"]

[dependency-groups]
# 開発時だけの道具。
dev = ["ruff>=0.16.0,<0.17"]

[tool.uv]
# パッケージとして組み立てない（tests/ は src/ を sys.path に足して読む）。
package = false
# キャッシュから venv へは**複製**で置く。既定のハードリンクだと、ワークツリーを
# 片付けられなくなる。
#
# uv は wheel の中身をキャッシュから venv へハードリンクで置く（Windows / Linux の既定）。
# 実体は 1 つで、`.venv/.../yaml/_yaml.cp312-win_amd64.pyd` は main と全ワークツリーで
# 同じファイルを指す。Windows は、実体が DLL として読み込まれている間、**どの名前も**
# 消させない（rename は通る）。並行するセッションはターンの終わりに数分テストを
# 走らせ、そこで PyYAML を読み込むので、別のワークツリーのテストが走っている間は
# `git worktree remove` が `Permission denied` で落ち、`.venv` だけが入ったディレクトリが残る。
# 残ったディレクトリは次の `test-py.sh` を「tests を読めない」で落とすので、実害が続く。
#
# 複製にするとワークツリーごとに実体が分かれ、他所のテストに巻き込まれなくなる。
# 代償は数 MB の重複と、初回の作成が少し遅いことだけ。
link-mode = "copy"

[tool.ruff]
line-length = 100
# 組み立ての作業場所と出力。生成物なので読ませない。
exclude = [
    "build",
    "dist",
    # vendored（upstream nanaism/yomiyasu）なので書き換えない。
    ".claude/skills/yomiyasu",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
