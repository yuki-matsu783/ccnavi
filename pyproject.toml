[project]
name = "ccnavi"
version = "0.1.0"
description = "Claude Code のツール呼び出しを止め、代わりに取る手段を返す hook"
requires-python = ">=3.12"
# 実行時の依存は PyYAML 1 本だけ。チケットの frontmatter が YAML で、
# 自前の読み手を書くと書式の解釈違いがそのままガードの穴になる。
# 読むのは safe_load に限る（ticket.py）。任意の Python の型を組み立てる
# load は、エージェントが書けるファイルに向けては使わない。
dependencies = ["pyyaml>=6.0"]

[dependency-groups]
# 開発時だけの道具。配布物には入らない。
dev = ["pyinstaller>=6.10", "ruff>=0.6"]

[tool.uv]
# キャッシュから venv へは**複製**で置く。既定のハードリンクだと、作業ツリーを
# 片付けられなくなる。
#
# uv は wheel の中身をキャッシュから venv へハードリンクで置く（Windows / Linux の既定）。
# 実体は 1 つで、`.venv/.../yaml/_yaml.cp312-win_amd64.pyd` は main と全作業ツリーで
# 同じファイルを指す。Windows は、実体が DLL として読み込まれている間、**どの名前も**
# 消させない（rename は通る）。並行するセッションはターンの終わりに 9 分ほどテストを
# 走らせ、そこで PyYAML を読み込むので、別の作業ツリーのテストが走っている間は
# `git worktree remove` が `Permission denied` で落ち、`.venv` だけの抜け殻が残る。
# 抜け殻は次の `test-py.sh` を「tests を読めない」で落とすので、実害が続く。
#
# 複製にすると作業ツリーごとに実体が分かれ、他所のテストに巻き込まれなくなる。
# 代償は数 MB の重複と、初回の作成が少し遅いことだけ。自分のテストが走っている間に
# 自分の作業ツリーを消せないのは変わらない（そこは順番を守る話）。
link-mode = "copy"

[tool.ruff]
line-length = 100
# PyInstaller の作業場所と出力。生成物なので読ませない。
exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
