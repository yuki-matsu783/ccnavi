version: "2"

linters:
  default: standard

  settings:
    errcheck:
      # Diagnostics go to stderr, and a failed write there has nowhere left to
      # be reported. The same goes for removing a temporary directory on the way
      # out. Checking these would add noise without adding a single recovery.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - os.RemoveAll
