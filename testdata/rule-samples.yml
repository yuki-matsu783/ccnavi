# ルールが何を止めて何を通すかの見本。`/rules-check` スキルがこれを回す。
#
# ルールを 1 件足したり直したりしたら、ここにも 1 行足す。足さないと、
# あとから読んだ人に「そのルールが何のために在るのか」を伝える手立てが
# ルールの文面しか無くなる。文面は止められた側に向けた言葉で、
# 何に当たるかは書いていない。
#
# 区画の名前が期待する判定になる。deny なら止まるはず、allow なら通るはず、
# ask なら人に確認が出るはず。実際の判定と食い違ったものをスキルが報告する。
#
# subject は Bash ならコマンド、それ以外ならパス。パスは絶対で書く。
# 判定は行き着く先まで解いてから当てるので、相対で書くと走らせた場所で
# 答えが変わる。

deny:
  - tool: Bash
    subject: "git push origin main"
    why: エージェントからは push しない
  - tool: Bash
    subject: "cd /repo && git push"
    why: コマンド列の途中でも当たる
  - tool: Bash
    subject: "/usr/bin/git push"
    why: パス付きでも当たる
  - tool: Bash
    subject: "echo $(git push origin main)"
    why: コマンド置換の中も実行される
  - tool: Bash
    subject: "git reset --hard HEAD~1"
    why: 作業中の変更が消える
  - tool: Bash
    subject: "git branch -D feature"
    why: 未マージのブランチが消える
  - tool: Bash
    subject: "git status"
    why: 生の git はサブコマンドによらず止め、ラッパへ寄せる
  - tool: Bash
    subject: "/usr/bin/git.exe diff"
    why: パス付きでも拡張子付きでも、コマンドの位置に立つ git は当たる
  - tool: Bash
    subject: "git -c diff.external=touch diff"
    why: 読むだけに見えて任意コマンドを実行する形
  - tool: Bash
    subject: "rm -rf /tmp/x"
    why: 再帰的な強制削除は戻せない
  - tool: Bash
    subject: "cat <<'EOF' > notes.md"
    why: ヒアドキュメントは検査を通らない経路になる
  - tool: Bash
    subject: "cat /repo/.env"
    why: 認証情報。settings.json はシェル経由を止められない
  - tool: Bash
    subject: "cat /repo/certs/server.pem"
    why: 同上
  - tool: Bash
    subject: "cat /home/u/.aws/credentials"
    why: 同上
  - tool: Bash
    subject: "cat /repo/secrets/token.txt"
    why: 同上
  - tool: Write
    subject: "/repo/.claude/ccnavi/rules.yml"
    why: ガード自身の設定
  - tool: Write
    subject: "/repo/.claude/hooks/lint-py.sh"
    why: ガードを起動する hook 本体
  - tool: Edit
    subject: "/repo/docs/../.claude/ccnavi/rules.yml"
    why: 迂回した綴りでも行き着く先で当たる
  - tool: Bash
    subject: "echo x > /repo/.claude/ccnavi/rules.yml"
    why: Write で拒否した場所。リダイレクトで同じところに届く
  - tool: Bash
    subject: "cd /repo && printf x >> .claude/hooks/lint-py.sh"
    why: 相対の綴りでも、追記でも同じ場所
  - tool: Bash
    subject: "sed -i s/deny/allow/ /repo/.claude/ccnavi/rules.yml"
    why: その場で書き換える形
  - tool: Bash
    subject: "cp /tmp/x /repo/.claude/hooks/lint-py.sh"
    why: 別の場所から上書きする形。行き先に名前が来ている
  - tool: Bash
    subject: "mv /repo/.claude/ccnavi/rules.yml /tmp/old.yml"
    why: 移した元が消える。ルールが読めなくなる
  - tool: Bash
    subject: "rm /repo/.claude/ccnavi/log.jsonl"
    why: 記録を消すのも書き換えのうち
  - tool: Bash
    subject: "echo x | tee /repo/.claude/ccnavi/rules.yml"
    why: リダイレクトを使わない書き込み

ask:
  - tool: Bash
    subject: "sh .claude/scripts/ccnavi-git.sh commit -m 'x'"
    why: コミットは 1 回ごとに人が見る。通る道はラッパだけなので錨もそちらに打つ
  - tool: Write
    subject: "/repo/pyproject.toml"
    why: 実行時の依存が変わる
  - tool: Write
    subject: "/repo/.current-ticket.md"
    why: 作業範囲の提案。承認は別の経路
  - tool: Bash
    subject: "curl https://example.com"
    why: どのルールも言及していない。暗黙的 ask
  - tool: Bash
    subject: "docker run --rm alpine"
    why: 同上
  - tool: Bash
    subject: "bash -c 'ls'"
    why: 読み切れないコマンド。allow は当てない

allow:
  - tool: Bash
    subject: "sh .claude/scripts/ccnavi-git.sh status --porcelain"
    why: git の入口。サブコマンドの選別はラッパの中で行う
  - tool: Bash
    subject: "cd /repo && sh .claude/scripts/ccnavi-git.sh worktree add .claude/worktrees/x -b x"
    why: このプロジェクトの作業手順。コマンド列の途中でも通る
  - tool: Bash
    subject: "cd /repo/.claude/worktrees/git-wrapper && ls"
    why: パスの中の git は当たらない。当たると worktree の出入りが丸ごと止まる
  - tool: Bash
    subject: "sed -n 1,20p /repo/logs/git-20260907-000000-1.log"
    why: ラッパが残した記録を読む手。ここを止めると抑えた出力に辿り着けない
  - tool: Bash
    subject: "uv run python -m unittest discover -s tests -t ."
    why: 検査コマンド
  - tool: Bash
    subject: "grep -n TODO ccnavi/cli.py"
    why: 読むだけ
  - tool: Bash
    subject: 'grep -n "git push" README.md'
    why: 引用された語は実行位置ではない
  - tool: Bash
    subject: "# git push origin main"
    why: コメントだけの行は何も走らない
  - tool: Read
    subject: "/repo/README.md"
    why: 読み取りは通す
  - tool: Write
    subject: "/repo/ccnavi/cli.py"
    why: このプロジェクトのソース
  - tool: Write
    subject: "/repo/tests/test_glob.py"
    why: 同上
  - tool: Write
    subject: "/repo/README.md"
    why: 同上
  - tool: Bash
    subject: "cat /repo/.claude/ccnavi/rules.yml"
    why: ガードの設定は読むほうが普通。名前が出ただけでは止めない
  - tool: Bash
    subject: "sed -n 1,20p /repo/.claude/ccnavi/rules.yml"
    why: sed でも -i が無ければ読むだけ
  - tool: Bash
    subject: "grep -n cp /repo/.claude/hooks/lint-py.sh"
    why: 書き込むコマンドの名前を探しているだけ。コマンドの先頭に無い
  - tool: Bash
    subject: 'grep -n "rm -rf" /repo/.claude/ccnavi/rules.yml'
    why: ルールの文面を引いているだけ
  - tool: Bash
    subject: "cat /repo/.claude/ccnavi/rules.yml > /tmp/x"
    why: リダイレクトはあるが行き先が別の場所
  - tool: Bash
    subject: "cp /repo/.claude/ccnavi/rules.yml /tmp/backup.yml"
    why: 写しを取っているだけ。cp は行き先の側だけを見る
  - tool: Bash
    subject: "uv run python -m ccnavi --rules /repo/.claude/ccnavi/rules.yml --test Bash ls"
    why: ルールを確かめる手そのもの。ここを止めると点検ができない
