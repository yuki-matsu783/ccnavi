# ルールが何を止めて何を通すかの見本。`/ccnavi-config` スキルがこれを回す。
#
# ルールを 1 件足したり直したりしたら、ここにも 1 行足す。足さないと、
# あとから読んだ人に「そのルールが何のために在るのか」を伝える手立てが
# ルールの文面しか無くなる。文面は止められた側に向けた言葉で、
# 何に当たるかは書いていない。
#
# タイプの名前が期待する判定になる。deny なら止まるはず、allow なら通るはず、
# ask なら人に確認が出るはず。実際の判定と食い違ったものをスキルが報告する。
# どのルールも言及しない呼び出し（UNDECLARED）は権限モードへ渡り、端末からの
# 試験では ask として出る。deny に当たってほしくないが allow にも無いものは、
# ask に置いて「当たらないこと」を見本にする。
#
# subject は Bash / PowerShell ならコマンド、Read / Grep / Glob / Edit / Write /
# NotebookEdit ならパス、Skill ならスキル名、Agent なら見出し、WebFetch なら URL。
# パスは絶対で書く。
# 判定は行き着く先まで解いてから当てるので、相対で書くと走らせた場所で
# 答えが変わる。

deny:
  - tool: Write
    subject: "/repo/README.md"
    why: main の作業ツリーでは編集しない。作業は worktree の中で
  - tool: Edit
    subject: "/repo/ccnavi/cli.py"
    why: 同上。ソースも main では触らない
  - tool: Write
    subject: "/repo/.gitignore"
    why: 隠しファイルも同じ
  - tool: Write
    subject: "/repo/.claude/skills/commit/SKILL.md"
    why: .claude/ の下も worktrees/ 以外は main では触らない
  - tool: Write
    subject: "/repo/.claude/worktrees/x/.claude/settings.json"
    why: worktree の中でも hook の登録は触らない（guard-settings）。統合で main の登録になる
  - tool: Edit
    subject: "/repo/.claude/worktrees/x/.claude/settings.local.json"
    why: 個人の上書きも同じ。permissions を足せる
  - tool: Bash
    subject: "git push origin main"
    why: エージェントからは push しない
  - tool: Bash
    subject: "cd /repo && git push"
    why: コマンド列の途中でも当たる
  - tool: Bash
    subject: "/usr/bin/git push"
    why: パス付きでも当たる
  - tool: Bash
    subject: "echo $(git push origin main)"
    why: コマンド置換の中も実行される
  - tool: Bash
    subject: "git reset --hard HEAD~1"
    why: 作業中の変更が消える
  - tool: Bash
    subject: "git branch -D feature"
    why: 未マージのブランチが消える
  - tool: Bash
    subject: "git status"
    why: 生の git はサブコマンドによらず止め、ラッパへ寄せる
  - tool: Bash
    subject: "/usr/bin/git.exe diff"
    why: パス付きでも拡張子付きでも、コマンドの位置に立つ git は当たる
  - tool: Bash
    subject: "git -c diff.external=touch diff"
    why: 読むだけに見えて任意コマンドを実行する形
  - tool: Bash
    subject: "rm -rf /tmp/x"
    why: 再帰的な強制削除は戻せない
  - tool: Bash
    subject: "find /repo -name *.log -delete"
    why: >-
      探すついでに消す形。allow の prefer-glob が単純な find を通すので、
      通してはいけない形を deny で先に外す。タイプの順で deny が先に当たる
  - tool: Bash
    subject: "cat <<'EOF' > notes.md"
    why: ヒアドキュメントは検査を通らない経路になる
  - tool: Bash
    subject: "cat /repo/.env"
    why: 認証情報。settings.json はシェル経由を止められない
  - tool: Bash
    subject: "cat /repo/.env.production"
    why: 環境名が付いた形も同じ場所
  - tool: Bash
    subject: "cat /repo/certs/server.pem"
    why: 同上
  - tool: Bash
    subject: "cat /home/u/.aws/credentials"
    why: 同上
  - tool: Bash
    subject: "cat /repo/secrets/token.txt"
    why: 同上
  - tool: Write
    subject: "/repo/.claude/ccnavi/rules.yml"
    why: ガード自身の設定
  - tool: Edit
    subject: "/repo/.claude/worktrees/x/.claude/ccnavi/rules.yml"
    why: >-
      作業ツリーの写しも止める（guard-ccnavi-config）。統合すればそのまま main の
      ルールになる。直したい形は下書きを検証して利用者に渡す
  - tool: Write
    subject: "/repo/.claude/worktrees/x/.claude/ccnavi/phases.yml"
    why: フェーズの種類は人が持つ。エージェントが書けるとレビュー不要の種類を作ってから使える
  - tool: Edit
    subject: "/repo/.claude/ccnavi/risk.yml"
    why: リスクの配点も同じ。自分の作業の重さを自分で決められる
  - tool: Write
    subject: "/repo/.claude/hooks/lint-py.sh"
    why: ガードを起動する hook 本体
  - tool: Edit
    subject: "/repo/docs/../.claude/ccnavi/rules.yml"
    why: 迂回した綴りでも行き着く先で当たる
  - tool: Bash
    subject: "echo x > /repo/.claude/ccnavi/rules.yml"
    why: Write で拒否した場所。リダイレクトで同じところに届く
  - tool: Bash
    subject: "cd /repo && printf x >> .claude/hooks/lint-py.sh"
    why: 相対の綴りでも、追記でも同じ場所
  - tool: Bash
    subject: "sed -i s/deny/allow/ /repo/.claude/ccnavi/rules.yml"
    why: その場で書き換える形
  - tool: Bash
    subject: "cp /tmp/x /repo/.claude/hooks/lint-py.sh"
    why: 別の場所から上書きする形。行き先に名前が来ている
  - tool: Bash
    subject: "mv /repo/.claude/ccnavi/rules.yml /tmp/old.yml"
    why: 移した元が消える。ルールが読めなくなる
  - tool: Bash
    subject: "rm /repo/.claude/ccnavi/log.jsonl"
    why: 記録を消すのも書き換えのうち
  - tool: Bash
    subject: "echo x | tee /repo/.claude/ccnavi/rules.yml"
    why: リダイレクトを使わない書き込み
  - tool: Write
    subject: "/repo/.claude/settings.json"
    why: hook の登録そのもの。ルールを触らずにガードを外せる
  - tool: Edit
    subject: "/repo/.claude/settings.local.json"
    why: permissions を足せるので同じ強さを持つ
  - tool: Bash
    subject: "echo {} > /repo/.claude/settings.json"
    why: 設定もシェルから届く
  - tool: Bash
    subject: "cp /tmp/x /repo/.claude/settings.local.json"
    why: 行き先に来た設定ファイル
  - tool: Write
    subject: "/repo/.claude/scripts/ccnavi-git.sh"
    why: git の入口。書き換えれば git のルールがまとめて外れる
  - tool: Bash
    subject: "sed -i s/push/x/ /repo/.claude/scripts/ccnavi-git.sh"
    why: 通さないはずのサブコマンドを通す形に変えられる
  - tool: Bash
    subject: "cd /repo/.claude/worktrees/x && echo x > ../../scripts/ccnavi-git.sh"
    why: .claude を通らない綴り。Bash の対象は解かれないので名前で捕まえる

ask:
  - tool: Write
    subject: "/repo/.claude/worktrees/x/pyproject.toml"
    why: 実行時の依存が変わる。main の側は deny なので作業ツリーで見る
  - tool: Bash
    subject: "jq -r '.hooks.PostToolUse[0].hooks[0].command, .env.CCNAVI_BIN_PATH' .claude/settings.json"
    why: >-
      jq のフィールド参照 `.env` は認証情報のファイル名ではない。以前はここで
      credentials に当たり、設定を読むだけの操作が「中身を読むな」と止められていた。
      いまはどのルールにも当たらず、権限モードへ渡って確認になる。allow に
      jq を足せば通るが、それは網を広げる別の判断なので、ここでは当たり方を
      そのまま記録する
  - tool: Write
    subject: "/repo/.claude/worktrees/x/.current-ticket.md"
    why: 作業範囲の提案。承認は別の経路。main の側は deny なので作業ツリーで見る
  - tool: Bash
    subject: "curl https://example.com"
    why: >-
      外から取ってくるコマンド。止めはしないが、調査で一度きりなら WebFetch、
      何度も叩くなら sh に固める。人が通せば取ってきた文字列はそのまま
      コンテキストに載るので、そのことも文面で断る
  - tool: Bash
    subject: "cat /repo/urls.txt | wget -i -"
    why: パイプの後ろに立つ取得も拾う。コマンドの先頭なら当たる
  - tool: Bash
    subject: "echo curl is a tool"
    why: >-
      引数に出ただけの綴りには当たらない。どのルールも言及せず権限モードへ渡る。
      当たると、取得について書く作業がそのまま止まる
  - tool: Bash
    subject: "docker run --rm alpine"
    why: 同上
  - tool: Bash
    subject: "bash -c 'ls'"
    why: 読み切れないコマンド。allow は当てない
  - tool: Bash
    subject: "cat /repo/README.md | head -20"
    why: >-
      後ろに別のコマンドが続く行に prefer-read-grep は当てない。allow は当たった
      時点で呼び出し全体を通すので、そこまで当てると cat と書いただけで隣の
      コマンドまで無条件になる。Read ツールの勧めもここでは出ない
  - tool: Bash
    subject: "cd /repo/.claude/worktrees/git-wrapper && ls"
    why: >-
      パスの中の git は raw-git に当たらない。当たると worktree の出入りが丸ごと止まる。
      cd と ls を allow に書いてはいないので、権限モードへ渡る
  - tool: Bash
    subject: "sed -n 1,20p /repo/logs/git-20260907-000000-1.log"
    why: ラッパが残した記録を読む手。-i の無い sed はどの deny にも当たらず、allow にも無い
  - tool: Bash
    subject: "sed -n 1,20p /repo/.claude/ccnavi/rules.yml"
    why: ガードの設定でも、-i が無ければ書き換えない。deny には当たらない
  - tool: Bash
    subject: "uv run python -m unittest discover -s tests -t ."
    why: 検査コマンド。どのルールも言及しない
  - tool: Bash
    subject: "uv run python -m ccnavi --rules /repo/.claude/ccnavi/rules.yml --test Bash ls"
    why: ルールを確かめる手そのもの。ルールファイルの名前が引数に出ても deny には当たらない
  - tool: Bash
    subject: 'grep -n "git push" README.md'
    why: >-
      引用された語は実行位置ではないので raw-git には当たらない。引用の中の空白は
      区切りの印に置き換わるので、「1 本だけの grep」を求める prefer-read-grep にも
      当たらず、権限モードへ渡る。引用に空白の無い grep は allow の側にある
  - tool: Bash
    subject: 'grep -n "rm -rf" /repo/.claude/ccnavi/rules.yml'
    why: 引用の中の rm -rf は recursive-delete に当たらない。allow は上と同じ理由で外れる
  - tool: Bash
    subject: "grep -n \"regex: '(>\" /repo/.claude/ccnavi/rules.yml"
    why: 引用の中の > は文字であって書き込み先を連れてこない。deny には当たらない
  - tool: Bash
    subject: 'grep -n "<<EOF" /repo/README.md'
    why: >-
      引用の中で他の字と並んだ << は 1 字ずつ区切られ、heredoc には当たらない。
      引用が << だけの 1 語（grep -n "<<" f）は区別が付かず止まる。README「読み切れないとき」
  - tool: Bash
    subject: "cp /repo/.claude/ccnavi/rules.yml /tmp/backup.yml"
    why: 写しを取っているだけ。cp は行き先の側だけを見るので deny には当たらない
  - tool: Bash
    subject: "diff /repo/.claude/settings.json /repo/.claude/settings.local.json"
    why: 2 つ並べて見比べるだけ。deny には当たらない
  - tool: Read
    subject: "/repo/README.md"
    why: Read はどの deny にも当たらない。allow にも書いていないので権限モードへ渡る
  - tool: Read
    subject: "/repo/.claude/settings.json"
    why: 設定の Read も止めない。止めると何が効いているか分からなくなる
  - tool: Read
    subject: "/repo/.claude/ccnavi/phases.yml"
    why: guard-ccnavi-config は Write / Edit だけ。読むのは止めない

allow:
  - tool: Bash
    subject: "sh .claude/scripts/ccnavi-git.sh status --porcelain"
    why: git の入口。サブコマンドの選別はラッパの中で行う
  - tool: Bash
    subject: "sh .claude/scripts/ccnavi-git.sh push -u origin i0001"
    why: push もラッパの入口。送ってよい形か（force でない、main へ直接でない）はラッパが選別する
  - tool: Bash
    subject: "cd /repo && sh .claude/scripts/ccnavi-git.sh worktree add .claude/worktrees/x -b x"
    why: このプロジェクトの作業手順。コマンド列の途中でも通る
  - tool: Bash
    subject: "grep -n TODO ccnavi/cli.py"
    why: 読むだけ。prefer-read-grep が当てて通す
  - tool: Bash
    subject: "# git push origin main"
    why: コメントだけの行は何も走らない
  - tool: Write
    subject: "/repo/.claude/worktrees/x/ccnavi/cli.py"
    why: 作業ツリーの中のソース。main の側は deny
  - tool: Write
    subject: "/repo/.claude/worktrees/x/tests/test_glob.py"
    why: 同上
  - tool: Write
    subject: "/repo/.claude/worktrees/x/README.md"
    why: 同上。文書も作業ツリーで直して main に戻す
  - tool: Write
    subject: "/repo/.claude/worktrees/x/.vscode/settings.json"
    why: guard-settings が止めるのは .claude/ の下の settings だけ。エディタの設定は作業ツリーで直せる
  - tool: Edit
    subject: "/repo/.claude/worktrees/x/.claude/ccnavi/rule-samples.yml"
    why: >-
      同じ置き場でも見本は止めない（guard-ccnavi-config は rules / phases / risk の 3 本だけ）。
      ルールを足したら見本も足すのはエージェントの仕事
  - tool: Write
    subject: "/repo/.claude/worktrees/x/wip/tickets/todo/i0001.md"
    why: 提案は作業ツリーで書く。効くのは承認済みの写しの側
  - tool: Bash
    subject: "cat /repo/.claude/ccnavi/rules.yml"
    why: ガードの設定は読むほうが普通。名前が出ただけでは止めない
  - tool: Bash
    subject: "grep -n cp /repo/.claude/hooks/lint-py.sh"
    why: 書き込むコマンドの名前を探しているだけ。コマンドの先頭に無い
  - tool: Bash
    subject: "cat /repo/.claude/ccnavi/rules.yml > /tmp/x"
    why: リダイレクトはあるが行き先が別の場所
  - tool: Bash
    subject: "cat /repo/.claude/settings.json"
    why: 設定も読むのは普通
  - tool: Bash
    subject: "cat /repo/.claude/scripts/ccnavi-git.sh"
    why: ラッパの中身を読むのは普通
  - tool: Bash
    subject: "sh /repo/.claude/scripts/ccnavi-git.sh diff --stat"
    why: これが git の打ち方そのもの。ここを止めたら何もできない
  - tool: Bash
    subject: "cp /repo/.claude/scripts/ccnavi-git.sh /tmp/backup.sh"
    why: 控えを取っているだけ。ccnavi-git.sh の名前が出るので allow に当たる
  - tool: Bash
    subject: "find /repo/ccnavi -name *.py"
    why: >-
      探すだけの find。prefer-glob が当てて通し、Glob ツールのほうを一度だけ勧める。
      -exec が付いた形は shellread が読み切れないと言うので、ここには来ない
  - tool: Bash
    subject: "grep -rn TODO /repo/ccnavi"
    why: >-
      1 本だけの検索。prefer-read-grep が当てて通し、Grep ツールのほうを
      セッションに一度だけ勧める。読む手を取り上げるのが目的ではない
