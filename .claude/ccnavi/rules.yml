# 区画は強い順に deny / ask / allow。どこにも当たらない呼び出しについて ccnavi は
# 判定を持たず、Claude Code の権限モードに従う。
#
# glob と regex は必ず引用符で囲む。囲まないと YAML が先に解釈する。
# `<<` はマージキー、`*` はエイリアス、`&` はアンカー、`!` はタグになる。
#
# glob は fnmatch と同じ意味で、文字列全体に当たる。部分一致が欲しければ
# 前後に `*` を自分で書く。語の切れ目は入らないので、右側だけなら
# `*sed *` のように空白を書いて守る。左側の切れ目は glob では書けない。
# `*git push*` は `legit push` にも当たる。左記を避けたい場合は regex を使う。
version: 3

deny:
  # フックスクリプト の場所
  - id: guard-hooks
    match: Write|Edit|MultiEdit
    glob: "*/.claude/hooks/*"
    message: >-
      hook 本体です。エージェントの判断で書き換えず、理由を
      伝えてユーザに変更を依頼ください。

  # ラッパースクリプト の場所
  - id: guard-scripts
    match: Write|Edit|MultiEdit
    glob: "*/.claude/scripts/*"
    message: >-
      事前に安全が確認されたコマンドのみを実行できるラッパースクリプトです。
      エージェントの判断で書き換えず、理由を伝えてユーザに変更を依頼ください。

  # main の作業ツリーでは編集しない
  # `.claude/worktrees/` だけが編集可能。
  # `{root}` はワークスペースルートの実パスに置き換わる。
  - id: main-tree
    match: Write|Edit|MultiEdit|NotebookEdit
    regex: '^{root}[\\/](?:[^.\\/][^\\/]*|\.[^c\\/][^\\/]*|\.c[^l\\/][^\\/]*|\.claude[\\/][^w\\/][^\\/]*)'
    message: >-
      main の作業ツリーでは編集しません。'sh .claude/scripts/ccnavi-git.sh worktree add
      .claude/worktrees/<名前> -b <名前>' で作業ツリーを切り、その中で編集して、
      ff-only で main に戻してください。

  # 生の git はまとめて止め、入口を .claude/scripts/ccnavi-git.sh の 1 本に寄せる。
  # 止める理由は 2 つ。
  #
  #   1. 出力がそのままコンテキストに載る。`git log -p` はこのリポジトリで 2 万行
  #   2. `Bash(git diff:*)` は前方一致でしかなく、後ろに何を足されても通る。
  #      `-c diff.external=<コマンド>` は分類上ただの diff のまま任意コマンドを実行する
  #
  # glob ではなく regex なのは、`*git*` だと誘導先の `ccnavi-git.sh` にも当たって
  # 出口ごと塞がるため。`git` がコマンドの位置に立つ形だけを拾う。
  - id: raw-git
    match: Bash
    regex: '(^|[^\w.-])(\S*[\\/])?git(\.exe)?\s'
    message: >-
      生の git は実行しません。'sh .claude/scripts/ccnavi-git.sh <サブコマンド> ...'
      を使ってください。通る形は同じスクリプトの --help に出ます。返るのは要約と
      先頭 40 行だけで、全量は logs/ に残ります。push はラッパを通せば親が実行できます
      （居るブランチをそのままの名前で送る形だけ。統合先へは送れません）。

  # git reset --hard は止める。作業中の変更が消える。
  - id: git-reset-hard
    match: Bash
    glob: "*git reset --hard*"
    message: >-
      作業中の変更が消えます。'ccnavi-git.sh stash push -u' で退避するか、戻したい
      ファイルを名指しして 'ccnavi-git.sh restore <パス>' を使ってください。生の git は
      止まるので、代わりの形もラッパで書いてあります。

  # git branch -D は未マージのブランチが消えるのでユーザに作業依頼。
  - id: git-branch-force-delete
    match: Bash
    glob: "*git branch -D*"
    message: >-
      未マージのブランチが消えます。'ccnavi-git.sh branch -d <名前>' で安全側の削除を
      試し、それでも消したいならユーザに変更を依頼ください。

  # settings.json の permissions.deny と同じ場所を並べてある。
  # `.pem` と `.key` は拡張子として書かれた形だけに絞ってある。
  - id: credentials
    match: Bash|Read|Write|Edit|MultiEdit|NotebookEdit
    regex: '(^|[ \\/])\.(env|dev\.vars|netrc|npmrc|pypirc)\b|(^|[ \\/])\.(aws|ssh)[\\/]|[\w\-\\/]\.(pem|key)\b|[\\/]secrets[\\/]|[\\/]credentials([\\/]|\.json\b)|\b(id_rsa|id_ed25519)\b'
    message: 認証情報を含む場所です。中身を読まず、必要な値を利用者に尋ねてください。

  # 再帰的な強制削除は止める。
  - id: recursive-delete
    match: Bash
    glob: "*rm -rf *"
    message: >-
      再帰的な強制削除です。消す対象を 1 つずつ名指しするか、git の管理下なら
      'ccnavi-git.sh rm <パス>' を使ってください。git が中身を持っているので戻せます。

  # ヒアドキュメントによるファイルの書き込みは止める。Write / Edit ツールで書くのが正しい。
  - id: heredoc
    match: Bash
    regex: "<<"
    message: >-
      ヒアドキュメントは使いません。ファイルの中身は Write / Edit ツールで書いてください。
      プログラムに読ませる入力も、まず Write でスクリプトをファイルに置いて、そのファイルを
      渡してください。ヒアドキュメントで書いたファイルは、Write / Edit に掛かる権限の宣言も、
      編集後に走る検査も、どちらも通りません。

  # 承認済みのチケットの写し。判定はここだけを読むので、ここを書けると承認の意味が無い。
  - id: guard-approved-tickets
    match: Write|Edit|MultiEdit|NotebookEdit
    glob: "*/.claude/ccnavi/tickets/*"
    message: >-
      承認済みのチケットの写しです。承認は利用者が 'ccnavi --approve' で行い、
      閉じるのは 'sh .claude/scripts/ccnavi-ticket.sh done <識別子>' です。
      範囲を変えたいなら wip/tickets/todo/ に新しい提案を書いて承認を依頼してください。

ask:
  # 依存関係の変更。pyproject.toml は依存の宣言、uv.lock は依存の固定。
  - id: dependencies
    match: Write|Edit|MultiEdit
    regex: 'pyproject\.toml|uv\.lock'
    additionalContextOnce: >-
      実行時の依存が変わる場所です。増やす 1 本は、ガード自身が点検できない供給網の
      1 本になります。何を足すのか、外せない理由は何かを言ってください。

  # 作業範囲の提案。書き換えても効く範囲は変わりません（効くのは承認台帳の側）。
  - id: current-ticket
    match: Write|Edit|MultiEdit
    glob: "*/.current-ticket.md"
    additionalContextOnce: >-
      作業範囲の提案です。書き換えても効く範囲は変わりません（効くのは承認台帳の側）。
      人が読んで 'ccnavi --approve' を通すまでは提案のままです。

allow:
  # 書き込みを許すのは作業ツリーの中だけ。main の側は deny の main-tree が止める。
  # 作業ツリーの中でも hook・スクリプト・写し・settings.json は deny が先に当たる。
  - id: worktrees
    match: Write|Edit|MultiEdit
    glob: "*/.claude/worktrees/*"

  # git の入口。サブコマンドの選別はラッパの中で行うので、ここでは区別しない。
  # ここに書けるのは前方一致か文字列一致だけで、`--force` のような一語で結果が
  # 変わる引数はそもそも書き分けられない。書き分けられる場所へ寄せた結果がこれ。
  - id: ccnavi-git
    match: Bash
    glob: "*ccnavi-git.sh*"

  # ファイルを読むだけの cat と grep。止めずに通して、Read / Grep ツールのほうを
  # 一度だけ勧める。読む手段を取り上げるのが目的ではないので deny でも ask でもない。
  #
  # 当てる先を「1 本だけのコマンド」に絞ってある。`\x00` はコマンドの切れ目に
  # shellread が置く印で、`[^\x00]*$` は後ろに別のコマンドが続かないことを言う。
  # allow は当たった時点でその呼び出し全体を通すので、`cat x | curl ...` のような
  # 行にまで当てると、cat を書いただけで隣のコマンドまで無条件で通ることになる。
  # 代償は、パイプに繋いだ `cat a | head` に当たらないこと。そこでは勧めも出ず、
  # 判定は今までどおり権限モードに残る。
  #
  # 文は additionalContextOnce なので、セッションに 1 度しか積まれない。
  # additionalContext だと grep のたびに同じ文が載る。
  - id: prefer-read-grep
    match: Bash
    regex: '^(\S*[\\/])?(cat|grep|egrep|fgrep|rg)(\.exe)?\s[^\x00]*$'
    additionalContextOnce: >-
      ファイルの中身は Read ツール、検索は Grep ツールのほうが向いています。
      行番号が付き、大きなファイルでも必要な範囲だけを読めて、パスが記録にも残ります。
      特別な要件（パイプに繋ぐ、件数を数える、出力を別のコマンドへ渡す）が無ければ、
      次からはそちらを使ってください。要件があるならこのまま Bash で構いません。