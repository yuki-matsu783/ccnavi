# このファイルは ccnavi 自身のリポジトリのルール。ccnavi を自分自身に仕掛けてある。
#
# 区画は強い順に deny / ask / allow。どこにも当たらない呼び出しは暗黙的 ask になり、
# 人に確認が出る。だから allow は「このプロジェクトで普通にやること」を並べる場所で、
# 権限を配る場所ではない。ここに書き足すたびに、人が見なくなる範囲が広がる。
#
# glob と regex は必ず引用符で囲む。囲まないと YAML が先に解釈する。
# `<<` はマージキー、`*` はエイリアス、`&` はアンカー、`!` はタグになる。
#
# glob は fnmatch と同じ意味で、文字列全体に当たる。部分一致が欲しければ
# 前後に `*` を自分で書く。語の切れ目は入らないので、右側だけなら
# `*sed *` のように空白を書いて守る。左側の切れ目は glob では書けない。
# `*git push*` は `legit push` にも当たる。そこが要るルールは regex を使う。
version: 3

deny:
  - id: guard-config
    match: Write|Edit|MultiEdit
    glob: "*/.claude/ccnavi/*"
    message: >-
      ガード自身のルールです。エージェントの判断で書き換えず、変更が要る理由を伝えて
      利用者に依頼してください。

  - id: guard-hooks
    match: Write|Edit|MultiEdit
    glob: "*/.claude/hooks/*"
    message: >-
      ガードを起動する hook 本体です。エージェントの判断で書き換えず、変更が要る理由を
      伝えて利用者に依頼してください。

  # 上の 2 つは Write / Edit という名指しのツールにしか掛からない。同じ場所へ
  # シェルから届く道が開いたままで、`echo x > .claude/ccnavi/rules.yml` は
  # allow:shell-inspection に当たって素通りしていた。拒否したはずのファイルが
  # リダイレクト 1 つで書き換わるなら、上の 2 つは掛かっていないのと同じ。
  #
  # 場所を名指しするだけにはしない。ここは読むほうが普通の場所で、
  # `cat .claude/ccnavi/rules.yml` も `tail .claude/ccnavi/log.jsonl` も
  # 毎日打つ。credentials のように名前が出たら止める形にすると、
  # ルールを読む手がまとめて止まる。だから書き込む綴りだけを 4 つ数える。
  #
  #   1. リダイレクトの行き先。`>` `>>` `>|` `&>` はどれも `>` を含み、
  #      shellread が `> 行き先` の形に均してから渡してくる。`>` より後ろだけを
  #      見るので、`cat .claude/ccnavi/rules.yml > /tmp/x` は当たらない。
  #   2. 名指ししたところを必ず書き換えるコマンド。`\x00` はコマンドの切れ目に
  #      shellread が置く印で、`(^|\x00)` はコマンドの先頭を意味する。
  #      これを打たないと `grep -n mv .claude/hooks/lint-py.sh` に当たる。
  #      `[^\x00]*` も同じ印で、名指しは同じコマンドの中に限られる。
  #      mv がこちらに居るのは、移した元が消えるから。移されたルールは
  #      読めなくなり、ガードは組み込みの既定に落ちる。
  #   3. 元と行き先がある cp / ln / install は、行き先の側だけ。行き先は
  #      最後の引数なので、コマンドの終わりに来た形に絞る。
  #      `cp .claude/ccnavi/rules.yml /tmp/backup.yml` は写しを取っているだけで、
  #      ここを止めると、変更を利用者に頼む前に控えを置く手も止まる。
  #   4. sed だけは `-i` が付いた形に絞る。`sed -n 1,20p` はただの読み。
  #
  # 読み切れないコマンド（`bash -c`、閉じない引用符）は生の文字列に当たる。
  # 綴りはどれも文字列としてもそのまま残るので、そこでも当たる。
  # インタプリタに 1 行渡す形（`python -c` に書いた open）はここでは止まらない。
  - id: guard-shell-write
    match: Bash
    regex: '>[>|&]* ?[^ \x00]*\.claude[\\/](ccnavi|hooks)[\\/]|(^|\x00)(mv|rm|tee|dd|truncate|patch|shred)\b[^\x00]*\.claude[\\/](ccnavi|hooks)[\\/]|(^|\x00)(cp|ln|install)\b[^\x00]*\.claude[\\/](ccnavi|hooks)[^ \x00]*($|\x00)|(^|\x00)sed\b[^\x00]*-i[^\x00]*\.claude[\\/](ccnavi|hooks)[\\/]'
    message: >-
      ガード自身の設定と hook を、シェルからの書き込みで変えようとしています。
      Write / Edit で拒否される場所です。綴りを変えても同じ場所なので、変更が要る
      理由を伝えて利用者に依頼してください。読むだけなら cat や grep はそのまま通ります。

  # 生の git はまとめて止め、入口を .claude/scripts/ccnavi-git.sh の 1 本に寄せる。
  # 止める理由は 2 つで、どちらも許可ルールの粒度では書けない。
  #
  #   1. 出力がそのままコンテキストに載る。`git log -p` はこのリポジトリで 2 万行
  #   2. `Bash(git diff:*)` は前方一致でしかなく、後ろに何を足されても通る。
  #      `-c diff.external=<コマンド>` は分類上ただの diff のまま任意コマンドを実行する
  #
  # glob ではなく regex なのは、`*git*` だと誘導先の `ccnavi-git.sh` にも当たって
  # 出口ごと塞がるため。`git` がコマンドの位置に立つ形だけを拾う。
  # `/usr/bin/git push` は拾い、`ccnavi-git.sh` は前がダッシュなので外れる。
  - id: raw-git
    match: Bash
    regex: '(^|[^\w.-])(\S*[\\/])?git(\.exe)?\s'
    message: >-
      生の git は実行しません。'sh .claude/scripts/ccnavi-git.sh <サブコマンド> ...'
      を使ってください。通る形は同じスクリプトの --help に出ます。返るのは要約と
      先頭 40 行だけで、全量は logs/ に残ります。push はラッパも通さないので、
      ブランチをそのまま残して利用者に依頼してください。

  - id: git-push
    match: Bash
    glob: "*git push*"
    message: >-
      git push はエージェントからは実行しません。ブランチをそのまま残し、利用者に
      push を依頼してください。

  - id: git-reset-hard
    match: Bash
    glob: "*git reset --hard*"
    message: >-
      作業中の変更が消えます。'git stash' で退避するか、戻したいファイルを名指しして
      'git restore' を使ってください。

  - id: git-branch-force-delete
    match: Bash
    glob: "*git branch -D*"
    message: >-
      未マージのブランチが消えます。'git branch -d' で安全側の削除を試し、それでも
      消したいなら利用者に依頼してください。

  # settings.json の permissions.deny と同じ場所を並べてある。あちらは
  # Read と Write という名指しのツールにしか掛からないので、同じ場所へ
  # シェルから届く道が開いたままになる。`cat certs/server.pem` を止められるのは
  # こちらだけで、match に Bash を入れられることがこのルールの値打ちになる。
  #
  # `.pem` と `.key` は拡張子として書かれた形だけに絞ってある。素の `\.key\b` は
  # `jq '.key' data.json` に当たった。誤検知の多い拒否は、そのうち文面ごと
  # 読まれなくなる。絞ったぶん、`.key` という名前のファイルそのものは外れる。
  - id: credentials
    match: Bash|Read|Write|Edit|MultiEdit
    regex: '\.env|\.dev\.vars|[\w\-\\/]\.pem\b|[\w\-\\/]\.key\b|[\\/]secrets[\\/]|[\\/]credentials([\\/]|\.json\b)|\.aws[\\/]|\.ssh[\\/]|id_rsa|id_ed25519|\.netrc|\.npmrc|\.pypirc'
    message: 認証情報を含む場所です。中身を読まず、必要な値を利用者に尋ねてください。

  - id: recursive-delete
    match: Bash
    glob: "*rm -rf *"
    message: >-
      再帰的な強制削除です。消す対象を 1 つずつ名指しするか、git の管理下なら
      'git rm' を使ってください。

  - id: heredoc
    match: Bash
    regex: "<<"
    message: >-
      ヒアドキュメントは使いません。ファイルの中身は Write / Edit ツールで書いてください。
      プログラムに読ませる入力も、まず Write でスクリプトをファイルに置いて、そのファイルを
      渡してください。ヒアドキュメントで書いたファイルは、Write / Edit に掛かる権限の宣言も、
      編集後に走る検査も、どちらも通りません。

ask:
  # 生の git を止めたので、コミットが通る道はラッパだけになった。
  # 錨を `git commit` に打ったままだと、この確認はどこにも当たらなくなる。
  - id: commit
    match: Bash
    regex: 'ccnavi-git\.sh\s+commit\b'
    message: >-
      コミットは 1 回ごとに人が見ます。何を含めたか、メッセージが変更と合っているかを
      確かめてください。

  - id: dependencies
    match: Write|Edit|MultiEdit
    regex: 'pyproject\.toml|uv\.lock'
    message: >-
      実行時の依存が変わる場所です。増やす 1 本は、ガード自身が点検できない供給網の
      1 本になります。何を足すのか、外せない理由は何かを言ってください。

  - id: current-ticket
    match: Write|Edit|MultiEdit
    glob: "*/.current-ticket.md"
    message: >-
      作業範囲の提案です。書き換えても効く範囲は変わりません（効くのは承認台帳の側）。
      人が読んで 'ccnavi --approve' を通すまでは提案のままです。

allow:
  # このリポジトリで普通にやること。ここに無いものは人に確認が出る。
  #
  # Grep と Glob は書かない。判定が対象を取り出せるツールでないと、ルールは
  # 当たりようがない（cli.subject_of）。対象を取り出せないツールは判定に
  # 届かないまま通るので、allow に書いても死んだ行が 1 つ増えるだけになる。
  - id: read-anything
    match: Read
    regex: "."

  - id: source
    match: Write|Edit|MultiEdit
    regex: '(^|[\\/])(ccnavi|tests|testdata)[\\/]'

  - id: project-files
    match: Write|Edit|MultiEdit
    regex: '(^|[\\/])(README|HANDOVER|CLAUDE|requirements|ccnavi)\.md$|(^|[\\/])(build|main)\.py$'

  - id: worktrees
    match: Write|Edit|MultiEdit
    glob: "*/.claude/worktrees/*"

  # コマンドの regex は行頭に錨を打たない。判定に渡るのは実行される部分を
  # 繋いだ 1 本の文字列で、`cd /repo && git status` のように前に別の語が来る。
  # `^` を打つと、繋がった 2 本目以降がどれも当たらず、普通の作業が丸ごと
  # 暗黙的 ask に落ちる。代わりに `\b` で語の切れ目を要求して、`controls` の
  # 中の `ls` のような当たり方を防ぐ。
  #
  # 錨を外したぶん網は粗い。`git status && 知らないもの` は、allow に当たった
  # 側の語だけで全体が通る。deny は文字列全体に当たり続けるので危ないものは
  # 止まるが、確認の網から漏れる形は残る。ここを詰めるなら、判定を繋いだ
  # 文字列ではなくコマンド 1 本ずつに当てる作りが要る。
  # git の入口。サブコマンドの選別はラッパの中で行うので、ここでは区別しない。
  # ここに書けるのは前方一致か文字列一致だけで、`--force` のような一語で結果が
  # 変わる引数はそもそも書き分けられない。書き分けられる場所へ寄せた結果がこれ。
  - id: ccnavi-git
    match: Bash
    glob: "*ccnavi-git.sh*"

  - id: checks
    match: Bash
    regex: '\buv\s+run\b'

  - id: shell-inspection
    match: Bash
    regex: '\b(ls|cat|sed|head|tail|find|grep|echo|mkdir|cp|mv|pwd|wc|sort|uniq|diff)\b'
