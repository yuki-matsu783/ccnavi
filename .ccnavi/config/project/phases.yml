# フェーズ定義（自身のレイヤー）。ユーザが持つ設定で、エージェントは書き換えない。
#
# 判定が使う定義は、共通レイヤー（.ccnavi/config/common/phases.yml）とこのファイルの統合結果になる。
# 共通レイヤーには、どのプロジェクトでも同じ構成（`src/*`・`tests/*` など）を前提にできる定義
# （quick・research・design・acceptance・implement・design-feedback・implement-feedback）を置く。
# ここには、`scope` がこのワークスペースのレイアウトに依存する定義だけを置く。共通レイヤーに置くと、
# projects/ の下のプロジェクトにも同じ scope が適用されてしまう。
#
# 書き方（`plan:` の並べ方、`after`、`feedback:`、親の `phases:` へのコピー）は共通レイヤーの
# phases.yml の冒頭と同じ。定義は順序を持たない。
#
# `id`（キー）と `title` はどちらも一意。共通レイヤーの定義と同じ id で中身が違うか、`title` が
# 重なれば --lint でエラーにし、このファイルのその定義だけを使わない（同じ id なら共通の定義を使う）。
# 共通レイヤーにもこのファイルにも定義が無ければ、plan を持つ提案は承認の検査を通らない。
version: 1

phases:
  # ccnavi 自身の実装。共通レイヤーの implement（src/* と tests/*）に、このリポジトリに固有の
  # 置き場（ビルド・配布する sh・設定・拡張機能）を足した範囲。
  implement-ccnavi:
    kind: work
    title: 実装とテスト（ccnavi 自身）
    review: mr
    scope: ["src/*", "tests/*", "build.py", "pyproject.toml", "scripts/*", ".ccnavi/*", "extensions/*"]
    when: 振る舞いを変えるとき。受入テスト作成を先に置く（計画に受入テスト作成の項も置く）

  staging:
    kind: work
    title: ユーザがコピーする版の作成
    review: mr
    scope: ["wip/design/*", "tests/*"]
    when: 保護済みファイル（.ccnavi/scripts/、.claude/hooks/、rules.yml）を修正するとき。エージェントはそこに書けないので、完成品を wip/design/scripts/ に全文で配置し、ユーザがコピーする。受入テスト作成を先に置く（計画に受入テスト作成の項も置く）

  docs:
    kind: work
    title: 文書
    review: mr
    scope: ["README.md", "docs/*", "extensions/vscode/ccnavi-board/docs/*", "extensions/chrome/ccnavi-approval/docs/*", "CLAUDE.md", ".claude/skills/*"]

  # 作業の振り返りで出たスキルの候補を、ワークスペースの .claude/skills/ に配置する。
  # 候補の根拠を溜める docs/wiki/ も同じ子で直す（wiki 層。.ccnavi/docs/skill-wiki.md）。
  # 候補の拾い方と置き場は .ccnavi/docs/skill-review.md。子は親の範囲の中にしか置けないので、
  # 親の範囲に .claude/skills/ と docs/wiki/ が無ければこのフェーズ定義は使えず、提案チケットになる。
  skill-improve:
    kind: feedback
    title: スキル改善
    review: mr
    scope: [".claude/skills/*", "docs/wiki/*"]
    when: 振り返りでスキルの候補が出たとき（.ccnavi/docs/skill-review.md）。候補が無ければ置かない
