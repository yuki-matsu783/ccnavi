name: quick-work
description: 小さい作業を親 1 子 1 で回す。子は開発→haiku で横展開漏れ調査→sonnet で敵対的レビューの順で進める
when: 設計判断や並行作業が要らない小さい作業のとき。調査から文書まで通すなら full-phases を使う
plan:
- quick-work
feedback: []
flows:
  1:
    id: dev-sweep-review
    name: 開発→横展開漏れ調査→敵対的レビュー
    version: 1.0.0
    nodes:
    - id: start
      type: start
      name: 開始
      position:
        x: 0
        y: 0
      data: {}
    - id: develop
      type: prompt
      name: 開発
      position:
        x: 0
        y: 100
      data:
        prompt: チケットの範囲と成果物に沿って開発する。変更の型（同じ直し方が該当する場所の条件）を最後に 1 行で報告に書く。この型は次の横展開漏れ調査のプロンプトに含めて渡す。
    - id: sweep
      type: subAgent
      name: 横展開漏れ調査（haiku）
      position:
        x: 0
        y: 200
      data:
        description: 同じ型の直しが要る場所の取りこぼしを探す
        prompt: このノードは Agent ツールの model に haiku を指定して起動する。開発の報告にある変更の型と、直前の開発の差分を読み、同じ型の直しが要るのに直っていない場所を、リポジトリ全体から grep で洗い出す。直さず、場所・理由・確度を一覧で返す。見つからなければ「漏れなし」と、探した語と範囲を返す。
        builtInType: Explore
        model: haiku
    - id: fix
      type: prompt
      name: 漏れの反映
      position:
        x: 0
        y: 300
      data:
        prompt: 調査の一覧を確かめ、本当に漏れだと判断したものだけをチケットの範囲内で直す。範囲外のものは直さず、報告に書く。
    - id: review
      type: subAgent
      name: 敵対的レビュー（sonnet）
      position:
        x: 0
        y: 400
      data:
        description: 不具合が起きる経路を探す
        prompt: このノードは Agent ツールの model に sonnet を指定して起動する。ファイルは編集しない（直すのは次の指摘への対応）。差分の作者の意図を信じず、不具合を起こす入力・状態・並行実行・大文字小文字やパス区切りの違い・テストの抜けを探す。指摘は再現手順と根拠を添えて、重大度順に返す。問題が無ければ、確かめた観点を挙げて「指摘なし」と返す。
        builtInType: general-purpose
        model: sonnet
    - id: apply
      type: prompt
      name: 指摘への対応
      position:
        x: 0
        y: 500
      data:
        prompt: 指摘を 1 件ずつ検証し、再現できたものについて、現実の入力で起きるか・直しが処理を増やす分に見合うかをフラットに評価する。見合うものだけ直し、細かすぎる・過剰な指摘は見送る。直さない指摘は理由を報告に書く。
    - id: end
      type: end
      name: 終了
      position:
        x: 0
        y: 600
      data: {}
    connections:
    - id: c1
      from: start
      to: develop
      fromPort: output
      toPort: input
    - id: c2
      from: develop
      to: sweep
      fromPort: output
      toPort: input
    - id: c3
      from: sweep
      to: fix
      fromPort: output
      toPort: input
    - id: c4
      from: fix
      to: review
      fromPort: output
      toPort: input
    - id: c5
      from: review
      to: apply
      fromPort: output
      toPort: input
    - id: c6
      from: apply
      to: end
      fromPort: output
      toPort: input
