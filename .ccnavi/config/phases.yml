# フェーズ定義（設計 9.7）。ユーザが持つ設定で、エージェントは書き換えない。
#
# ここは自身のレイヤー（ワークスペース自身のレイヤー）。`scope` のパスはこのワークスペースの
# レイアウトに従属しているので、共通レイヤー（.ccnavi/common/phases.yml）ではなくこちらに置く。
# 共通レイヤーに置くと、projects/ の下のプロジェクトにも同じ scope が適用されてしまう。
#
# 親チケットの `plan:` に、ここに書いたフェーズ定義の名前を順に並べる。それが全体計画で、
# `ccnavi --agree` が通過することが合意になる。レビューを受けたあとは `feedback:` に
# `kind: feedback` のフェーズ定義を並べて改版を出す（対応が無くても `[]` で出す）。
#
# `id`（キー）と `title` はどちらも一意。レイヤーをまたいで重なれば --lint でエラーにする。
# このファイルが無ければ、フェーズは番号だけの挙動に戻る。
version: 1

phases:
  research:
    kind: work
    title: 調査
    review: none
    scope: ["wip/research/*"]
    deliverables: ["wip/research/summary.md"]
    when: 既存の振る舞いや依存が分からないとき。分かっているなら省略する

  design:
    kind: work
    title: 設計
    review: mr
    scope: ["wip/design/*", "docs/*"]
    deliverables: ["wip/design/*.md"]
    when: 変更箇所が 3 か所を超えるか、外から見える振る舞いが変わるとき

  acceptance:
    kind: work
    title: 受入テスト作成
    review: mr
    scope: ["tests/*"]
    overlap: [implement]
    when: 振る舞いが変わるとき。実装と並行してよい

  implement:
    kind: work
    title: 実装とテスト
    review: mr
    scope: ["src/*", "tests/*", "build.py", "pyproject.toml", "scripts/*", ".ccnavi/*", ".ccnavi/common/phases.yml", "extensions/*"]
    requires: [acceptance]

  staging:
    kind: work
    title: ユーザがコピーする版の作成
    review: mr
    scope: ["wip/design/*", "tests/*"]
    requires: [acceptance]
    when: 保護済みファイル（.ccnavi/scripts/、.claude/hooks/、rules.yml）を修正するとき。エージェントはそこに書けないので、完成品を wip/design/scripts/ に全文で配置し、ユーザがコピーする

  docs:
    kind: work
    title: 文書
    review: mr
    scope: ["README.md", "docs/*", "extensions/vscode/ccnavi-board/docs/*", "extensions/chrome/ccnavi-approval/docs/*", "CLAUDE.md", ".claude/skills/*"]

  design-feedback:
    kind: feedback
    title: 設計フィードバック対応
    review: mr
    scope: ["wip/design/*", "docs/*"]

  implement-feedback:
    kind: feedback
    title: 実装フィードバック対応
    review: mr
    scope: inherit

  # 作業の振り返りで出たスキルの候補を、ワークスペースの .claude/skills/ に配置する。
  # 候補の根拠を溜める docs/wiki/ も同じ子で直す（wiki 層。docs/claude/skill-wiki.md）。
  # 候補の拾い方と置き場は docs/claude/skill-review.md。子は親の範囲の中にしか置けないので、
  # 親の範囲に .claude/skills/ と docs/wiki/ が無ければこのフェーズ定義は使えず、提案チケットになる。
  skill-improve:
    kind: feedback
    title: スキル改善
    review: mr
    scope: [".claude/skills/*", "docs/wiki/*"]
    when: 振り返りでスキルの候補が出たとき（docs/claude/skill-review.md）。候補が無ければ置かない