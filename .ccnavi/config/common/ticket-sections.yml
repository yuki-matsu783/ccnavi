# 提案の本文に求める見出し（共通レイヤー）。ユーザが持つ設定で、エージェントは書き換えない。
#
# `parent` は親の提案、`child` は子の提案の本文に求める `## <name>` の見出しの並び。承認の検査は、新規の
# 提案に欠けた見出しを warn で言う。`ccnavi ticket new` は親の雛形の本文に `parent` の見出しを並べ、`todo`
# （空欄の目印）を見出しの下に 1 行置く。目印が提案に残っていれば承認の検査は error で止める。Stop の AI 判定
# （R2）も、このファイルの見出しを親と子に求める（`.ccnavi/config/stop-review.md` があればそちらをそのまま使う）。
#
# 使う見出しは、このファイルと、親チケットの `project:` が指すレイヤーの
# `.ccnavi/config/project/ticket-sections.yml` を重ねたもの（空の `project:` はワークスペース自身のレイヤー）。
# レイヤーのファイルに `parent`（`child`）があれば、その種類の並びはこのファイルの並びと置き換わる。無い種類は
# このファイルの並びを使う。どちらにも無い種類は見出しを見ない。Stop の判定はこのファイルの並びだけを使う。
#
# `name` は並びの中で一意（大文字小文字は区別しない）。`todo` は書かなくてよい。知らないキーがあるか、形が
# 違えば --lint でエラーにし、そのファイルは使わない。
version: 1

parent:
  - name: 目的
    todo: （ここにこの作業の目的を書く）
  - name: 範囲
    todo: （ここにこの作業の範囲を書く）
  - name: 対象外
    todo: （ここにこの作業の対象外を書く）
  - name: 完了の確かめ方
    todo: （ここに完了をどう確かめるかを書く）
  - name: 計画の理由
    todo: （ここに計画の理由を書く）

# 子は承認のあと新しいセッションで始まり、本文が担当のサブエージェントへの引き継ぎになる。子には雛形が無い。
child:
  - name: 担当範囲
  - name: 親の要求との対応
  - name: 確認の手順
