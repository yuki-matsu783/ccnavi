# フェーズ定義（共通レイヤー）。ユーザが持つ設定で、エージェントは書き換えない。
#
# 判定が使う定義は、このファイルと、親チケットの `project:` が指すレイヤーの
# `.ccnavi/config/project/phases.yml` の統合結果になる（空の `project:` はワークスペース自身の
# レイヤー）。ここには、どのプロジェクトでも同じ構成（`src/*`・`tests/*` など）を前提にできる
# 定義だけを置く。`scope` が置き場のレイアウトに依存する定義は、各レイヤーの phases.yml に置く。
# 親チケットの `ticket start` が、このファイルをプロジェクトの `.ccnavi/config/common/` へ写す。
#
# 親チケットの `plan:` に、フェーズ定義の名前を並べ、項に `after: [番号]` で先行を書く
# （先に閉じてレビューが済んでいるべき項。指せるのは自分より小さい番号だけ）。`after` を
# 書かない項は何も待たない。最後の項がほかの全部を（推移的に）待つようにする。それが全体計画で、
# `ccnavi --agree` が通過することが合意になる。レビューを受けたあとは `feedback:` に
# `kind: feedback` のフェーズ定義を並べて改版を出す（対応が無くても `[]` で出す）。`feedback:` の
# 項も `after` で先行を書き（指せるのはフィードバック計画の番号だけ）、最後の項がほかの全部を待つ
# ようにする。独立した対応は最後に 1 項で受けるか、一直線に並べる。
# 計画が使う定義は、親の `phases:` に写す（`ccnavi --plan-order <親> --fill-phases`）。承認のあとの
# 判定は親の写しを読むので、このファイルを直しても進行中の親には届かない。
# 定義は順序を持たない。
#
# `id`（キー）と `title` はどちらも一意。レイヤーの定義と同じ id で中身が違うか、`title` が
# 重なれば --lint でエラーにし、レイヤーの側のその定義だけを使わない（同じ id なら共通の定義を使う）。
version: 1

phases:
  # 小さい作業を親 1 子 1 で回すための定義。計画は `plan: [quick-work]` の 1 項にする。
  # 範囲は親の範囲そのまま。親の提案に書いた範囲が、そのまま作業の上限になる。
  quick-work:
    kind: work
    title: 小さい作業
    review: mr
    scope: inherit
    when: 変更が 1〜2 ファイルに収まり、設計判断や並行作業が要らないとき

  research:
    kind: work
    title: 調査
    review: none
    scope: ["wip/research/*"]
    deliverables: ["wip/research/summary.md"]
    when: 既存の振る舞いや依存が分からないとき。分かっているなら省略する

  design:
    kind: work
    title: 設計
    review: mr
    scope: ["wip/design/*", "docs/*"]
    deliverables: ["wip/design/*.md"]
    when: 変更箇所が 3 か所を超えるか、外から見える振る舞いが変わるとき

  acceptance:
    kind: work
    title: 受入テスト作成
    review: mr
    scope: ["tests/*"]
    when: 振る舞いが変わるとき。実装と並行してよい（実装の項の `after` にこの項を書かなければ並行する）

  implement:
    kind: work
    title: 実装とテスト
    review: mr
    scope: ["src/*", "tests/*"]
    when: 振る舞いを変えるとき。受入テスト作成を先に置く（計画に受入テスト作成の項も置く）

  design-feedback:
    kind: feedback
    title: 設計フィードバック対応
    review: mr
    scope: ["wip/design/*", "docs/*"]

  implement-feedback:
    kind: feedback
    title: 実装フィードバック対応
    review: mr
    scope: inherit
    when: フィードバック計画の最後に置き、ほかの対応を受ける

  # 学びの蓄積（docs/design/tickets/learning-wiki.md）。親のフィードバック計画に置く。
  # 子の気づきの記録（wip/handoff/learnings/）と受信箱（docs/wiki/inbox/）を learning-wiki に統合する。
  # wiki の共有ファイル（index.md・log.md・impact.md）を直すのはこの子だけ。
  learning-consolidate:
    kind: feedback
    title: 学びの統合
    review: mr
    scope: ["docs/wiki/*"]
    when: "子の気づきの記録に learnings: none でないものがあるか、受信箱にファイルがあるとき。全部 none で受信箱が空なら置かない"

  # 統合したパターンの提案を、反映先ごとに出す。スキル・文書は子が直し、ルール・配点・フェーズ定義・
  # テンプレートは下書きを wip/handoff/ に置いてユーザが置く。
  learning-apply:
    kind: feedback
    title: 学びの反映
    review: mr
    scope: [".claude/skills/*", "docs/wiki/*"]
    when: 統合したパターンに提案の時期（再発の回数が閾値以上）のものがあるか、ユーザが提案を頼んだとき
