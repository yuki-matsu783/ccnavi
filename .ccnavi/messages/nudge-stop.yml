# Stop の促しと、親のワークツリーの立ち位置の解き方の文。条件（いつ促すか）はコード側にある。
# 先頭の `[ccnavi] CODE (…)` の状態の行と、サブエージェントの結果の 1 行ずつはコード側が出す。
# `user_stop_note` は ops_stop.USER_STOP_NOTE（finish・依頼・フィードバックの促しで共有する 1 文）。
version: 1
messages:
  NUDGE_TICKET_FINISH:
    kind: nudge
    values: [ticket, worktree, ahead, base, user_stop_note]
    what:
      child: |-
        子チケット {ticket} は着手済みのまま作業中（doing/）です。ワークツリー {worktree} に未コミットの変更が無く、親のブランチに無いコミットが {ahead} 件あります。
      parent: |-
        親チケット {ticket} は着手済みのまま作業中（doing/）です。ワークツリー {worktree} に未コミットの変更が無く、基準点 {base} より先にコミットが {ahead} 件あります。
    next: |-
      作業が終わったなら `{script:ccnavi-ticket.sh} finish {ticket}` を実行してから終える。まだ続けるなら、続ける理由（何が残っているか）をユーザに向けて書いてから終える
    note: |-
      {user_stop_note}
      この案内は同じ HEAD では 1 回だけで、コミットを追加するまで次に終えるときは止めません。

  NUDGE_TICKET_REQUEST:
    kind: nudge
    values: [parent, phase, phase_name, children, finish_cmds_q, user_stop_note]
    what:
      finish: |-
        {parent} の作業中（doing/）の子 {children} が残っています。
      confirm: |-
        {parent} の{phase_name}は、ユーザが子 {children} を done/ へ手で動かして共有しています（レビュー完了確認待ち）。
      merge: |-
        {parent} の{phase_name}は子が全部閉じていますが、レビューの依頼（request）がまだです。子 {children} が親のブランチに合流済みと確かめられません（合流した先頭 merged_sha が無いか、親の HEAD に入っていません）。
      late_fix: |-
        {parent} の{phase_name}は子が全部閉じていますが、レビューの依頼（request）がまだです。子 {children} の手元のブランチに、合流されていない修正があります（finish の後に積んだコミットは親のブランチに入りません）。
      eli5: |-
        {parent} の{phase_name}は子が全部閉じて合流も済んでいますが、レビューの依頼（request）がまだです。
      request: |-
        {parent} の{phase_name}は、レビューの依頼（request）がまだです。
    why: |-
      これは決まった道の途中なので、ユーザの許可は要りません。進めてよいかを聞かずに、次を実行します。
    next:
      finish: |-
        作業が済んでいる子には {finish_cmds_q} を実行する。まだ作業が残っているなら、確認を取らずに続ける。子が全部閉じて（合流は finish が済ませる）、すべての子が合流済みと確かめたら、ELI5、レビューの依頼（request）へ進む
      confirm: |-
        `{script:ccnavi-review.sh} confirm --phase {phase}` を実行して確定する。未解決の指摘は、移動の前に付いたものだけが版つきで受け入れられ、移動の後に付いたものが残っていれば止まるので、その分は decide をユーザに頼む
      merge: |-
        合流は子の finish が行う。`{script:ccnavi-ticket.sh} status {parent}` で子の状態を確かめ、合流の記録が無い理由（origin が無い親、置き場を手で動かした子など）をユーザに伝える。合流済みと確かめられたら、ELI5 の HTML を wip/eli5/phase-{phase}.html に書いてコミットして push し、`{script:ccnavi-review.sh} request --phase {phase} --body-file <依頼文> --eli5 wip/eli5/phase-{phase}.html` で依頼する
      late_fix: |-
        このままでは依頼できない。修正を活かすなら、同じフェーズに子を足してユーザの承認を受け、その子で直す。破棄するなら、そのことをユーザに伝えて判断を仰ぐ
      eli5: |-
        ELI5 の HTML を wip/eli5/phase-{phase}.html に書いてコミットして push し、`{script:ccnavi-review.sh} request --phase {phase} --body-file <依頼文> --eli5 wip/eli5/phase-{phase}.html` で依頼する
      request: |-
        未コミットの変更があれば先にコミットして push してから（`request` は HEAD の普通のファイルを前提にする）、`{script:ccnavi-review.sh} request --phase {phase} --body-file <依頼文> --eli5 wip/eli5/phase-{phase}.html` で依頼する
    note: |-
      {user_stop_note}
      この案内は同じ状態では 1 回だけで、作業が進むまで次に終えるときは止めません。

  NUDGE_TICKET_FEEDBACK:
    kind: nudge
    values: [parent, stage, proposal, todo, user_stop_note]
    what: |-
      親 {parent} は{stage}です。
    next:
      proposed: |-
        フィードバック計画の改版は {proposal} にあります。送っていなければ `{script:ccnavi-ticket.sh} propose {parent}` で送り、ユーザに承認を頼んで返事を待つ。送り済みかは `{script:ccnavi-ticket.sh} status {parent}` で確かめる
      drafting: |-
        全体計画のレビューが済み、親を閉じる前にフィードバック計画が要る。指摘が無ければ feedback: [] を、あれば対応のフェーズを feedback: に並べた親の改版を {todo} に書く（承認済みチケットをコピーし、スクリプトだけが書く欄 started_at・completed_at・base_sha・merged_sha・cancelled_at・cancel_reason・finished_to・settled_by は空にする。手順は .ccnavi/docs/decisions.md）。書いたら `{script:ccnavi-ticket.sh} propose {parent}` で送り、ユーザに承認を頼む
    note: |-
      {user_stop_note}
      この案内は同じ状態では 1 回だけで、作業が進むまで次に終えるときは止めません。

  NUDGE_SUBAGENT_OUTCOME:
    kind: nudge
    values: []
    what: |-
      サブエージェントが範囲外の変更を残したか、範囲を確かめられないまま終わっています。
    next: |-
      合流（finish）の前に、その子のワークツリーの範囲外の変更を確かめて直すか、ユーザに伝える
    note: |-
      この案内は同じ結果では 1 回だけです。

  NUDGE_STOP_RULE:
    kind: nudge
    values: []
    what: |-
      これはタスクの続きではない。ここまでの作業を振り返るだけで、ほかの作業は始めないでください。
    next: |-
      ここまでの作業を振り返り、振り返って何も無ければ「振り返り: 無し」とだけ答える
    note: |-
      このターンがユーザへの問い・確認で終わっていたなら、振り返りの後にその問いを最後にもう一度書いてください。

  NEXT_STANDING:
    kind: next
    values: [name, branch, now]
    next:
      busy: |-
        親のワークツリーの途中の操作（merge・rebase など）を済ませるか取りやめてから再実行する
      mismatch: |-
        親のワークツリー（.claude/worktrees/{name}）の HEAD を、ブランチ名の `/` を `-` に置き換えると {name} になるブランチに戻す{now}
      ambiguous: |-
        同じ名前 {name} の親のワークツリーが複数のリポジトリにある。片方の親子のチケットを片付けるか、識別子を変えて、1 つのリポジトリに絞る
      absent: |-
        親のワークツリーを切り直す（`{script:ccnavi-git.sh} fetch origin {branch}` のあと `{script:ccnavi-git.sh} worktree add .claude/worktrees/{name} {branch}`。ブランチ名の `/` を `-` に置き換えたものがフォルダ名になる）。破棄した親子のチケットなら、親のワークツリーを片付ければよい（push の関門の対象から外れる）
