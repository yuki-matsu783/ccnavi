# ccnavi-git.sh・ccnavi-worktree.sh・ccnavi-stage.sh・ccnavi-ticket.sh・ccnavi-user-close-early.sh が出す次の一手。
# 条件の分岐は sh 側にある。引数の並び（args_q など）は sh が引用を済ませて渡す。
version: 1
messages:
  NEXT_GIT_MERGE_ON_TARGET:
    kind: next
    values: [integ]
    next: |-
      {script:ccnavi-worktree.sh} <名前> でワークツリーを切り、その中で {script:ccnavi-git.sh} merge {integ:sh} を打って衝突を解いてコミットし、{script:ccnavi-git.sh} integrate <名前> で取り込む

  NEXT_GIT_INTEGRATE_EMPTY:
    kind: next
    values: [name]
    next: |-
      ユーザに伝えたあと、{script:ccnavi-git.sh} integrate-done {name:sh} で確定する（報告と進め方は、integrate を打ったときの追加の文脈に従う）

  NEXT_GIT_INTEGRATE_REVIEW:
    kind: next
    values: [head, result, name]
    next: |-
      差分は {script:ccnavi-git.sh} diff {head:sh} {result:sh}。報告のあと、{script:ccnavi-git.sh} integrate-done {name:sh} -m '<メッセージ>' で確定する（報告と進め方は、integrate を打ったときの追加の文脈に従う）。やめるなら {script:ccnavi-git.sh} integrate --abort {name:sh}

  NEXT_GIT_PUSH_USER:
    kind: next
    values: [base, top]
    next: |-
      ユーザにターミナルで {base} をリモートへ送るよう頼む（cd {top:path} && git push origin {base:sh}）。ccnavi-git.sh push は取り込み先へ送らない

  NEXT_WORKTREE_EDIT:
    kind: next
    values: [dest]
    next: |-
      編集はこのワークツリーの下で行います（Write / Edit に渡すパス: {dest}/…）。git は `cd {dest:path} && {script:ccnavi-git.sh} <サブコマンド>` の形で実行します。コミットは作業を終えてからまとめて打ち、続けて integrate を打ちます（ユーザの確認を待つ間はコミットしません）

  NEXT_WORKTREE_ADOPT:
    kind: next
    values: [name, target, code]
    next: |-
      上をユーザに伝えて了承を得てから、{script:ccnavi-worktree.sh} {name:sh} --adopt --base {target:sh} --accept {code}

  NEXT_WORKTREE_PARENT_ACTIVE:
    kind: next
    next: |-
      状況をユーザに報告し、親を早めに閉じるか子を取り下げるかを決めてもらう。返事が来るまで止まり、直接実装には切り替えない

  NEXT_WORKTREE_CONFIRM:
    kind: next
    values: [name, args_q]
    next: |-
      上をユーザに伝えて決めてもらう。合わせたら同じコマンドを打ち直す。このまま進めるなら例えば {script:ccnavi-worktree.sh} {name:sh} {args_q}

  NEXT_STAGE_EDIT:
    kind: next
    values: [staged_q]
    next: |-
      下書きを編集する。すべて直したら、下書きを作ったのと同じツリーの中で {script:ccnavi-stage.sh} --commands {staged_q} を打つ（種類ごとに、取り込みの手順か差し替えの mv が出る）

  NEXT_STAGE_GUIDE:
    kind: next
    values: [guide]
    next: |-
      上の{guide}をユーザに案内してターンを終える

  NEXT_TICKET_PROPOSED:
    kind: next
    next: |-
      ユーザに承認を頼んで返事を待つ。承認が済むまで実装はしない

  NEXT_CLOSE_EARLY:
    kind: next
    next: |-
      親で、閉じた子を片付けて push し、ready を実行させる。マージはユーザが行う
