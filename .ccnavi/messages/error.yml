version: 1
messages:
  # 書く先の置き場（親のワークツリー）が決まらないとき。ほかのツリーのコピーへは書かない。
  ERROR_NO_PARENT_WORKTREE:
    kind: error
    values: [reason]
    what: |-
      親のワークツリーが決まらないので止めました: {reason}。
    why: |-
      承認済みチケットは親のワークツリーの置き場にだけ書きます。ほかのツリーのコピーへ書くと、同じ識別子が 2 通りになります。
    next: |-
      親のワークツリーを準備してから（{script:ccnavi-start.sh}）打ち直す

  # issue の番号・プロジェクト名・先頭の語から、親の識別子を作れないとき。
  ERROR_ISSUE_IDENTIFIER:
    kind: error
    values: [detail]
    what: |-
      issue から識別子を作れません: {detail}
    why: |-
      親の識別子は `<先頭の語>-<番号>-<slug>` の形で、番号は正の整数、プロジェクト名と先頭の語は識別子に使える字だけで書きます。
    next: |-
      番号・プロジェクト名・先頭の語を直して打ち直す

  # `ccnavi user …`（ユーザ専用の入口）の綴りや形の誤り。detail が何を直すかを言う。
  ERROR_USER_ENTRY:
    kind: error
    values: [detail]
    what: |-
      ユーザ専用の入口を使えません: {detail}
    why: |-
      ユーザ専用の入口は、エージェントが偽装できないよう、綴りと引数の形を決めています。
    next: |-
      入口の綴りと引数を直して打ち直す（使える操作は `ccnavi user` で確かめる）
