id: wf-296-04-01
name: 文書・スキルの旧名を期待する判定に揃える
description: 子 04-01 の作業の段取り。ユーザの判断の点は増やさない
version: 1.0.0
nodes:
  - id: s
    type: start
    name: 開始
    position:
      x: 0
      y: 0
    data:
      label: 開始
  - id: p1
    type: prompt
    name: 本文と対象を読む
    position:
      x: 0
      y: 120
    data:
      prompt: チケット本文 wip/proposals/todo/refactor-296-rule-expectations-04-01.md と、その「先に洗った結果」の表（直す 16 ファイル・残す 11 行）を読む。同じ grep -rniE "rule-samples|--test-samples|samples:|samplesPath|見本|sample" を README.md・docs/（docs/adr/ を除く）・.claude/skills/・extensions/vscode/ccnavi-board/docs/ に当て、表と食い違いがないか確かめる。
  - id: p2
    type: prompt
    name: スキル以外を直す
    position:
      x: 0
      y: 240
    data:
      prompt: "README.md、docs/、extensions/vscode/ccnavi-board/docs/ の順に、各行を読んで直す。日本語は「期待する判定」（短くしてよい所は「期待」）、英語側は rule-expectations.yml / expectations: / --test-expectations / expectationsPath にする。機械置換はしない。別の意味の「見本」「sample」（計画の待ちの試験データ表、録ったホスト応答、tour-sample.ts のダミー、ボード JSON の見本ファイル）は残す。docs/adr/ の過去の ADR は触らない。"
  - id: p3
    type: prompt
    name: スキル 4 ファイルを直す
    position:
      x: 0
      y: 360
    data:
      prompt: .claude/skills/ccnavi-config/SKILL.md、同 references/check.md、同 references/add.md、.claude/skills/commit/references/test-groups.md を同じ言い回しで直す。Edit が拒否されたら、4 本とも wip/scratchpad/ に cp して編集し、ユーザに mv のフルパスを渡してターンを終える。拒否されなければそのまま直す。
  - id: p4
    type: prompt
    name: ADR を足す
    position:
      x: 0
      y: 480
    data:
      prompt: docs/adr/README.md の決まりを読み、origin/main を取り直して最後尾の次の番号（想定 0114）で docs/adr/0114-rule-expectations-rename.md を書く。状態は採用。状況・決定の表・理由・得たもの失ったもの・採らなかった案はチケット本文の「新しい ADR」に従う。docs/adr/README.md の一覧に 1 行足す。0065 の行の本文は書き換えず、代案は最後の報告で相談に出す。文書・スキル・コメントの本文では ADR 番号で言及しない。
  - id: p5
    type: prompt
    name: 旧名の残りを確かめる
    position:
      x: 0
      y: 600
    data:
      prompt: 手順 1 と同じ grep を当て、残るのが docs/adr/ の過去 ADR と、チケットの「残す」11 行だけであることを確かめる。tests/core/test_adr_numbers.py を手で回し、ccnavi --lint の error が 0 であることも確かめる。外れがあれば直して再確認する。
  - id: p6
    type: prompt
    name: 差分と結果を報告する
    position:
      x: 0
      y: 720
    data:
      prompt: 変えたファイルの差分の要約、grep の残り、テストと lint の結果を最後の報告に書く。スキルを wip/scratchpad/ 経由にした場合はその mv のフルパスも添える。コミットと承認はしない。
  - id: e
    type: end
    name: 終了
    position:
      x: 0
      y: 840
    data:
      label: 終了
connections:
  - id: c1
    from: s
    to: p1
    fromPort: output
    toPort: input
  - id: c2
    from: p1
    to: p2
    fromPort: output
    toPort: input
  - id: c3
    from: p2
    to: p3
    fromPort: output
    toPort: input
  - id: c4
    from: p3
    to: p4
    fromPort: output
    toPort: input
  - id: c5
    from: p4
    to: p5
    fromPort: output
    toPort: input
  - id: c6
    from: p5
    to: p6
    fromPort: output
    toPort: input
  - id: c7
    from: p6
    to: e
    fromPort: output
    toPort: input
