            type: switch
            name: 依頼の種類で分ける
            position: {x: 480, y: 150}
            data:
              evaluationTarget: 依頼の種類
              branches:
                - {label: 不具合, condition: 動かない・エラーが出る}
                - {label: 機能の追加, condition: 新しい動きを追加したい}
                - {label: 既定, condition: default}
