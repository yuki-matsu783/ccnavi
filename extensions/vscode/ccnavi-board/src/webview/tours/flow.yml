# フロー編集画面の案内。`sample:` は案内の間だけ画面に出す見本（実際のフローではない）。
# フローは、フローのファイル（.ccnavi/approved/flows/<子>.yml）と同じ書き方。`checks:` は ccnavi --lint --json --flow の答え
# （warns = (flow) の warn、rendered = 担当に渡る手順、candidates = 選べるサブエージェントとスキルの名前）。
# 見本が実際の形から外れないことは、テスト（test/flow/tour-flow.test.ts）が実際の読み取りと実行ファイルで確かめる。
#
# `scene:` は手順ごとの画面の様子。手順ごとに全部を書く（前の手順を引き継がない）。
#   doc          見本のフローの名前（sample.flows のキー）。既定は main
#   select       右の欄に出すもの。ノードの id、または edge:<線の id>。無ければフロー自体の欄
#   pick         図で選ぶノードの id（, で区切って複数）。Shift で選んだ状態。select がノードなら、それも選ぶ
#   base         保存前の差分（review）と下書きの差分（proposal）の「いまのフロー」にする見本の名前。既定は main
#   dirty        未保存にする（保存が押せる）
#   history      元に戻す・やり直すを押せる状態にする
#   clip         コピーしたものがある（貼り付けが押せる）
#   minimap      ミニマップを出す
#   lock         着手中の帯を出す（欄・部品箱が止まる）
#   changed      「ファイルの変更を検知しました」の帯を出す
#   offer        「提案あり」の帯を出す
#   review       保存前の差分の一覧を出す（base と doc の違い）
#   proposal     エージェントの下書きの差分を出す（base と、sample.proposal.flow の違い）
#   requestText  エージェントに頼む文を出す
#   checking     実行ファイルに確かめ直している最中にする
# 指す先（target）は data-tour の値。部品箱 palette / palette-<種類>、図 graph / node-<ノードの id> / edge-<線の id>、
# 右の欄 inspector / inspector-question・branches・multiselect・target・loop・agent・prompt・condition・ungroup、
# 手順のプレビュー preview、注意の一覧 notices、帯 offer / lock / changed、ツールバーの undo・redo・copy・paste・duplicate・group・minimap・
# request・dirty・save、保存前の差分 review / review-skip、下書き proposal / proposal-import、依頼の文 request-text、案内 tour。
screen: flow

sample:
  page:
    ticket: i0042-01-01
    title: ログイン失敗の原因調査
    parent: i0042
    flowPath: .claude/worktrees/i0042/.ccnavi/approved/flows/i0042-01-01.yml
    flowRel: .ccnavi/approved/flows/i0042-01-01.yml
  request: エージェントにフローの直しを頼む
  draft:
    path: wip/proposals/flows/i0042-01-01.yml
    lintCommand: sh .ccnavi/scripts/ccnavi-launcher.sh --lint --flow wip/proposals/flows/i0042-01-01.yml
  proposal:
    flow: proposal
  flows:
    # 完成した 1 本。ほとんどの案内が使う
    main:
      doc:
        id: i0042-01-01-flow
        name: i0042-01-01 ログイン失敗の原因調査
        description: ログと該当コードから原因を絞り、直し方をユーザに聞いてから直す
        version: 1.0.0
        nodes:
          - &start {id: start, type: start, name: 開始, position: {x: 0, y: 130}, data: {label: 開始}}
          - &investigate
            id: investigate
            type: subAgent
            name: 原因を調べる
            position: {x: 240, y: 130}
            data:
              description: ログと該当コードを突き合わせ、原因の候補を挙げる
              builtInType: Explore
              prompt: |
                認証まわりのエラーログを読み、失敗が起きる条件を整理する。
                該当するコードを探し、原因の候補を 3 件以内で挙げる。
          - &ask-policy
            id: ask-policy
            type: askUserQuestion
            name: 方針を聞く
            position: {x: 480, y: 130}
            data:
              questionText: 原因は絞れました。どの方針で直しますか？
              multiSelect: false
              options:
                - {label: 最小限の修正, description: 該当箇所だけを直す}
                - {label: 設計から見直す, description: 認証の流れ全体を整理し直す}
          - &fix-small
            id: fix-small
            type: prompt
            name: 最小限の修正を入れる
            position: {x: 720, y: 30}
            data: {prompt: 原因の箇所だけを直し、再現手順で直ったことを確認する}
          - &redesign
            id: redesign
            type: prompt
            name: 設計を見直す
            position: {x: 720, y: 230}
            data: {prompt: 認証の流れを整理し直す案を書き、ユーザに見せる}
          - &end {id: end, type: end, name: 終了, position: {x: 960, y: 130}, data: {label: 終了}}
        connections: &main-connections
          - &c-start-investigate {id: c-start-investigate, from: start, to: investigate, fromPort: output, toPort: input}
          - &c-investigate-ask-policy {id: c-investigate-ask-policy, from: investigate, to: ask-policy, fromPort: output, toPort: input}
          - &c-ask-policy-fix-small {id: c-ask-policy-fix-small, from: ask-policy, to: fix-small, fromPort: branch-0, toPort: input}
          - &c-ask-policy-redesign {id: c-ask-policy-redesign, from: ask-policy, to: redesign, fromPort: branch-1, toPort: input}
          - &c-fix-small-end {id: c-fix-small-end, from: fix-small, to: end, fromPort: output, toPort: input}
          - &c-redesign-end {id: c-redesign-end, from: redesign, to: end, fromPort: output, toPort: input}
      checks:
        warns: []
        rendered:
          - "1. [start] 開始: 開始 → 2"
          - "2. [subAgent] 原因を調べる: ログと該当コードを突き合わせ、原因の候補を挙げる / プロンプト: 認証まわりのエラーログを読み、失敗が起きる条件を整理する。 該当するコードを探し、原因の候補を 3 件以内で挙げる。 / 種類: Explore → 3"
          - "3. [askUserQuestion] 方針を聞く: 問い: 原因は絞れました。どの方針で直しますか？ 選択肢: 最小限の修正 | 設計から見直す → 4（最小限の修正）, 5（設計から見直す）"
          - "4. [prompt] 最小限の修正を入れる: 原因の箇所だけを直し、再現手順で直ったことを確認する → 6"
          - "5. [prompt] 設計を見直す: 認証の流れを整理し直す案を書き、ユーザに見せる → 6"
          - "6. [end] 終了: 終了"
        candidates: &candidates
          agents:
            - {name: general-purpose, source: builtin}
            - {name: Explore, source: builtin}
            - {name: Plan, source: builtin}
          skills:
            - {name: process-review, source: project}
            - {name: process-test, source: project}

    # 手順を新しく組む。部品箱で足す前（開始 → 終了）
    build-1:
      doc:
        id: i0042-01-01-flow
        name: i0042-01-01 ログイン失敗の原因調査
        version: 1.0.0
        nodes:
          - {id: start, type: start, name: 開始, position: {x: 0, y: 130}, data: {label: 開始}}
          - {id: end, type: end, name: 終了, position: {x: 480, y: 130}, data: {label: 終了}}
        connections:
          - {id: c-start-end, from: start, to: end, fromPort: output, toPort: input}
      checks:
        warns: []
        rendered:
          - "1. [start] 開始: 開始 → 2"
          - "2. [end] 終了: 終了"
        candidates: *candidates

    # プロンプトを足した直後（図のいちばん下に置かれ、どこにもつながっていない）
    build-2:
      doc:
        id: i0042-01-01-flow
        name: i0042-01-01 ログイン失敗の原因調査
        version: 1.0.0
        nodes:
          - {id: start, type: start, name: 開始, position: {x: 0, y: 130}, data: {label: 開始}}
          - {id: end, type: end, name: 終了, position: {x: 480, y: 130}, data: {label: 終了}}
          - {id: prompt-1, type: prompt, name: プロンプト, position: {x: 0, y: 270}, data: {prompt: ""}}
        connections:
          - {id: c-start-end, from: start, to: end, fromPort: output, toPort: input}
      checks:
        warns:
          - ".claude/worktrees/i0042/.ccnavi/approved/flows/i0042-01-01.yml: start から届かないノードがある: prompt-1（プロンプト）"
        rendered:
          - "1. [start] 開始: 開始 → 2"
          - "2. [end] 終了: 終了"
          - 3. [prompt] プロンプト
        candidates: *candidates

    # 名前と中身を書き、開始と終了の間に置いてつないだあと
    build-3:
      doc:
        id: i0042-01-01-flow
        name: i0042-01-01 ログイン失敗の原因調査
        version: 1.0.0
        nodes:
          - {id: start, type: start, name: 開始, position: {x: 0, y: 130}, data: {label: 開始}}
          - id: prompt-1
            type: prompt
            name: ログを読む
            position: {x: 240, y: 130}
            data: {prompt: 認証まわりのエラーログを読み、失敗が起きる条件を整理する}
          - {id: end, type: end, name: 終了, position: {x: 480, y: 130}, data: {label: 終了}}
        connections:
          - {id: c-start-prompt-1, from: start, to: prompt-1, fromPort: output, toPort: input}
          - {id: c-prompt-1-end, from: prompt-1, to: end, fromPort: output, toPort: input}
      checks:
        warns: []
        rendered:
          - "1. [start] 開始: 開始 → 2"
          - "2. [prompt] ログを読む: 認証まわりのエラーログを読み、失敗が起きる条件を整理する → 3"
          - "3. [end] 終了: 終了"
        candidates: *candidates

    # 複数選択（選択肢ごとに出口を分けない）の問い
    ask-multi:
      doc:
        id: i0042-01-01-flow
        name: i0042-01-01 ログイン失敗の原因調査
        version: 1.0.0
        nodes:
          - {id: start, type: start, name: 開始, position: {x: 0, y: 130}, data: {label: 開始}}
          - id: ask-areas
            type: askUserQuestion
            name: 調べる範囲を聞く
            position: {x: 240, y: 130}
            data:
              questionText: 調べる範囲を選んでください（複数選べます）
              multiSelect: true
              options:
                - {label: 認証, description: ログインとトークンの発行}
                - {label: セッション, description: 有効期限と更新}
                - {label: 権限, description: ロールごとの許可}
          - id: collect
            type: prompt
            name: 選ばれた範囲をまとめる
            position: {x: 480, y: 130}
            data: {prompt: 選ばれた範囲を並べ、それぞれの調べ方を決める}
          - {id: end, type: end, name: 終了, position: {x: 720, y: 130}, data: {label: 終了}}
        connections:
          - {id: c-start-ask-areas, from: start, to: ask-areas, fromPort: output, toPort: input}
          - {id: c-ask-areas-collect, from: ask-areas, to: collect, fromPort: output, toPort: input}
          - {id: c-collect-end, from: collect, to: end, fromPort: output, toPort: input}
      checks:
        warns: []
        rendered:
          - "1. [start] 開始: 開始 → 2"
          - "2. [askUserQuestion] 調べる範囲を聞く: 問い: 調べる範囲を選んでください（複数選べます） 選択肢（複数選択）: 認証 | セッション | 権限 → 3"
          - "3. [prompt] 選ばれた範囲をまとめる: 選ばれた範囲を並べ、それぞれの調べ方を決める → 4"
          - "4. [end] 終了: 終了"
        candidates: *candidates

    # if / else の分岐。真と偽の出口。偽の線には線の条件を書いている
    branch-if:
      doc:
        id: i0042-01-01-flow
        name: i0042-01-01 ログイン失敗の原因調査
        version: 1.0.0
        nodes:
          - {id: start, type: start, name: 開始, position: {x: 0, y: 130}, data: {label: 開始}}
          - {id: run-tests, type: prompt, name: テストを流す, position: {x: 240, y: 130}, data: {prompt: 認証まわりのテストを流し、結果を読む}}
          - id: check
            type: ifElse
            name: テストが通るか
            position: {x: 480, y: 130}
            data:
              evaluationTarget: テストの結果
              branches:
                - {label: 真, condition: 失敗が 0 件}
                - {label: 偽, condition: 失敗が 1 件以上}
          - {id: summary, type: prompt, name: 結果をまとめる, position: {x: 720, y: 30}, data: {prompt: 直した内容と、通ったテストをまとめる}}
          - {id: report, type: prompt, name: 失敗の内容を報告する, position: {x: 720, y: 230}, data: {prompt: 失敗したテストと、直せなかった理由を報告する}}
