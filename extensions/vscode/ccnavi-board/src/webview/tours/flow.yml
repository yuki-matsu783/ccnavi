          - {id: c-check-summary, from: check, to: summary, fromPort: branch-0, toPort: input}
          - {id: c-check-report, from: check, to: report, fromPort: branch-1, toPort: input, condition: 失敗が残っている}
          - {id: c-summary-end, from: summary, to: end, fromPort: output, toPort: input}
          - {id: c-report-end, from: report, to: end, fromPort: output, toPort: input}
      checks:
        warns: []
        rendered:
          - "1. [start] 開始: 開始 → 2"
          - "2. [prompt] テストを流す: 認証まわりのテストを流し、結果を読む → 3"
          - "3. [ifElse] テストが通るか: テストの結果: 真=失敗が 0 件 | 偽=失敗が 1 件以上 → 4（真）, 5（失敗が残っている）"
          - "4. [prompt] 結果をまとめる: 直した内容と、通ったテストをまとめる → 6"
          - "5. [prompt] 失敗の内容を報告する: 失敗したテストと、直せなかった理由を報告する → 6"
          - "6. [end] 終了: 終了"
        candidates: *candidates

    # switch の分岐。出口は自由に足せる。最後の出口の条件は default
    branch-switch:
      doc:
        id: i0042-01-01-flow
        name: i0042-01-01 ログイン失敗の原因調査
        version: 1.0.0
        nodes:
          - {id: start, type: start, name: 開始, position: {x: 0, y: 150}, data: {label: 開始}}
          - {id: classify, type: prompt, name: 依頼を読む, position: {x: 240, y: 150}, data: {prompt: 依頼を読み、不具合か機能の追加かを見分ける}}
