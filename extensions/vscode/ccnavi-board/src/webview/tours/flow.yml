          - "3. [switch] 依頼の種類で分ける: 依頼の種類: 不具合=動かない・エラーが出る | 機能の追加=新しい動きを追加したい | 既定=default → 4（不具合）, 5（機能の追加）, 6（既定）"
          - "4. [prompt] 再現してから直す: 再現手順を作ってから、原因の箇所を直す → 7"
          - "5. [prompt] 仕様を確認してから追加する: 仕様を文にして確認してから、機能を追加する → 7"
          - "6. [prompt] 依頼を確認する: 依頼の内容が読み取れなかったことをユーザに伝える → 7"
          - "7. [end] 終了: 終了"
        candidates: *candidates

    # 繰り返し。「繰り返す」から手順を通って、繰り返しのノードへ戻る
    branch-loop:
      doc:
        id: i0042-01-01-flow
        name: i0042-01-01 ログイン失敗の原因調査
        version: 1.0.0
        nodes:
          - {id: start, type: start, name: 開始, position: {x: 0, y: 130}, data: {label: 開始}}
          - id: fix-loop
            type: loop
            name: 直すまで繰り返す
            position: {x: 240, y: 130}
            data:
              label: 直すまで繰り返す
              condition: テストが全部通るまで
              maxIterations: 3
              branches:
                - {id: body, label: 繰り返す}
                - {id: done, label: 抜ける}
          - {id: fix-test, type: prompt, name: 失敗を 1 件直す, position: {x: 520, y: 20}, data: {prompt: 失敗したテストを 1 件選んで直し、テストを流し直す}}
          - {id: end, type: end, name: 終了, position: {x: 520, y: 240}, data: {label: 終了}}
        connections:
          - {id: c-start-fix-loop, from: start, to: fix-loop, fromPort: output, toPort: input}
          - {id: c-fix-loop-fix-test, from: fix-loop, to: fix-test, fromPort: body, toPort: input}
          - {id: c-fix-test-fix-loop, from: fix-test, to: fix-loop, fromPort: output, toPort: input}
          - {id: c-fix-loop-end, from: fix-loop, to: end, fromPort: done, toPort: input}
      checks:
        warns: []
        rendered:
          - "1. [start] 開始: 開始 → 2"
          - "2. [loop] 直すまで繰り返す: 条件: テストが全部通るまで / 最大 3 回 → 3（繰り返す）, 4（抜ける）"
          - "3. [prompt] 失敗を 1 件直す: 失敗したテストを 1 件選んで直し、テストを流し直す → 2"
          - "4. [end] 終了: 終了"
        candidates: *candidates

    # 子の下に 3 段の入れ子（サブフロー）を持つファイル。この画面は中身を描かない
    deep:
      doc:
        id: i0042-01-01-flow
        name: i0042-01-01 ログイン失敗の原因調査
        version: 1.0.0
        nodes:
          - {id: start, type: start, name: 開始, position: {x: 0, y: 130}, data: {label: 開始}}
          - id: dig
            type: subAgentFlow
            name: 深掘りする
            position: {x: 240, y: 130}
            data: {label: 深掘りする, subAgentFlowId: sf-outer}
          - {id: end, type: end, name: 終了, position: {x: 480, y: 130}, data: {label: 終了}}
        connections:
          - {id: c-start-dig, from: start, to: dig, fromPort: output, toPort: input}
          - {id: c-dig-end, from: dig, to: end, fromPort: output, toPort: input}
        subAgentFlows:
          - id: sf-outer
            name: 外側の調べ
            nodes:
              - {id: outer-start, type: start, name: 開始, position: {x: 0, y: 0}, data: {label: 開始}}
              - id: inner-call
                type: subAgentFlow
                name: 内側へ渡す
                position: {x: 240, y: 0}
                data: {label: 内側へ渡す, subAgentFlowId: sf-inner}
            connections:
              - {id: c-outer-start-inner-call, from: outer-start, to: inner-call, fromPort: output, toPort: input}
          - id: sf-inner
            name: 内側の調べ
            nodes:
              - {id: inner-start, type: start, name: 開始, position: {x: 0, y: 0}, data: {label: 開始}}
              - id: leaf
                type: subAgent
