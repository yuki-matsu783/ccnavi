courses:
  - id: intro
    title: 基本の案内
    summary: 画面の見どころを順に回ります
    steps:
      - target: palette
        title: 部品箱
        body: 押すと、ノードが図に追加されます。ユーザに聞く（askUserQuestion）ノードでは、担当のサブエージェントが手を止めてメインに返します。サブエージェントのノードは入れ子のサブエージェントとして起動し、入れ子の上限に達したらメインに返します。
        scene: {doc: main}
      - target: graph
        title: 図
        body: ノードの右の点から次のノードの左の点へドラッグすると、線でつながります（開始へ入る線と、終了から出る線は引けません）。ノードや線を押すと、右の欄で中身を直せます。ノードや線にポインタを合わせると × が出て、押すと削除できます。Shift を押しながらノードを押すか、Shift を押しながら何もないところをドラッグして囲むと、複数のノードを選べます。選んだノードは「グループ化」で枠にまとめられます。枠の中へドラッグしたノードは枠に入り、外へドラッグすると枠から出ます。Ctrl+Z で元に戻し、Ctrl+Shift+Z（Ctrl+Y）でやり直せます。選んだノードは Ctrl+C でコピーして Ctrl+V で貼り付け、Ctrl+D で複製できます（開始はコピーしません）。
        scene: {doc: main}
      - target: inspector
        title: 欄
        body: 選んだノードの中身（プロンプト、問いと選択肢、分岐の条件など）を直せます。この画面に入力欄がない種類は、名前だけを直せて、中身はそのまま残ります。
        scene: {doc: main, select: ask-policy}
      - target: save
        title: 保存
        body: 読み込んだ時点からの変更（追加した・削除した・変えたノードと線）を一覧で表示してから保存します。保存の直前に、子チケットが着手中でないかを ccnavi に再確認します。着手中なら保存しません（担当のサブエージェントが読んでいる手順が、途中で変わるのを防ぐためです）。
        scene: {doc: main, dirty: true}
      - target: tour
        title: 案内
        body: ヘッダ右上の ? を押すと、基本の案内と、使い方ごとの案内を選べます。
        scene: {doc: main}

  - id: build
    title: 手順を新しく組む
    summary: 部品箱でノードを追加し、中身を入力して、線でつなぐ
    steps:
      - target: palette-prompt
        title: 部品箱から追加する
        body: やりたい作業を 1 つずつノードにします。まず「プロンプト」を押します。追加したノードは図のいちばん下に置かれ、選ばれた状態になります。開始と終了は最初から入っています。
        scene: {doc: build-1}
      - target: inspector-prompt
        title: 中身を入力する
        body: 追加したノードを選ぶと、右の欄が開きます。プロンプトには、担当のサブエージェントへの指示を入力します。名前は図の表示に使います。
        scene: {doc: build-2, select: prompt-1}
      - target: node-prompt-1
        title: 線でつなぐ
        body: 追加したばかりのノードは、どこにもつながっていません。ノードの右の点から、次のノードの左の点へドラッグすると、線でつながります。開始へ入る線と、終了から出る線は引けません。
        scene: {doc: build-2}
      - target: graph
        title: つないだあとの図
        body: 開始、ログを読む、終了の順につながりました。ノードはドラッグで動かせます。位置はファイルにも残りますが、手順の順番は線で決まります。
        scene: {doc: build-3}
      - target: edge-c-prompt-1-end
        title: 線を直す
        body: 線を押すと、右の欄で条件を入力できます。ポインタを線やノードに合わせると × が出て、押すと削除できます。つなぎ直すときは、削除してから引き直します。
        scene: {doc: build-3, select: "edge:c-prompt-1-end"}
      - target: preview
        title: 担当に渡る手順を確認する
        body: 編集が止まると、ccnavi が手順を並べ直します。担当のサブエージェントには、ここに並んだとおりの手順が渡ります。保存は「保存前に確認して保存する」の案内で見られます。
        scene: {doc: build-3}

  - id: ask-user
    title: ユーザに聞く問いを決める
    summary: ユーザに聞くノードで、問いと選択肢を決め、選択肢ごとに手順を分ける
    steps:
      - target: node-ask-policy
        title: ユーザに聞くノード
        body: 担当のサブエージェントは、ユーザに質問できません。このノードに来ると、担当は手を止め、問いと選択肢をそのままメインに返します。メインがユーザに聞き、答えを渡して同じ担当を再開させます。
        scene: {doc: main}
      - target: inspector-question
        title: 問いを入力する
        body: 「問い」には、ユーザにそのまま見せる文を入力します。何を決めたいのか、決めると何が変わるのかが読める文にします。
        scene: {doc: main, select: ask-policy}
      - target: inspector-branches
        title: 選択肢を決める
        body: 選択肢は 1 件ずつが出口になります。名前は短く、説明には選ぶと何が起きるかを入力します。「＋ 選択肢を追加する」で追加し、「削除」で削除できます（最後の 1 件は削除できません）。
        scene: {doc: main, select: ask-policy}
      - target: edge-c-ask-policy-fix-small
        title: 選択肢ごとに手順を分ける
        body: 選択肢の出口から、その選択肢のときの手順へ線を引きます。線には出口の名前が付くので、図を見るだけで分岐が読めます。
        scene: {doc: main}
      - target: inspector-multiselect
        title: 複数選択にする
        body: 「複数選択」にすると、選択肢ごとの出口はなくなり、出口は 1 つになります。いくつ選ばれても、同じ次のノードへ進みます。選ばれた内容は、次のノードが読みます。
        scene: {doc: ask-multi, select: ask-areas}
      - target: preview
        title: 渡る手順で確認する
        body: 担当に渡る手順には、問いと選択肢がそのまま並びます。複数選択のときは、その旨も付きます。ユーザに見せる文が合っているかを、ここで確認します。
        scene: {doc: ask-multi}

  - id: branch
    title: 分岐の条件を入力する
    summary: if / else・switch・繰り返しで、手順を条件で分ける
    steps:
      - target: inspector-target
        title: 何で分けるかを入力する
        body: 分岐のノードは、「何で分けるか」を 1 つ決めます。例えば「テストの結果」です。担当は、これを見て、出口のどれに進むかを決めます。
        scene: {doc: branch-if, select: check}
      - target: inspector-branches
        title: 出口の条件を入力する
        body: 出口ごとに、名前と条件を入力します。条件は、担当が読んで判断できる文にします。if / else の出口は「真」と「偽」の 2 本で決まっていて、増やせません。増やしたいときは switch を使います。
        scene: {doc: branch-if, select: check}
      - target: edge-c-check-summary
        title: 出口から手順へつなぐ
        body: 出口の点から、その条件のときの手順へ線を引きます。線の言葉は、出口の名前です。
        scene: {doc: branch-if}
      - target: inspector-condition
        title: 線に条件を入力する
        body: 線を押すと、線ごとの条件も入力できます。入力すると、図の線の言葉が、出口の名前からこの条件に変わります。空のときは、出口の名前を条件として使います。
        scene: {doc: branch-if, select: "edge:c-check-report"}
      - target: inspector-branches
        title: switch で出口を増やす
        body: switch は、出口を自由に追加できます。「＋ 出口を追加する」で追加し、「削除」で、その出口と出ている線を削除します。どれにも該当しないときの出口には、条件に default と入力します。
        scene: {doc: branch-switch, select: kind}
      - target: inspector-loop
        title: 繰り返しの条件と上限
        body: 繰り返しのノードには、続ける条件と、回数の上限を決めます。出口は「繰り返す」と「抜ける」の 2 本で決まっています。「繰り返す」から手順を通って、このノードへ戻る線を引きます。
        scene: {doc: branch-loop, select: fix-loop}
      - target: preview
        title: 渡る手順で確認する
        body: 条件と最大回数が、手順の行に並びます。回数が 1 以上の整数でないときは、そう表示されます。
        scene: {doc: branch-loop}

  - id: subagent
    title: サブエージェントに任せる
    summary: 作業をサブエージェントに任せ、入れ子の上限を知っておく
    steps:
      - target: palette-sub-agent
        title: 部品箱から追加する
        body: 手順の一部を別のサブエージェントに任せたいときは、「サブエージェント」を追加します。「入れ子」の札は、起動できなければメインへ戻ることを示します。
        scene: {doc: main}
      - target: inspector-agent
        title: 何を任せるか・種類を決める
        body: 「何を任せるか」を 1 行で入力し、「サブエージェントの種類」を決めます。種類は ccnavi が挙げた候補（組み込みと、プロジェクトの .claude/ の下のもの）から選べます。入力して決めてもかまいません。候補にない名前は、そう表示されます。
        scene: {doc: main, select: investigate}
      - target: inspector-prompt
        title: プロンプトを入力する
        body: プロンプトには、任せる作業の指示を入力します。フローの文は担当への案内になるので、必要なことを具体的に入力します。
        scene: {doc: main, select: investigate}
      - target: node-investigate
        title: 入れ子の目印
        body: サブエージェントのノードには「入れ子（上限なら戻る）」の札が付きます。Agent ツールが渡されていれば入れ子のサブエージェントとして起動し、入れ子の上限に達していれば、このノードで止まってメインに返します。
        scene: {doc: main}
      - target: notices
        title: 入れ子の上限の注意
        body: 既定の上限は、メインの下 3 段です。子チケットの担当が 1 段目なので、フローの中で重ねられるのは 2 段までです。超える入れ子のあるファイルを開くと、ここに注意が出ます。保存は止めません。
        scene: {doc: deep}
      - target: preview
        title: 任せる内容を手順で確認する
        body: 担当に渡る手順には、任せる内容・プロンプト・種類が 1 行にまとまって並びます。
        scene: {doc: main}

  - id: bulk
    title: 複数のノードをまとめて扱う
    summary: 選択・グループ化・コピー・貼り付け・元に戻す・ミニマップ
    steps:
      - target: graph
        title: Shift で複数選ぶ
        body: Shift を押しながらノードを押すと、選択に追加できます。Shift を押しながら何もないところをドラッグして囲んでも選べます。ここでは「最小限の修正を入れる」と「設計を見直す」を選んでいます。
        scene: {doc: main, pick: "fix-small,redesign"}
      - target: group
        title: 枠にまとめる
        body: ノードを 2 つ以上選ぶと「グループ化」が押せます。枠は図の上の囲みで、手順は変わりません（線もつなぎません）。
        scene: {doc: main, pick: "fix-small,redesign"}
      - target: node-group-1
        title: 枠の出入りと大きさ
        body: 枠の中へドラッグしたノードは枠に入り、外へドラッグすると出ます。枠を選ぶと、縁をドラッグして大きさを変えられます。
        scene: {doc: grouped, select: group-1}
      - target: inspector-ungroup
        title: 枠を解く
        body: 枠を選ぶと、右の欄で名前を直せます。「グループを解く」は枠だけを消し、中のノードはその場に残します。
        scene: {doc: grouped, select: group-1}
      - target: copy
        title: コピーする
        body: 選んだノードと、それらをつなぐ線を「コピー」（Ctrl+C）します。開始はコピーされません。
        scene: {doc: main, pick: investigate}
      - target: paste
        title: 貼り付ける・複製する
        body: 「貼り付け」（Ctrl+V）で、少しずらして貼り付けます。同じものを続けて貼ると、そのたびに位置がずれていきます。「複製」（Ctrl+D）は、コピーせずにその場で増やします。
        scene: {doc: main-pasted, select: subAgent-1, clip: true, dirty: true, history: true}
      - target: undo
        title: 元に戻す・やり直す
        body: 「元に戻す」（Ctrl+Z）と「やり直す」（Ctrl+Shift+Z、Ctrl+Y）で、編集の履歴をたどります。欄に続けて入力した文字は、1 回でまとめて戻ります。ファイルを再読み込みしたあとは、履歴が空になります。
        scene: {doc: main-pasted, select: subAgent-1, clip: true, dirty: true, history: true}
      - target: minimap
        title: 大きな図を見渡す
        body: 「ミニマップを出す」で、図の右下に全体の縮図が出ます。縮図の上をドラッグすると図が動き、ホイールで拡大・縮小できます。図のボタンで全画面にもできます。
        scene: {doc: main, minimap: true}

  - id: check
    title: 検証の注意を読んで直す
    summary: 図の上の注意と、担当に渡る手順を読んで、フローの抜けを直す
    steps:
      - target: notices
        title: 図の上の注意
        body: 注意は 2 種類が並びます。この画面が見つけたもの（入れ子の上限など）と、ccnavi が検証して返した warn です。ここは ccnavi の warn が 2 件で、開始がないことと、サブエージェントの種類が候補にないことです。どちらも保存は止めません。
        scene: {doc: broken}
      - target: node-orphan
        title: つながっていないノード
        body: 開始から届かないノードは、担当に渡る手順に入りません。線でつなぐか、要らなければ × で削除します。
        scene: {doc: broken}
      - target: inspector-agent
        title: 候補にない名前
        body: サブエージェントの種類が、ccnavi の挙げた候補にないと、欄の下にそう出ます。綴りの違いなら直します。ユーザやプラグインのものなら、そのままでかまいません。
        scene: {doc: broken, select: investigate}
      - target: preview
        title: 担当に渡る手順を確認する
        body: 直したら、担当に渡る手順を再読み込みします。開始からたどった順に、1 ノード 1 行で並びます。想定した順になっているかを確認します。
        scene: {doc: main}
      - target: preview
        title: 確認中の表示
        body: 編集が止まると、ccnavi に確認させます。確認している間は、最後に確認が済んだときの手順を出したまま、「確認中です」と表示します。
        scene: {doc: main, checking: true}

  - id: save-review
    title: 保存前に確認して保存する
    summary: 未保存の変更を差分で読み、着手中や外での変更にも気づく
    steps:
      - target: dirty
        title: 未保存の印
        body: 編集すると「未保存」が出ます。読み込んだ中身と同じに戻せば、消えます。未保存のまま閉じても、編集中の内容は覚えていて、開き直すと戻せます。
        scene: {doc: main-edited, dirty: true, history: true}
      - target: save
        title: 保存を押す
        body: 保存を押すと、保存する前に、変更の一覧を見せます。保存の直前に、子チケットが着手中でないかを ccnavi に再確認します。
        scene: {doc: main-edited, dirty: true, history: true}
      - target: review
        title: 変更の一覧
        body: 読み込んだ時点からの変更を、追加したノード・削除したノード・変更したノード・接続ごとに並べます。意図しない変更が混じっていないかを読んでから、「保存する」を押します。
        scene: {doc: main-edited, base: main, dirty: true, history: true, review: true}
      - target: review-skip
        title: 次回から保存前の確認を省略
        body: チェックを付けて保存すると、次回からは一覧を出さずに保存します。設定 ccnaviBoard.flowSaveReview で再び有効にできます。
        scene: {doc: main-edited, base: main, dirty: true, history: true, review: true}
      - target: lock
        title: 着手中は閲覧のみ
        body: 子チケットが着手中かレビュー中のあいだは、フローを変更できません。担当のサブエージェントが読んでいる手順が、途中で変わるのを防ぐためです。欄・部品箱・保存が止まり、終わってから直します。
        scene: {doc: main, lock: true}
      - target: changed
        title: 外で変わったとき
        body: ファイルが画面の外で変わると、この帯が出ます。編集中の内容は残りますが、戻す先が変わるので履歴は空になります。「再読み込み」で再読み込みします。
        scene: {doc: main-edited, dirty: true, changed: true}

  - id: agent-draft
    title: エージェントの下書きを取り込む
    summary: エージェントにフローの下書きを頼み、差分を読んで取り込む
    steps:
      - target: request
        title: エージェントに頼む
        body: 着手の前なら、エージェントにフローの作成や直しを頼めます。このボタンは、依頼文を作るだけです。エージェントは下書きのみを作成します。取り込むかどうかは、この画面で差分を確認して判断してください。
        scene: {doc: main}
      - target: request-text
        title: 依頼文を渡す
        body: 文は、コピーして進行中のセッションに貼るか、新しいセッションで開いて渡します。どの子の、どこに保存し、何を確認してから渡すかが記載されています。効力のあるフローには保存させません。
        scene: {doc: main, requestText: true}
      - target: offer
        title: 提案あり
        body: 下書きがいまのフローと違うと、この帯が出ます。「提案を見る」で、ccnavi が検証した下書きを開きます。
        scene: {doc: main, offer: true}
      - target: proposal
        title: 差分を確認する
        body: 変わった欄の前と後を並べます。フローの文は担当のサブエージェントへの案内になるので、外部のツールを使わせる指示などが紛れていないかを、ここで読みます。
        scene: {doc: main, base: main, proposal: true}
      - target: proposal-import
        title: 取り込む
        body: 「取り込む」は、編集中の内容に入れるだけで、まだ保存しません。元に戻すで戻せます。着手中は取り込めません。未保存の変更があるときは、破棄して取り込むと表示されます。
        scene: {doc: main, base: main, proposal: true}
      - target: save
        title: 取り込んだあと保存する
        body: 取り込んだ内容は、いつもの保存の経路で保存します。取り込んだ内容のまま保存すると、下書きは消えます。直してから保存したときは、下書きを残します。
        scene: {doc: proposal, dirty: true, history: true}
