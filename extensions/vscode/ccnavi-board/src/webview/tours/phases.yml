# フェーズ管理画面の案内。`sample:`は案内の間だけ画面に出す見本（実際の定義ではない）。
#   path見本のファイルの場所（画面には「（見本）」を付けて出す）
#   lock作業中のチケットがあるときに画面が出す文（sceneのlockedで見せる）
#   error保存の検証が通らなかったときにツールバーの最後の行へ出す文（sceneのerrorで見せる）
#   phases見本の定義。phases.ymlと同じ書き方（versionとphases）
#   added    「＋ 定義を追加」で足した定義の見本。phasesと同じ書き方で、phasesの外に置く（sceneのadd: filledで末尾に足す）
#   projectプロジェクトの設定の見本（name・path・lock・phases）。sceneのtarget: libで切り替える
# `scene:`は手順ごとの画面の様子。手順ごとに全部を書く（前の手順を引き継がない）。
#   target開いている設定。self（ワークスペース。既定）かlib（プロジェクトlibの見本）
#   open開く定義のid（, で区切って複数）。指す先phase-* は、開いた最初の定義に付く。開いた定義が無ければ最初の定義に付く
#   more補足（agent / when）を開く定義のid（, で区切って複数）
#   find絞り込みの欄に入れる文字
#   add末尾に足す行。blank（「＋ 定義を追加」を押した直後の空の行）かfilled（sample.addedを書いた行）。足した行を開き、phase-* はその行に付く
#   dirty未保存の印を出し、保存を押せる状態にする
#   locked作業中のチケットがある状態（lockの文を出し、保存を止める）
#   error保存の検証が通らなかった文を、ツールバーの最後の行に出す
#   changedファイルが外で変わった帯を出す
#   helpヘルプの説明を開く
# `target:`の印（画面のdata-tour）:
#   target / path / dirty / open-file / changed / save / lock設定の切り替え / ファイルの場所 / 未保存の印 / 「エディタで開く」 / 外の変更の帯 / 保存 / 作業中の文
#   phases / phase-count / add / help / help-panel / find / status定義の一覧 / 件数 / 「＋ 定義を追加」 / 「ヘルプ」 / ヘルプの説明 / 絞り込みの欄 / 下の状態の文
#   phase-row / phase-id / phase-title / phase-kind / phase-review / phase-scope / phase-deliverables / phase-more / phase-agent / phase-when開いた定義の中
#   tour   「?」
screen: phases

sample:
  path: .ccnavi/config/project/phases.yml
  lock: 作業中のチケットがあります（2026-10-03-search-api）。いま保存すると、進行中の作業の判定が途中で変わるため、作業が終わってから保存してください。
  error: 定義design-feedbackはfeedbackなのでreviewはtrueにしてください（falseは指定できません）
  phases:
    version: 1
    phases:
      research:
        kind: work
        title: 調査
        review: false
        scope: ["wip/research/*"]
        deliverables: ["wip/research/summary.md"]
        when: 既存の振る舞いや依存が分からないとき。分かっているなら省略する
      design:
        kind: work
        title: 設計
        review: true
        scope: ["wip/design/*", "docs/*"]
        deliverables: ["wip/design/*.md"]
        when: 変更箇所が3か所を超えるか、外から見える振る舞いが変わるとき
      acceptance:
        kind: work
        title: 受入テスト作成
        review: true
        scope: ["tests/*"]
        agent: acceptance-tester
        when: 振る舞いが変わるとき。設計のあと、実装より先に書く
      implement:
        kind: work
        title: 実装とテスト
        review: true
        scope: ["src/*", "tests/*"]
        agent: implementer
        when: 振る舞いを変えるとき。受入テスト作成を先に置く
      design-feedback:
        kind: feedback
        title: 設計フィードバック対応
        review: true
        scope: ["wip/design/*", "docs/*"]
        when: 設計への指摘だけに対応するとき
      implement-feedback:
        kind: feedback
        title: 実装フィードバック対応
        review: true
        scope: inherit
        when: フィードバック計画の最後に置き、ほかの対応がすべて先行する
  added:
    security-review:
      kind: work
      title: セキュリティ確認
      review: true
      scope: ["wip/security/*"]
      deliverables: ["wip/security/report.md"]
      agent: security-reviewer
      when: 認証や外部入力に触れるとき。設計のあと、実装より先に置く
  project:
    name: lib
    path: projects/lib/.ccnavi/config/project/phases.yml
    lock: プロジェクトlibに作業中のチケットがあります（2026-10-05-lib-parser）。いま保存すると、進行中の作業の判定が途中で変わるため、作業が終わってから保存してください。
    phases:
      version: 1
      phases:
        quick:
          kind: work
          title: 小さい作業
          review: true
          scope: inherit
          when: 設計判断が要らないとき
        api-change:
          kind: work
          title: 公開APIの変更
          review: true
          scope: ["src/api/*", "tests/*", "docs/api/*"]
          deliverables: ["docs/api/changes.md"]
          when: 公開APIを変えるとき。利用者への影響を変更履歴に書く
        quick-feedback:
          kind: feedback
          title: 小さい作業への指摘対応
          review: true
          scope: inherit

# 案内の手順が引く時系列の図。登場者を左から並べ、矢印を上から下へ時間順に並べる。矢印の`value`は実際に入れる値や出る答えの例（等幅）で、
# 値は上の`sample:`の定義（research・designなど）と同じにする。手順の`diagram:`で名前を指し、`focus:`で光らせる矢印（idを , で区切る）を決める。
# `to`を書かない矢印は、その登場者の中の動き。
diagrams:
  # 定義を直して保存し、承認で計画に使われるまで
  phase-save:
    actors: [ユーザ, フェーズ管理画面, ccnavi, phases.yml]
    steps:
      - id: edit
        from: ユーザ
        to: フェーズ管理画面
        text: researchの定義を直す
        value: |-
          review: false
          scope: ["wip/research/*"]
          deliverables: ["wip/research/summary.md"]
      - id: save
        from: フェーズ管理画面
        to: ccnavi
        text: 「保存」を押すと、編集中の内容を一時ファイルに書いて検証する（--lint）
        value: 'feedbackの定義にreview: falseを書くと、errorで保存できない'
      - id: lock
        from: フェーズ管理画面
        text: 作業中のチケット（doing）があると、進行中の作業の判定が途中で変わるため保存できない。エージェントが応答中なら、保存してよいかの確認が出る。
      - id: write
        from: フェーズ管理画面
        to: phases.yml
        text: 検証を通ったら書き込む
        value: .ccnavi/config/project/phases.yml（ワークスペースの設定を開いているとき）
      - id: use
        from: ccnavi
        to: phases.yml
        text: 読むのは、親の提案の承認・--fill-phases・--lintのときだけ
        value: 承認のあとは、親が持つ定義のコピーを読む。ここを直しても進行中の親は変わらない

  # 計画のステップからコピーを作り、承認で固定するまで
  phase-fill:
    actors: [エージェント, 親の提案, ccnavi, phases.yml, ユーザ]
    steps:
      - id: plan
        from: エージェント
        to: 親の提案
        text: planに、使う定義を番号付きのステップとして並べる
        value: |-
          plan:
            - research
            - {type: design, after: [1]}
            - {type: acceptance, after: [2]}
            - {type: implement, after: [3]}
      - id: fill
        from: エージェント
        to: ccnavi
        text: 計画が使う定義のコピーを頼む
        value: ccnavi --plan-order <親> --fill-phases
      - id: read
        from: ccnavi
        to: phases.yml
        text: 計画のステップが使う定義だけを読む（共通設定に、親のprojectが指す設定を重ねたもの）
      - id: write
        from: ccnavi
        to: 親の提案
        text: 'phases: の値を、使う定義に差し替える（抜粋）'
        value: |-
          phases:
            research: {review: false, scope: ["wip/research/*"]}
            design: {review: true, scope: ["wip/design/*", "docs/*"]}
            acceptance: {review: true, scope: ["tests/*"]}
            implement: {review: true, scope: ["src/*", "tests/*"]}
          # ステップが使わない design-feedback などはコピーしない
      - id: agree
        from: ユーザ
        to: ccnavi
        text: 承認すると、計画とコピーが親に固定される
        value: ccnavi user agree <親>

  # 子が終わって、フェーズが終わる。review: falseの例（research）
  phase-end-false:
    actors: [親（メインエージェント）, ccnavi]
    steps:
      - id: finish
        from: 親（メインエージェント）
        to: ccnavi
        text: 一つ目のフェーズ（research）の子をクローズする
        value: sh .ccnavi/scripts/ccnavi-ticket.sh finish <子>
      - id: deliverables
        from: ccnavi
        text: クローズする前に、必須成果物があってgitに追跡されているかを見る
        value: wip/research/summary.mdが無いと、finishは失敗する
      - id: ended
        from: ccnavi
        text: フェーズが終わったかを調べる
        value: |-
          phase: 1 の子は1件で、done
          doing（とtodo）に0件、doneに1件
          → フェーズ1は終わり
      - id: kind
        from: ccnavi
        text: 'レビューの要否を決める。定義はfalseで、計画のステップにreview: trueは無く、実績のリスクもHIGHに届いていない。'
        value: 'review: false → 不要'
      - id: reply
        from: ccnavi
        to: 親（メインエージェント）
        text: エージェントに、レビューを省略して次のフェーズへ進むよう伝える。子はfinishの時点でdone/に入る。
        value: 'マーカー（ccnaviが記録する状態）: skipped'

  # 同じく子が終わる。review: trueの例（design）
  phase-end-true:
    actors: [親（メインエージェント）, ccnavi, MR, ユーザ]
    steps:
      - id: finish
        from: 親（メインエージェント）
        to: ccnavi
        text: 二つ目のフェーズ（design）の最後の子をクローズする
        value: sh .ccnavi/scripts/ccnavi-ticket.sh finish <子>
      - id: ended
        from: ccnavi
        text: フェーズが終わり、レビューが必要になる
        value: |-
          phase: 2 の子はdoneに1件
          review: true → 必要
      - id: reply
        from: ccnavi
        to: 親（メインエージェント）
        text: エージェントに、すべての子が合流済みかを確かめ、レビューを依頼し、応答を終えてユーザを待つよう伝える
        value: 'マーカー（ccnaviが記録する状態）: pending'
      - id: stop
        from: ccnavi
        text: レビュー済みになるまで、その親の作業フォルダ（cwd）からのサブエージェントの起動とBashを止める。通るのは、ccnavi-ticket.sh・ccnavi-review.sh・ccnavi-git.sh・資料を引くccnavi-launcher.sh --docsと、Write / Edit。
        value: '拒否の種類（ccnaviが返すコード）: DENY_PHASE_REVIEW'
      - id: request
        from: 親（メインエージェント）
        to: MR
        text: レビューを依頼する（依頼を出すまでが「レビュー準備中」、出してからが「レビュー待ち」）
        value: sh .ccnavi/scripts/ccnavi-review.sh review-request --phase 2 --body-file …
      - id: confirm
        from: ユーザ
        to: ccnavi
        text: 指摘が片付いたら、レビュー済みにする。未解決の指摘が残るなら、decideで対応方針を選ぶ。
        value: チケット管理画面の「レビュー完了」、または sh .ccnavi/scripts/ccnavi-review.sh confirm --phase 2
      - id: open
        from: ccnavi
        text: review/の子がdone/へ移り、停止が解除される
        value: 'マーカー（ccnaviが記録する状態）: reviewed'

  # レビューが要るかは、定義・計画のステップ・引き受けた延期のどれか1つでも要ると言えば要る。定義がfalseでも要る扱いになる例（research）
  phase-review-up:
    actors: [フェーズ定義, 親の計画, ccnavi]
    steps:
      - id: def
        from: フェーズ定義
        to: ccnavi
        text: researchの定義は、レビューを省略する
        value: 'review: false'
      - id: plan
        from: 親の計画
        to: ccnavi
        text: '計画のステップにreview: trueを書くと、定義がfalseでもレビューが必要になる'
        value: '- {type: research, review: true}'
      - id: pick
        from: ccnavi
        text: 1つでもtrueなら、レビューが必要になる
        value: falseとtrue → 必要
      - id: risk
        from: ccnavi
        text: 'ステップにreview: trueが無くても、クローズした子の実績のリスクがHIGH以上なら、レビュー不要の判定を必要に変える'
        value: 'リスク: 58 (HIGH) — 行数が多い → 必要'

  # 順序は計画のステップのafterが決める（定義には順序の欄が無い）
  phase-order:
    actors: [親の計画, ccnavi, ユーザ]
    steps:
      - id: after
        from: 親の計画
        to: ccnavi
        text: ステップごとに、先に済ませる番号をafterに書く（自分より小さい番号だけ）
        value: |-
          1: research
          2: {type: design, after: [1]}
          3: {type: acceptance, after: [2]}
          4: {type: implement, after: [3]}
      - id: waits
        from: ccnavi
        text: afterをたどって、各ステップの先行を計算する
        value: |-
          3: acceptance — 先行 1, 2
          4: implement — 先行 1, 2, 3
      - id: gate
        from: ユーザ
        to: ccnavi
        text: 四つ目の子を承認しようとする
        value: 三つ目がクローズされてレビューが済むまで、承認されない
      - id: fixed
        from: ccnavi
        text: 先行は親の計画から計算する。承認のあとにphases.ymlを直しても変わらない。

courses:
  - id: intro
    title: 基本の案内
    summary: 画面の見方。定義・補足・保存。
    steps:
      - target: phases
        title: フェーズ定義
        body: 工程の型です。作業（work）の定義は親チケットの計画（plan）に、フィードバック対応（feedback）の定義はレビューのあとの計画（feedback）に並べます。順序（どのフェーズにどのフェーズが先行するか）は、親チケットの計画のステップのafterで決めます（この画面には記載しません）。行を押すと欄が開き、「＋ 定義を追加」で増やせます。
      - target: phase-more
        title: 補足
        body: 「案内するエージェント」と「使う場面」です。どちらもエージェントへの案内にだけ使い、判定には使いません。計画のどこに置くか（受入テスト作成を先に置く、フィードバック計画の最後に置く、など）も「使う場面」に入力します。
        scene:
          open: research
          more: research
      - target: save
        title: 保存
        body: 「保存」を押すと、ccnaviが検証し、通ればファイルに反映します。通らなければ、下に理由が出ます。
      - target: help
        title: ヘルプ
        body: 細かい説明はここから開けます。
      - target: tour
        title: 案内
        body: ヘッダ右上の「?」を押すと、基本の案内と、使い方ごとの案内を選べます。

  - id: how-phase-works
    title: 保存した定義が、計画と承認でどう使われるかを、値の例で知りたいとき
    summary: 保存で何が検証され、いつ読まれ、計画のコピーと承認で何が決まり、順序はどこで決まるか
    steps:
      - target: phase-review
        title: 例の定義
        body: 見本の調査（research）の定義で追います。レビューはfalse、編集可能な範囲はwip/research/*、必須成果物はwip/research/summary.mdです。直している間は「未保存」の印が付くだけで、ファイルは変わりません。
        scene: { open: research }
        diagram: phase-save
        focus: edit
      - target: save
        title: 保存すると、まず検証される
        body: 「保存」を押すと、編集中の内容を一時ファイルに書いて、ccnaviが検証します。errorが1件でもあれば、何も保存しません。作業中のチケットがあるときは、進行中の作業の判定が途中で変わるため保存できません。エージェントが応答中なら、保存してよいかの確認が出ます。Ctrl+Sでも保存できます。押せないときは、ボタンにカーソルを合わせると理由が出ます。
        scene: { open: research, dirty: true }
        diagram: phase-save
        focus: save, lock
      - target: save
        title: 書き込まれて、承認のときに読まれる
        body: 検証を通ると、画面がphases.ymlに書き込みます。この定義を読むのは、親チケットの提案の承認、--fill-phases、--lintのときだけです。承認のあとは、親が持つコピーを読むので、あとで直しても進行中の親には反映されません。
        scene: { open: research, dirty: true }
        diagram: phase-save
        focus: write, use
      - target: phases
        title: 計画に並べる
        body: 親の提案のplanに、使う定義をステップとして並べます。ステップの番号が、子チケットのphaseの番号になります。ステップは名前だけでも、typeとafterを持つ形でも書けます。
        diagram: phase-fill
        focus: plan
      - target: phases
        title: 使う定義だけをコピーする
        body: "--fill-phasesは、計画のステップが使う定義だけをphases.ymlから読み、親の提案のphases: にコピーします。ステップが使わない定義はコピーしません。phases.ymlを直したあとで、承認待ちの提案に反映するときも、同じ操作を使います。"
        diagram: phase-fill
        focus: fill, read, write
      - target: phases
        title: 承認で固定される
        body: 承認（ccnavi user agree）すると、計画とコピーが親に固定され、以後の判定はコピーを読みます。コピーに書いたscopeとreviewも、その時点の値のままです。
        diagram: phase-fill
        focus: agree
      - target: phases
        title: 順序は計画のafterが決める
        body: 定義には順序の欄がありません。どのフェーズにどのフェーズが先行するかは、計画のステップのafterが決めます。四つ目のimplementには、3 → 2 → 1をたどって1, 2, 3が先行します。
        diagram: phase-order
        focus: after, waits
      - target: phases
        title: 先行は承認のときに確かめられる
        body: 四つ目の子は、三つ目がクローズされてレビューが済むまで承認されません。先行は計画から計算するので、承認のあとにphases.ymlを直しても変わりません。afterを書き漏らすと、並列に進めるステップとして通ってしまいます。承認の画面の「すぐ始まる」の一覧で確かめてください。
        diagram: phase-order
        focus: gate, fixed

  - id: how-phase-ends
    title: フェーズが終わったあとの動きが、reviewでどう変わるかを知りたいとき
    summary: reviewがfalseとtrueのときの違い。定義・計画のステップ・リスクでレビューが必要になる条件。
    steps:
      - target: phase-review
        title: reviewがfalseの定義
        body: 調査（research）はreviewがfalseです。最後の子チケットをfinishでクローズするとき、必須成果物wip/research/summary.mdがgitに追跡されていないと、finishは失敗し、クローズできません。
        scene: { open: research }
        diagram: phase-end-false
        focus: finish, deliverables
      - target: phases
        title: falseなら、レビューを省略して進む
        body: 同じphaseの子がdoingにもtodoにも無く、doneに1件以上あれば、フェーズは終わりです。レビューが不要なら、ccnaviはエージェントに、レビューを省略して次のフェーズへ進むよう伝えます。ユーザの操作は要りません。
        diagram: phase-end-false
        focus: ended, kind, reply
      - target: phase-review
        title: reviewがtrueの定義
        body: 設計（design）はreviewがtrueです。最後の子をクローズしてフェーズが終わると、レビューが必要になります。
        scene: { open: design }
        diagram: phase-end-true
        focus: finish, ended
      - target: phases
        title: trueなら、ユーザを待って止まる
        body: ccnaviはエージェントに、すべての子が合流済みかを確かめ、レビューを依頼し、応答を終えてユーザを待つよう伝えます。レビュー済みになるまで、その親チケットの作業フォルダ（cwd）からのサブエージェントの起動とBashが止まります。次のフェーズの計画を書くWriteとEditは通ります。
        diagram: phase-end-true
        focus: reply, stop
      - target: phases
        title: 依頼してから、レビュー済みまで
        body: エージェントがMRにレビューを依頼したら、指摘を付けてください。指摘が片付いたら、チケット管理画面の「レビュー完了」かconfirmでレビュー済みにしてください。review/の子がdone/へ移り、停止が解除されます。
        diagram: phase-end-true
        focus: request, confirm, open
      - target: phase-review
        title: 定義がfalseでも、計画のステップでtrueにできる
        body: '定義のreviewと計画のステップのreviewのどちらかがtrueなら、そのフェーズはレビューが必要です。たとえばresearchは定義がfalseでも、計画のステップにreview: trueを書けばレビューを受けます。'
        scene: { open: research }
        diagram: phase-review-up
        focus: def, plan, pick
      - target: phases
        title: リスクが高ければ、falseでもレビューが必要になる
        body: クローズした子の実績のリスクがHIGH以上なら、定義と計画のreviewがfalseでも、レビューが必要になります。リスクの点数と理由は、クローズしたときの出力とレビューの依頼文の先頭に出ます。feedbackの定義は、もとからfalseを書けません。
        diagram: phase-review-up
        focus: risk

  - id: add-phase
    title: 新しい工程の定義を追加して、計画に利用できるようにしたいとき
    summary: 定義を追加し、id・区分・範囲・成果物を決めて保存する
    steps:
      - target: add
        title: 定義を追加する
        body: 「＋ 定義を追加」を押すと、空の定義が末尾に追加され、行が開いてidの欄にカーソルが移ります。追加した定義の既定は、区分がwork、レビューがtrue、編集可能な範囲がinheritです。保存するまでファイルには反映されません。
      - target: phase-id
        title: idを付ける
        body: idは定義の名前で、親チケットの計画に並べるときにこの名前で指します。英数字で始めます。使える文字は、英数字と「.」「_」「-」だけです。ほかの定義と重複すると、保存できません。
        scene:
          add: blank
      - target: phase-title
        title: タイトルを付ける
        body: 一覧や計画に表示する名前です。空ならidをそのまま使います。idと同じく、ほかの定義と重複する名前は使えません。
        scene:
          add: blank
      - target: phase-kind
        title: 区分を選ぶ
        body: 全体計画に並べる定義はwork、レビューの指摘に対応するフィードバック計画に並べる定義はfeedbackです。feedbackのレビューはtrueになります。
        scene:
          add: blank
      - target: phase-scope
        title: 編集可能な範囲を決める
        body: この定義で作る子チケットの、編集できる範囲の上限です。ワークツリーのルートからのglobを指定するか、inheritで親の範囲そのままにします。子の範囲が上限に収まるかは、ccnaviが判定します。
        scene:
          add: filled
      - target: phase-deliverables
        title: 必須成果物を決める
        body: 子をクローズする前に存在し、gitに追跡されている必要があるファイルです。複数あるときは , で区切ります。空なら確かめません。
        scene:
          add: filled
      - target: save
        title: 保存して計画に使う
        body: 保存すると、検証を通ったあとにphases.ymlに反映されます。親チケットの計画のステップにこのidを並べると利用できます。親は承認のときに定義のコピーを保持するので、あとで直しても進行中の親には反映されません。
        scene:
          add: filled
          dirty: true

  - id: guide-agent
    title: 受入テスト作成などの使いどころを、エージェントに案内したいとき
    summary: 「補足」の「案内するエージェント」と「使う場面」を入力し、計画のどこに置くかを伝える
    steps:
      - target: phase-more
        title: 補足の欄
        body: 定義の下に「補足」の見出しがあります。案内するエージェント（agent）と使う場面（when）の2欄で、値がある定義は最初から開きます。どちらもエージェントへの案内にだけ使い、判定には使いません。
        scene:
          open: acceptance
      - target: phase-agent
        title: 案内するエージェント
        body: この定義の子チケットを任せたいサブエージェントの名前です。案内に出すだけで、割り当てはしません。見本では受入テスト作成にacceptance-testerを記載しています。
        scene:
          open: acceptance
          more: acceptance
      - target: phase-when
        title: 使う場面
        body: この定義を計画に入れる場面と、計画のどこに置くかを入力します。見本では「設計のあと、実装より先に書く」と入力し、置き場所を伝えています。順序そのものは、親チケットの計画のステップのafterで決めます。
        scene:
          open: acceptance
          more: acceptance
      - target: find
        title: 使う場面で探す
        body: 絞り込み欄は、id・タイトル・範囲・成果物に加えて、「使う場面」の文字にも一致します。見本では「実装より先」で、受入テスト作成だけが残ります。
        scene:
          find: 実装より先
      - target: help-panel
        title: 順序は計画に記載する
        body: 工程の順序は、この画面でも定義でも指定しません。親チケットの計画のステップにafterで先行を指定します。「使う場面」に入力した置き方は、計画を書くエージェントが読む案内です。
        scene:
          help: true
      - target: save
        title: 保存する
        body: 補足を入力し終えたら保存してください。補足は判定に使わないので、入力しても承認や着手の結果は変わりません。
        scene:
          open: acceptance
          more: acceptance
          dirty: true

  - id: feedback
    title: フィードバック対応の定義を使い分けたいとき
    summary: feedbackの定義の区分・レビュー・範囲・置き方を決める
    steps:
      - target: phases
        title: workとfeedback
        body: 一覧にはworkとfeedbackの定義が並びます。workはレビューを受ける前の計画（plan）に、feedbackはレビューの指摘に対応する計画（feedback）に並べます。計画に並べられるのは、それぞれの区分の定義だけです。
      - target: phase-kind
        title: 区分はfeedbackにする
        body: 区分をfeedbackにした定義だけが、フィードバック計画に並べられます。指摘の種類（設計か実装か）ごとに、定義を分けておいてください。
        scene:
          open: implement-feedback
      - target: phase-review
        title: レビューはtrueのまま
        body: feedbackの定義は、レビューをtrueにします。falseにすると検証が通らず、保存できません。対応した結果も、必ずレビューを受けます。
        scene:
          open: implement-feedback
      - target: phase-scope
        title: 指摘の種類で範囲を絞る
        body: 設計への指摘だけを直す定義は、範囲をwip/designとdocsに絞ります。実装への指摘は、範囲をinheritにすると親チケットの範囲をそのまま使うので、指摘が多岐にわたっても収まります。
        scene:
          open: design-feedback
      - target: phase-when
        title: 最後に置いてほかの対応を受ける
        body: 「使う場面」に、フィードバック計画のどこに置くかを入力します。見本の実装フィードバック対応は最後に置き、ほかの対応がすべて先行するようにしています。互いに独立した対応は、最後の1ステップに合流させるか、一直線に並べてください。
        scene:
          open: implement-feedback
          more: implement-feedback
      - target: find
        title: feedbackだけを見る
        body: 絞り込み欄にfeedbackと入れると、idにfeedbackを含む定義だけが残ります。定義が増えたときに、workとfeedbackの取り違えを防げます。
        scene:
          find: feedback
      - target: help-panel
        title: 順序は計画に記載する
        body: フィードバック計画の順序も、定義ではなくfeedbackのステップのafterで決めます。最後のステップにほかのすべてのステップが先行する形にしてください。
        scene:
          help: true

  - id: project
    title: プロジェクトごとの定義に切り替えたいとき
    summary: 共通設定・ワークスペース・プロジェクトの定義を切り替えて直す
    steps:
      - target: target
        title: 設定を切り替える
        body: 開いている設定はワークスペースの設定で、親チケットのprojectが空のときに使われます。この欄で、共通設定や、設定のあるプロジェクトの定義に切り替えられます。
      - target: phases
        title: ワークスペースの定義
        body: 見本のワークスペースには、調査・設計・受入テスト作成・実装とテストなどの作業の定義と、フィードバック対応の定義があります。
      - target: target
        title: プロジェクトを選ぶ
        body: プロジェクトを選ぶと、このタブの中身がそのプロジェクトの定義に変わります。タブは1枚のままです。見本ではlibを選んでいます。
        scene:
          target: lib
      - target: path
        title: ファイルの場所
        body: プロジェクトの定義は、プロジェクトの.ccnavi/config/project/phases.ymlにあります。どの設定を開いているかは、ここに出るパスで見分けます。
        scene:
          target: lib
      - target: phases
        title: 共通設定との重ね合わせ
        body: 使われるのは、共通設定の定義に、親チケットのprojectが指す設定（ワークスペースかプロジェクトのどちらか1つ）の定義を重ねたものです。ワークスペースの定義とプロジェクトの定義は合算されません。同じidで中身が違う定義と、タイトルが重複する定義は、保存のときの検査で止まります。
        scene:
          target: lib
      - target: target
        title: 未保存の変更があるとき
        body: 未保存の変更があるまま別の設定を選ぶと、破棄してよいかを確認します。キャンセルすれば、今の設定のまま編集を続けられます。
        scene:
          target: lib
          dirty: true
      - target: lock
        title: 保存できない間
        body: プロジェクトの定義は、そのプロジェクトのチケットにしか使われません。保存が止まるのは、そのプロジェクトに作業中のチケットがある間だけです。ワークスペースの定義は、どこかに作業中のチケットがあれば止まります。
        scene:
          target: lib
          dirty: true
          locked: true

  - id: save
    title: 定義を保存して、書式を検証したいとき
    summary: 未保存の印・検証・保存できない理由・外での変更を確認する
    steps:
      - target: dirty
        title: 未保存の印
        body: 定義を直すと、ヘッダに「未保存」が出て、「保存」を押せるようになります。直した内容は、保存するまでファイルには反映されません。
        scene:
          dirty: true
      - target: save
        title: 検証してから保存する
        body: 「保存」を押すと、直した内容を一時ファイルに書いて、ccnaviの検証（lint）を通します。通ればphases.ymlに反映します。コメントは、直していない場所ではそのまま残ります。
        scene:
          dirty: true
      - target: status
        title: 通らなかったとき
        body: 検証が通らなければ、保存せずに、ツールバーの最後の行へ理由を出します。検証に通らない例は、識別子に使えないid、重複したタイトル、reviewがfalseのfeedbackの定義です。同じidが2つあるときは、画面が先に止めます。
        scene:
          dirty: true
          error: true
      - target: lock
        title: 作業中は保存できない
        body: いま保存すると、進行中の作業の判定が途中で変わるため、作業中のチケットがある間は保存を止めます。作業が終わってから保存してください。
        scene:
          dirty: true
          locked: true
      - target: changed
        title: 外で変わったとき
        body: エディタなどでファイルが変わると、画面上部に帯が出ます。「更新」を押すと読み直し、画面で編集中の内容は読み直した内容に置き換わります。
        scene:
          changed: true
      - target: open-file
        title: エディタで開く
        body: 画面で直しにくいこと（コメントの追記など）は、「エディタで開く」でファイルを開いて直してください。YAMLとして読み込めないファイルも、エディタで直してください。
