        - { key: thread-2, url: "https://example.com/sample/pulls/12#discussion_r2", path: src/format.ts, line: 10, body: "この分岐を通るテストがありません" }

courses:
  - id: intro
    title: 基本の案内
    summary: 画面の見どころを順に回ります
    steps:
      - target: summary
        title: 集計
        body: 承認待ちと不備の件数、残りのチケット数です。絞り込みに関係なく、チケット管理画面全体の数を表示します。
      - target: filter-attention
        title: 絞り込み
        body: プロジェクトと親チケットで絞り込めます（プロジェクトや親があるときだけ欄が出ます）。「要対応のみ」は、承認待ち・レビュー待ち・ワークツリーなし・HIGH 以上のリスク・不備など、ユーザが対応する必要があるカードだけを表示します。
      - target: board
        title: 列
        body: チケットは「未着手 → 作業中 → 完了（または取り消し）」の順に列を移ります。見出しを押すと列を畳み、右端をドラッグすると幅を変えられます（ダブルクリックで元に戻ります）。
      - target: status
        title: 状態の札
        body: カードの見出しの右端に、いまの状況を表す札が 1 つ出ます。「承認待ち」「開始前」「作業中」「レビュー準備中」「レビュー待ち」「完了」「取り消し」「要確認」のどれかです。「要確認」は、どちらが正か決まらない・書き込み停止中・状態が合わない、のどれかのときです。理由はマウスを載せると出ます。
      - target: turn
        title: あなたの番
        body: ユーザができることがあるカードだけに「あなたの番」が出ます。承認待ちなら［承認］、レビュー待ちなら［MR を開く］と［レビュー完了］です。札は状況を、ここはユーザができることを表し、それぞれ別に決まります（「要確認」の札のカードにも、承認待ちなら［承認］が出ます）。
      - target: details
        title: 詳細
        body: マージリクエスト・issue・ブランチ・ワークツリー・リスク・人間レビューの要否と、不備や停止の理由の全文は「詳細」に畳んであります。開きたいときだけ開けます。開閉はカードごとに覚えるので、更新しても閉じません。
        scene: { details: sample-c }
      - target: approve
        title: 承認
        body: 絞り込みで見えている承認待ちをまとめて承認します。押すと承認する内容がオーバーレイに出るので、確認してから承認してください。承認のあと、Claude Code に伝えるプロンプトを渡せます。
      - target: refresh
        title: 更新
        body: チケットとワークツリーの状態を更新します。前回の更新から列が変わったカードには動いた表示が付きます。
      - target: merge-check
        title: マージ状況を確認
        body: 親を終えたあとの片付け待ちのマージリクエストが、マージ済みかを確かめます。読むだけで、何も変えません。結果は上の帯に出ます。
      - target: tour
        title: 案内
        body: この案内は、ヘッダ右上の ? からもう一度見られます。? を押すと、使い方ごとの案内（承認・レビュー・マージ状況・絞り込みなど）の一覧が開きます。

  - id: to-merge
    title: 作業を頼んでからマージするまでの流れを知りたいとき
    summary: 頼む・承認・作業・MR でのレビュー・マージ・片付けを順に回します
    steps:
      - target: board
        title: 全体の流れ
        body: 作業は「Claude Code に頼む → 提案を承認する → エージェントが作業する → MR でレビューする → 親を閉じてマージする → 片付ける」の順に進みます。ボードは、この間のユーザの番（承認・レビュー・片付け）を見つけて進める場所です。この案内で全体をたどります。
      - target: ""
        title: まず issue を用意する（2 通り）
        body: チケット作業は issue と MR のセットで進むので、最初に issue を用意します。作り方は 2 通りです。「人が GitLab で作る」（この次の 2 手順）か、「Claude Code に頼んで作ってもらう」（その次の手順）です。人が作るときは、プロジェクトのサイドバーで「Plan」を開き、「Issues」を選びます。
        image: gitlab-issues-menu
        alt: GitLab のプロジェクトのサイドバー。「Plan」の下に「Issues」「Issue boards」「Milestones」「Wiki」が並んでいる
      - target: ""
        title: 人が作る：「New item」を押す
        body: issue の一覧が開きます。右上の「New item」を押すと、新しい issue の入力欄が開きます。
        image: gitlab-issues-list
        alt: GitLab の issue の一覧。右上に青い「New item」ボタンがある
      - target: ""
        title: 人が作る：題と説明を書いて作成する
        body: 種類は「Issue」のまま、題（Title）と説明（Description）を書いて「Create issue」を押します。説明には、困っていることや目的を書きます。作った issue の番号が、親チケットの識別子の番号になります。
        image: gitlab-new-issue
        alt: GitLab の新しい issue の入力欄。種類・題・説明を書き、右下の「Create issue」で作成する
      - target: ""
        title: Claude Code に作業を頼む
        body: 作った issue の番号か URL を、Claude Code の入力欄で伝えて作業を頼みます。issue をまだ作っていないときは、作業の内容だけを頼めば、エージェントが issue を作ります。調査や小さな修正は、チケットを使わない直接作業で進みます。設計に触れる・複数のフェーズに分かれる・ユーザのレビューが要る作業は、エージェントがチケット作業として提案を書き、MR を用意します。
        image: claude-code-prompt
        alt: Claude Code の画面。下部の入力欄に作業を頼むプロンプトを入力して送る
      - target: ""
        title: MR を用意する（人が作る場合もある）
        body: MR は、エージェントが用意します。人が GitLab で作ってもかまいません。その場合は、ソースを親チケットのブランチ、ターゲットを統合先のブランチにして、題と説明を書き、「Submit merge request」を押します。説明に「Fixes #番号」と書くと、issue と結び付きます。
        image: gitlab-new-mr
        alt: GitLab の新しい MR の入力欄。ソースとターゲットのブランチ、題、説明を書き、下の「Submit merge request」で作成する
      - target: card-sample-a
        title: 承認待ちの提案が届く
        body: 提案は、「未着手」の列に札「承認待ち」のカードで出ます。目的・範囲・計画が書かれています。カードを押すと提案のファイルを開けます。直したい点は、Claude Code に伝えて書き直してもらいます。
      - target: approval-batch
        title: 内容を確認して承認する
        body: カードの［承認］（またはヘッダの「承認待ち N 件を承認」）を押すと、承認する内容がオーバーレイに出ます。編集できる範囲・人間レビューの要否・理由を確かめて、「この N 件を承認する」で承認します。承認するまでは、何も変わりません。
        scene: { overlay: approval }
      - target: approval-handover
        title: 承認したことを Claude Code に伝える
        body: 承認できたら、Claude Code に伝えるプロンプトが出ます。コピーして進行中のセッションに貼るか、新しいセッションで開いて渡します。承認済みのチケットを他の機械へ届ける push は、ボードが統合ターミナルに送ります。
        scene: { overlay: done }
      - target: phases
        title: エージェントが作業する
        body: 承認すると、エージェントがフェーズごとの子チケットを、それぞれのワークツリーで進めます。親のカードには札「作業中」とフェーズ一覧が出て、［更新］で進み具合を確かめられます。フェーズが複数あるときは、作業とレビューをフェーズごとに繰り返します。
      - target: card-sample-c
        title: レビュー待ちになったら
        body: レビューが要るフェーズが終わると、エージェントが MR にレビューを依頼します。親の札が「レビュー待ち」になり、「あなたの番」に操作が出ます。依頼を出す前の「レビュー準備中」は、エージェントの番です。
      - target: mr
        title: MR を開く
        body: ［MR を開く］から、レビューの場の MR を開きます。差分とレビューの依頼が載っています。指摘は MR の上に書きます。ボードは MR の中身を読みません。
      - target: ""
        title: 差分に指摘を付ける（GitLab）
        body: 差分の行にマウスを載せると、行番号の横に吹き出しのボタンが出ます。押すとその行にコメントを書けます。ドラッグすると複数の行をまとめて選べます。
        image: gitlab-line-comment
        alt: GitLab の差分画面。行番号の横の吹き出しのボタンに「Add a comment to this line or drag for multiple lines」と出ている
      - target: ""
        title: 指摘は「Start thread」で書く（GitLab）
        body: コメントを書いたあと、送信ボタンの横の ▼ で「Comment」か「Start thread」を選びます。直してほしい指摘は「Start thread」にします。解決するまで残る議論になり、ccnavi が未解決の指摘として読みます。「Comment」は解決の対象にならない通常のコメントです。
        image: gitlab-start-thread
        alt: GitLab のコメント欄。送信ボタンの横の ▼ を開くと、「Comment」と「Start thread」の 2 つの選択肢が出ている
      - target: phase-review
        title: レビューを終える
        body: 指摘を付け終えたら、レビュー待ちの行の［レビュー完了］を押します。押すまで、ボードは指摘を読みません。
      - target: decide-threads
        title: 残った指摘の対応方針を決める
        body: ［レビュー完了］を押すと、未解決の指摘を読みます。0 件ならそのままレビュー済みになります。残っていれば、1 件ずつ「対応しない」「このフェーズで直す」「issue に回す」を選びます。「このフェーズで直す」は、次の手順のとおり対応の子チケットを作って直す選択です。
        scene: { overlay: decide }
      - target: decide-confirm
        title: 方針を確定する
        body: 全部の指摘に方針を選ぶと、「この対応方針を確定」が押せます。押すと選んだ内容が置かれ、取り返せません。「このフェーズで直す」を選んだ指摘があると、追加対応用の子チケットが作られ、フェーズが開き直ります。
        scene: { overlay: decide }
      - target: approval-handover
        title: 決めた結果を Claude Code に伝える
        body: 確定すると、結果を伝えるプロンプトが出ます。承認のときと同じく、コピーして進行中のセッションに貼るか、新しいセッションで開いて渡します。エージェントは、前の会話が無くても、状況を確かめてから対応に入ります。
        scene: { overlay: done }
      - target: phases
        title: 対応の子チケットが指摘を直す
        body: 追加対応用の子チケットは、同じフェーズの番号で作られます。親の札が「作業中」に戻り、フェーズの行は進行中になります。エージェントが、指摘された点をこの子で直します。
      - target: phase-review
        title: 直ったら、もう一度レビューする
        body: 直し終えると、フェーズは再びレビュー待ちになります。MR で直った点を確かめ、片付いた指摘のスレッドは、ユーザが GitLab 上で解決済みにします（エージェントは解決済みにしません）。そのうえで［レビュー完了］を押します。未解決の指摘が 0 件になるまで、直す・確かめるを繰り返します。
      - target: column-done
        title: 親を閉じてマージする
        body: 最後のフェーズのレビューが済むと、エージェントが親を閉じ、MR の Draft を外します。親のカードは「完了」の列に並びます。MR のマージは、ユーザが GitLab の画面で行います。
      - target: ""
        title: MR の画面でマージする（GitLab）
        body: マージは、GitLab の MR の画面で、ユーザが「Merge」ボタンを押して行います。マージの前に、Draft が外れていることと、レビューの指摘が片付いていることを確かめます。
        image: gitlab-mr-merge
        alt: GitLab の MR の画面。「Merge」ボタンと「Remove source branch」の欄、下に議論・コミット・変更のタブがある
      - target: merge-check
        title: マージできたか確かめる
        body: マージしたあと、［マージ状況を確認］を押します。マージ待ちの親がマージ済みかを確かめて、結果を上の帯に出します。読むだけで、何も変えません。
        scene: { merge: true }
      - target: merge-retire
        title: 片付ける
        body: マージ済みの親の［片付ける］で、ボードのターミナルに ccnavi-sync.sh のコマンドを送ります。マージ済みかを確かめ直したうえで、条件を満たすものだけを片付けます。結果はターミナルで確認してください。これで、頼むところから片付けまでの 1 周が終わります。
        scene: { merge: true }

  - id: approve
    title: 承認待ちのチケットを承認したいとき
    summary: 承認待ちの見つけ方、1 件ずつ・まとめての承認、承認のあとの渡し方
    steps:
      - target: summary
        title: 承認待ちの件数
        body: ヘッダの「承認待ち N 件」は、承認が済んでいないチケットの数です。絞り込みに関係なく、ボード全体の数で、0 件なら出ません。
      - target: card-sample-a
        title: 承認待ちのカード
        body: 承認待ちのカードは「未着手」の列に並び、札は「承認待ち」です（承認済みの親に改版が出ているときは「承認待ち（改版）」）。カードを押すと提案のファイルを開きます。
      - target: approve-one
        title: 1 件だけ承認する
        body: カードの［承認］は、そのチケットだけを承認の対象にします。同じ親の承認待ちがほかにあっても巻き込みません。押すと内容がオーバーレイに出るだけで、まだ承認はされません。
      - target: approve
        title: まとめて承認する
        body: ヘッダの「承認待ち N 件を承認」は、絞り込みで見えている承認待ちをまとめて対象にします。絞り込み中は、見えていない承認待ちは入りません。件数はボタンに出ます。
      - target: approval-batch
        title: 承認の対象を確認する
        body: 承認する提案を表で確認します。本文には、編集できる範囲・人間レビューの要否・エージェントが記載した理由が並びます。「承認する」を押すまで何も変わらず、「キャンセル」か Esc で閉じます。
        scene: { overlay: approval }
      - target: approval-plan
        title: 計画の順序を見る
        body: 計画を持つ親には、全体計画の図が出ます。線は「どの項がどの項を待つか」で、承認すると、この順序で進めることに合意したことになります。
        scene: { overlay: approval }
      - target: approve-confirm
        title: 承認する
        body: 「この N 件を承認する」で承認します。計画編集タブに未保存の変更がある親が一覧にあると、押せなくなって理由が出ます。
        scene: { overlay: approval }
      - target: approval-handover
        title: 承認のあと
        body: 承認できたら、Claude Code に伝えるプロンプトが出ます。コピーして進行中のセッションに貼るか、新しいセッションで開いて渡します。
        scene: { overlay: done }

  - id: review
    title: レビュー待ちのフェーズに対応したいとき
    summary: 止まっているフェーズの見つけ方、レビュー完了、指摘の対応方針の決め方
    steps:
      - target: card-sample-c
        title: レビュー待ちの親を見つける
        body: 親の札が「レビュー待ち」なら、どれかのフェーズが、ユーザのレビューを待っています。依頼を出す前は「レビュー準備中」で、エージェントの番です。
      - target: phases
        title: どのフェーズが待っているか
        body: フェーズ一覧の右に、フェーズごとの状態が一言で出ます。「レビュー待ち」の行がユーザの番です。複数のフェーズが同時に待っているときは、それぞれの行に操作が付きます。
      - target: phase-review
        title: 行の中の操作
        body: レビュー待ちの行に、［MR を開く］と［レビュー完了］があります。主ボタンは［レビュー完了］だけです。子のカードも、札が「レビュー待ち」なら同じ操作が「あなたの番」に出ます。
      - target: mr
        title: マージリクエストを開く
        body: ［MR を開く］から、レビューの場を開きます。指摘はそこにコメントで書きます。ボードはマージリクエストの中身を読みません。
      - target: decide-threads
        title: 未解決の指摘の対応方針を選ぶ
        body: ［レビュー完了］を押すと、未解決（Unresolved）の指摘を読みます。1 件以上あれば 1 件ずつ並べ、対応方針を選びます。本文は 1 行目だけを出し、「全文」で開けます。「対応しない」は受け入れて進み、「このフェーズで直す」は追加対応用の子チケットを作成してフェーズを再開します。「issue に回す」は、指摘を別の issue に切り出して管理します。
        scene: { overlay: decide }
      - target: decide-consult
        title: エージェントに相談する
        body: 方針に迷ったら、「エージェントに相談するプロンプトをコピー」を押します。コピーされるのは、指摘を要約して方針の案を返してもらうプロンプトです。読み取りだけを頼むもので、確定する操作は含みません。対応方針は、この画面で決めます。
        scene: { overlay: decide }
      - target: decide-confirm
        title: 方針を確定する
        body: 全部の指摘に対応方針を選ぶまで、「この対応方針を確定」は押せません。押すと選んだ内容が置かれ、取り返せません。未解決の指摘が 0 件のときは「フェーズ N に未解決の指摘はありません」と出て、「レビュー済みにする」だけを押します。読み取れなかったときは、件数を出さずにその理由を出します。
        scene: { overlay: decide }

  - id: merge
    title: 終えた親のマージ待ちを確かめたいとき
    summary: マージ状況の確認、帯の読み方、マージ済みの親の片付け
    steps:
      - target: merge-check
        title: マージ状況を確認
        body: 押すと、片付けの記録（親を終えたあとに残る記録）を持つ親を集め、親ごとにマージリクエストの状況を聞きます。押している間は「確認中…」で押せません。読むだけで、何も変えません。
      - target: merge-band
        title: 帯の読み方
        body: 親ごとに 1 行です。「マージ待ち」（Draft なら付記）・「マージ済み」・「マージせず閉じた」・「確認できない」のどれかが出ます。一部の親が確認できなくても、ほかの親は出ます。確認した時刻は帯の下に出ます。結果は、ボードを開いている間だけ残ります。
        scene: { merge: true }
      - target: merge-retire
        title: 片付ける
        body: マージ済みの親の［片付ける］は、確認のダイアログのあと、ボードのターミナルに ccnavi-sync.sh のコマンドを送ります。sync はリモートの取り込みも行い、MR がマージ済みかを確かめ直したうえで、条件を満たすものだけを片付けます。送ったのは「実行の成功」ではないので、結果はターミナルで確認してください。送ったあとは、次に確認するまで押せません。
        scene: { merge: true }
      - target: merge-abandon
        title: マージせずに閉じた親
        body: 自動では片付けません。捨てた親なら、ユーザが端末でコマンドを実行して記録を消します。ボードはコマンドをコピーするボタンだけを出し、送りません。
        scene: { merge: true }

  - id: attention
    title: 自分が対応する必要があるカードだけ見たいとき
    summary: 注意の行の意味と、「要対応のみ」での絞り込み
    steps:
      - target: summary
        title: 件数で当たりを付ける
        body: 「承認待ち」や「不備」の件数が出ているときは、ユーザの対応が要ります。数は絞り込みに関係なく、ボード全体のものです。
      - target: filter-attention
        title: 要対応のみ
        body: 入れると、ユーザが対応する必要があるカードだけが残ります。対象は、承認待ち・レビュー準備中／レビュー待ち・ワークツリーなし・HIGH 以上のリスク・不備です。判定は実行ファイルがしていて、ボードは組み直しません。
        scene: { attention: true }
      - target: badge-risk
        title: HIGH 以上のリスク
        body: 変更の実績から測ったリスクが HIGH 以上のカードは、注意の行に出ます。MEDIUM 以下は詳細に畳んであります。
        scene: { attention: true }
      - target: badge-blocked
        title: 書き込み停止中
        body: 親が引けないなど、編集できる範囲を決められないチケットに出ます。札は「要確認」になり、理由の全文は詳細に出ます。
        scene: { attention: true }
      - target: badge-issue
        title: 不備
        body: 不備は、読み手が気づくべき食い違いを実行ファイルが文にしたものです。注意の行には件数だけを出し、文は詳細にそのまま出ます。直し方も文に記載されています。
        scene: { attention: true, details: sample-e }
      - target: badge-preds
        title: 先行待ち
        body: 先行のチケットがまだ終わっていないカードには「先行待ち」が付き、承認・着手はできません。先行が終われば進むので、「要対応のみ」には残りません。
        scene: {}

  - id: progress
    title: 親チケットの進み具合を確認したいとき
    summary: フェーズ行の読み方、動いた表示、列の畳み方
    steps:
      - target: card-sample-b
        title: 親のカード
        body: 親カードは、いまのステージとフェーズ一覧を持ちます。子のカードには「親 … / フェーズ名」と出て、親のフェーズに属します。
      - target: phases
        title: フェーズ一覧
        body: 1 行が 1 フェーズです。左の丸が進み具合で、右に状態が一言で出ます（レビュー待ち・レビュー準備中・レビュー済み・レビュー予定・レビュー省略・終了・進行中・これから・要確認）。手で動かした子の確認待ちなどは、行の下に 1 行で出ます。
      - target: moved
        title: 動いた表示
        body: 更新したとき、前回から列が変わったカードに「未着手 → 作業中」のような帯が付きます。次にどれかのカードの列が変わるまで残ります。
      - target: details
        title: 詳細で見る
        body: フェーズごとのレビューの要否とリスク（実績から測った値）、ブランチ、MR、リモートとの差は詳細にあります。
        scene: { details: sample-b }
      - target: column-done
        title: 列を畳む
        body: 見出しを押すと列を畳めます。右端をドラッグすると幅を変えられ、ダブルクリックで元に戻ります。畳んだ列と幅は、画面を開き直しても残ります。
        scene: { fold: done }
      - target: refresh
        title: 更新
        body: チケットとワークツリーの状態を再読み込みします。承認やチケットの終了のあとは、ひとりでに再読み込みされます。

  - id: filter
    title: プロジェクトや親を絞って見たいとき
    summary: プロジェクトと親チケットでの絞り込みと、承認の対象への影響
    steps:
      - target: filter-project
        title: プロジェクトで絞る
        body: プロジェクトを選ぶと、そのプロジェクトのカードだけが残ります。「ワークスペース（プロジェクト外）」も選べます。プロジェクトが 1 つもないボードでは欄が出ません。
        scene: { project: web }
      - target: filter-parent
        title: 親で絞る
        body: 親チケットを選ぶと、その親と子のカードだけが残ります。
        scene: { parent: sample-b }
      - target: summary
        title: 集計は変わらない
        body: 上の集計は、絞り込んでもボード全体の数のままです。絞り込みで変わるのは、カードと、列の見出しの件数です。
        scene: { project: web }
      - target: approve
        title: 承認の対象も絞られる
        body: 承認のボタンの対象は、見えている承認待ちだけです。ここではプロジェクトを絞ったので、承認待ちが 1 件になりました。絞り込みは、画面を開き直しても覚えています。
        scene: { project: web }

  - id: closed
    title: 終わったチケットや取り消したチケットを振り返りたいとき
    summary: 完了・取り消し・アーカイブの列の見方
    steps:
      - target: column-done
        title: 完了
        body: 終わったチケットが並び、札は「完了」です（早めに終えた親は「完了（早めに終了）」）。フェーズのレビューが済むまでは、完了ではなくレビュー待ちの札が付くことがあります。
      - target: card-sample-f
        title: 取り消し
        body: 取り消したチケットは、完了と同じ置き場に残り、取り消しの列に並びます。札は「取り消し」で、理由は詳細に出ます。
      - target: filter-archived
        title: アーカイブを表示する
        body: 入れると、右端に「アーカイブ」の列が追加されます。親のレビューが済んで Draft を解除したときに、ローカルの logs/archive/ に移動した、完了・取り消しのチケットです。初期状態では表示せず、集計にも数えません。
        scene: { archived: true }
      - target: column-archived
        title: アーカイブの列
        body: 退避したチケットは表示するだけで、承認などの操作は出ません。押すと退避したファイルを開きます。
        scene: { archived: true }

  - id: flow
    title: 子チケットの手順や計画の順序を見直したいとき
    summary: フローを開くボタンと計画編集を開くボタンの見分け方
    steps:
      - target: flow-create
        title: フローを作る
        body: "子カードの「フロー: 作成」から、その子の作業の手順（フロー）を図で作る画面を開きます。着手する前なら、いつでも作れます。"
      - target: flow-locked
        title: 着手中のフロー
        body: "着手すると、終わるまでフローは変更できません。ボタンは「フロー: 閲覧（着手中）」になり、読むだけの画面が開きます。レビュー中も同じです。"
      - target: workflow-button
        title: 計画の順序を直す
        body: 計画を持つ承認待ちの親には「計画編集」が出ます。計画の項どうしの順序（どの項がどの項を待つか）を図で直すタブを開きます。保存すると提案内容が変更されるため、承認画面を開き直してください。
      - target: edit-workflow
        title: 承認の画面から直す
        body: 承認の一覧にも、親ごとに「計画を編集」があります。押すとオーバーレイを閉じて、編集タブを開きます。
        scene: { overlay: approval }
