# ボード画面の案内。`sample:` は案内の間だけ画面に出す見本（実際のチケットではない）。
# 見本は `ccnavi --explain --json` と同じ形で書く（足りない欄は読み取りが既定値で埋め、`buildBoard` を通す）。
# 承認・残った指摘・渡す文のオーバーレイは `overlays:` に書く。描くだけで、拡張ホストへは何も送らない。
#
# `scene:` は手順ごとの画面の様子。手順ごとに全部を書く（前の手順を引き継がない）。鍵は次の 5 つ。
#   overlay    出すオーバーレイ。approval（承認の一覧）/ done（承認のあとに渡す文）/ decide（残った指摘の行き先）/
#              reviewed（レビュー済みの連絡の文）。書かなければ出さない
#   project    プロジェクトの絞り込み（見本の projects にある名前。空文字はワークスペース。書かなければ「すべて」）
#   parent     親の絞り込み（見本の親の識別子。書かなければ「すべて」）
#   attention  「要対応のみ」を入れる
#   archived   「アーカイブ済みチケットを表示」を入れる
#   fold       畳む列（todo / doing / done / cancelled / archived を , で区切る）
# 絞り込みと畳みは見本の上だけに効く。実際の絞り込み・列の畳み・幅には触れない。
#
# `target:` は `data-tour="…"` の印。使うものは次のとおり。
#   ヘッダ     summary / filter-project / filter-parent / filter-attention / filter-archived / refresh / approve / tour
#   ボード     board / column-<列> / card-<識別子>
#   カード内   badge-<種類>（copy hold blocked preds worktree risk seen）/ approve-one / review-menu / mr / phases /
#              issues / moved / flow-<状態>（create edit locked）/ workflow-button
#   承認の画面 approval-batch / approval-plan / approve-confirm / approval-prompt / approval-handover / edit-workflow /
#              decide-threads / decide-confirm
screen: board

sample:
  board:
    projects: [web]
    pending_approval: [sample-a, sample-a-01-01]
    tickets:
      # 承認待ちの親（計画あり）と、その子。「承認」「計画編集」「フロー: 作成」を見せる
      - ticket: sample-a
        title: "（見本）ログイン画面にパスワードの再設定を追加する"
        proposal: { state: todo, has_plan: true }
        copy: { status: none }
        worktree: { exists: true, path: /ws/.claude/worktrees/sample-a }
        human_review: { required: true, reason: 認証まわりの変更のため }
        attention: true
      - ticket: sample-a-01-01
        parent: sample-a
        phase: 1
        title: "（見本）再設定メールの文面を決める"
        proposal: { state: todo, has_plan: false }
        copy: { status: none }
        worktree: { exists: true, path: /ws/.claude/worktrees/sample-a }
        flow: { path: /ws/.claude/worktrees/sample-a/.ccnavi/approved/flows/sample-a-01-01.yml, rel: .ccnavi/approved/flows/sample-a-01-01.yml, tree: /ws/.claude/worktrees/sample-a, exists: false, linked: false, locked: false }
        attention: true
      # 作業中の親。フェーズが進み、子が作業中・完了・先行待ち
      - ticket: sample-b
        title: "（見本）検索の応答を速くする"
        project: web
        copy: { status: open, approved_at: "2026-09-26T09:00:00+0900" }
        worktree: { exists: true, path: /ws/.claude/worktrees/sample-b }
        started_at: "2026-09-26T09:30:00+0900"
        human_review: { required: true, reason: 設計のレビューが必要 }
      - ticket: sample-b-01-01
        parent: sample-b
        phase: 1
        title: "（見本）遅いクエリを調べる"
        project: web
        copy: { status: closed, approved_at: "2026-09-26T09:00:00+0900" }
        worktree: { exists: true, path: /ws/.claude/worktrees/sample-b-01-01 }
        completed_at: "2026-09-27T18:00:00+0900"
        risk: { points: 0, level: LOW }
        flow: { path: /ws/.claude/worktrees/sample-b/.ccnavi/approved/flows/sample-b-01-01.yml, rel: .ccnavi/approved/flows/sample-b-01-01.yml, tree: /ws/.claude/worktrees/sample-b, exists: true, linked: false, locked: false }
      - ticket: sample-b-02-01
        parent: sample-b
        phase: 2
        title: "（見本）索引の張り方を決める"
        project: web
        copy: { status: open, approved_at: "2026-09-28T09:00:00+0900" }
        worktree: { exists: true, path: /ws/.claude/worktrees/sample-b-02-01 }
        started_at: "2026-09-28T10:00:00+0900"
        in_progress: true
        flow: { path: /ws/.claude/worktrees/sample-b/.ccnavi/approved/flows/sample-b-02-01.yml, rel: .ccnavi/approved/flows/sample-b-02-01.yml, tree: /ws/.claude/worktrees/sample-b, exists: false, linked: false, locked: true, lock_kind: doing }
      - ticket: sample-b-03-01
        parent: sample-b
        phase: 3
        title: "（見本）索引を本番へ反映する手順を書く"
        project: web
        proposal: { state: todo, has_plan: false }
        copy: { status: none }
        worktree: { exists: true, path: /ws/.claude/worktrees/sample-b }
        predecessors: [sample-b-02-01]
        predecessors_unmet:
          - { ticket: sample-b-02-01, state: doing, label: 作業中（doing/） }
        flow: { path: /ws/.claude/worktrees/sample-b/.ccnavi/approved/flows/sample-b-03-01.yml, rel: .ccnavi/approved/flows/sample-b-03-01.yml, tree: /ws/.claude/worktrees/sample-b, exists: false, linked: false, locked: false }
      # レビュー待ちのフェーズを持つ親。HIGH のリスクとマージリクエストを見せる
      - ticket: sample-c
        title: "（見本）ログの出力を整理する"
        project: web
        copy: { status: open, approved_at: "2026-09-20T09:00:00+0900" }
        worktree: { exists: true, path: /ws/.claude/worktrees/sample-c }
        started_at: "2026-09-20T09:30:00+0900"
        human_review: { required: true, reason: ログの書式は利用者に見える }
        attention: true
      - ticket: sample-c-01-01
        parent: sample-c
        phase: 1
        title: "（見本）ログのレベルを統一する"
        project: web
        copy: { status: closed, approved_at: "2026-09-20T09:00:00+0900" }
        worktree: { exists: true, path: /ws/.claude/worktrees/sample-c-01-01 }
        completed_at: "2026-09-24T18:00:00+0900"
        risk: { points: 60, level: HIGH }
        flow: { path: /ws/.claude/worktrees/sample-c/.ccnavi/approved/flows/sample-c-01-01.yml, rel: .ccnavi/approved/flows/sample-c-01-01.yml, tree: /ws/.claude/worktrees/sample-c, exists: true, linked: false, locked: false }
        attention: true
      # 不備のある親。承認済みなのにワークツリーが無い
      - ticket: sample-e
        title: "（見本）通知の設定画面を直す"
        copy: { status: open, approved_at: "2026-09-22T09:00:00+0900" }
        worktree: { exists: false, path: /ws/.claude/worktrees/sample-e }
        started_at: "2026-09-22T09:30:00+0900"
        issues:
          - "承認済みですが、ワークツリー /ws/.claude/worktrees/sample-e がありません。作り直すか、チケットを取り消してください"
        attention: true
      # 取り消した親
      - ticket: sample-f
        title: "（見本）旧ダッシュボードを移行する"
        copy: { status: closed, approved_at: "2026-09-10T09:00:00+0900" }
        worktree: { exists: false, path: /ws/.claude/worktrees/sample-f }
        cancelled_at: "2026-09-12T10:00:00+0900"
        cancel_reason: 要件が変わり、移行が不要になった
    parents:
      - ticket: sample-b
        stage: 作業中（2（設計））
        plan: [research, { type: design, after: [1] }, { type: implement, after: [2] }]
        phases:
          - { number: 1, type: research, title: 調査, label: 1（調査）, state: ended, tickets: [sample-b-01-01], states: { sample-b-01-01: done }, risk: { points: 0, level: LOW }, risk_line: "リスク: 0 (LOW)" }
          - { number: 2, type: design, title: 設計, label: 2（設計）, state: active, tickets: [sample-b-02-01], states: { sample-b-02-01: doing }, review_required: true }
          - { number: 3, type: implement, title: 実装とテスト, label: 3（実装とテスト）, state: planned, tickets: [sample-b-03-01], states: { sample-b-03-01: todo } }
      - ticket: sample-c
        stage: レビュー待ち（1（実装））
        plan: [implement]
        phases:
          - number: 1
            type: implement
            title: 実装とテスト
            label: 1（実装とテスト）
            state: ended
            tickets: [sample-c-01-01]
            states: { sample-c-01-01: done }
            marks:
              pending: {}
              requested: { head: "0123abc", mr: 12, url: "https://example.com/sample/pulls/12#note-1", host: example, since: "2026-09-24T09:30:00Z" }
            review_required: true
            gate_closed: true
            review_waiting: true
            risk: { points: 60, level: HIGH }
            risk_line: "リスク: 60 (HIGH)"
    # 手元の退避（アーカイブの列）
    archived:
      - ticket: sample-g
        title: "（見本）古い設定ファイルを整理する"
        path: /ws/logs/archive/sample/done/sample-g.md
        completed_at: "2026-08-05T18:00:00+0900"
  # 前の更新から列が変わったカード（動いた表示）
  moved:
    - { id: sample-b-02-01, from: todo, to: doing }
  overlays:
    # 承認の一覧（`--agree --preview --json` と同じ形）
    approval:
      root: /ws
      batch:
        - { ticket: sample-a, title: "（見本）ログイン画面にパスワードの再設定を追加する", parent: null, phase: null, revision: false, tree: sample-a, path: /ws/.claude/worktrees/sample-a/wip/proposals/todo/sample-a.md, branch: sample-a }
        - { ticket: sample-a-01-01, title: "（見本）再設定メールの文面を決める", parent: sample-a, phase: 1, revision: false, tree: sample-a, path: /ws/.claude/worktrees/sample-a/wip/proposals/todo/sample-a-01-01.md, branch: sample-a-01-01 }
      text: |
        チケットの承認リクエスト: 2 件

        == sample-a: （見本）ログイン画面にパスワードの再設定を追加する  親チケット
        ■ このチケットで編集可能な範囲
            このチケットでは、以下に示す場所のみ編集できるようになります。allow は確認なしで編集できる場所、ask は実行時に確認が必要な場所、deny はこのチケットでも編集できない場所
            allow: src/*, wip/*, tests/*
        ■ 全体計画
            承認すると、この順序で進めることに合意したことになる。先行フェーズの終了と必要なレビューの完了を確認するまで、このフェーズの子チケットは承認できません。
            1. 調査 / research  レビュー不要
            2. 設計 / design  レビュー必須: マージリクエスト
            3. 実装とテスト / implement  レビュー必須: マージリクエスト
        ■ エージェントが記載した理由
            利用者が自分でパスワードを再設定できるようにする

        == sample-a-01-01: （見本）再設定メールの文面を決める  親 sample-a / フェーズ 1: 調査
        ■ 人間レビュー: 不要
            理由: 調査だけで、コードは変わらない
      digest: sample
      plans:
        - ticket: sample-a
          part: plan
          source_sha: sample
          items:
            - { number: 1, type: research, title: 調査, review: none }
            - { number: 2, type: design, title: 設計, review: mr }
            - { number: 3, type: implement, title: 実装とテスト, review: mr }
          after: { "2": [1], "3": [2] }
          proposed: { "2": [1], "3": [2] }
          ready: [1]
    # 承認できたあとに Claude Code へ渡す文
    done:
      count: 2
      carried: true
      prompt: |
        sample-a と sample-a-01-01 を承認しました。
        承認済みチケットを確認し、フェーズ 1 の子チケットから着手してください。
    # 残った指摘の行き先（`ccnavi-review.sh decide <N> --preview` と同じ形）
    decide:
      tree: /ws/.claude/worktrees/sample-c
      parent: sample-c
      phase: 1
      mr: { number: 12, url: "https://example.com/sample/pulls/12" }
      can_issue: false
      digest: "v2.eyJiIjoiYSIsInQiOnt9fQ"
      threads:
        - { key: thread-1, url: "https://example.com/sample/pulls/12#discussion_r1", path: src/log.ts, line: 42, body: "レベルの名前を定数にまとめてほしい\n同じ文字列が 3 か所にある" }
        - { key: thread-2, url: "https://example.com/sample/pulls/12#discussion_r2", path: src/format.ts, line: 10, body: "この分岐を通るテストがありません" }
    # レビュー済みの連絡（Claude Code に渡す文）
    reviewed:
      title: フェーズ 1 のレビュー済みの連絡
      note: Claude Code に伝える文を用意しました。コピーして進行中のセッションに貼るか、新しいセッションで開いてください。
      what: レビュー済みの連絡の文
      prompt: |
        sample-c のフェーズ 1 のレビューが終わりました。
        未解決の指摘がないことを確認し、ccnavi-review.sh confirm --phase 1 を実行してください。

courses:
  - id: intro
    title: 基本の案内
    summary: 画面の見どころを順に回ります
    steps:
      - target: summary
        title: 集計
        body: 承認待ちと不備の件数、残りのチケット数です。絞り込みに関係なく、チケット管理画面全体の数を表示します。
      - target: filter-attention
        title: 絞り込み
        body: プロジェクトと親チケットで絞り込めます（プロジェクトや親があるときだけ欄が出ます）。「要対応のみ」は、承認待ち・レビュー待ち・ワークツリーなし・HIGH 以上のリスク・不備など、ユーザが対応する必要があるカードだけを表示します。
      - target: board
        title: 列
        body: チケットは「未着手 → 作業中 → 完了（または取り消し）」の順に列を移ります。見出しを押すと列を畳み、右端をドラッグすると幅を変えられます（ダブルクリックで元に戻ります）。
      - target: card-sample-c
        title: カード
        body: 1 枚が 1 チケットです。カードには、親か子か、フェーズの進み具合、ユーザが対応する必要がある状態を示すバッジが出ます。押すとチケットのファイルを開きます。承認とレビューの対応のボタンは、要るときだけカードに出ます。レビューの対応のボタンを押すと、「対応方針を決める」と「レビュー済み連絡」のメニューが開きます。ボタンはどれも承認と同じ大きさです。
      - target: approve
        title: 承認
        body: 絞り込みで見えている承認待ちをまとめて承認します。押すと承認する内容がオーバーレイに出るので、確認してから承認してください。承認のあと、Claude Code に伝える文を渡せます。
      - target: refresh
        title: 更新
        body: チケットとワークツリーの状態を更新します。前回の更新から列が変わったカードには動いた表示が付きます。
      - target: tour
        title: 案内
        body: この案内は、ヘッダ右上の ? からもう一度見られます。? を押すと、使い方ごとの案内（承認・レビュー・絞り込みなど）の一覧が開きます。

  - id: approve
    title: 承認待ちのチケットを承認したいとき
    summary: 承認待ちの見つけ方、1 件ずつ・まとめての承認、承認のあとの渡し方
    steps:
      - target: summary
        title: 承認待ちの件数
        body: ヘッダの「承認待ち N 件」は、承認が済んでいないチケットの数です。絞り込みに関係なく、ボード全体の数で、0 件なら出ません。
      - target: card-sample-a
        title: 承認待ちのカード
        body: 承認待ちのカードは「未着手」の列に並び、「未承認」のバッジが付きます。枠付きのバッジは、ユーザが対応する必要がある状態です。カードを押すと提案のファイルを開きます。
      - target: approve-one
        title: 1 件だけ承認する
        body: カードの「この 1 件を承認」は、そのチケットだけを承認の対象にします。同じ親の承認待ちがほかにあっても巻き込みません。押すと内容がオーバーレイに出るだけで、まだ承認はされません。
      - target: approve
        title: まとめて承認する
        body: ヘッダの「承認待ち N 件を承認」は、絞り込みで見えている承認待ちをまとめて対象にします。絞り込み中は、見えていない承認待ちは入りません。件数はボタンに出ます。
      - target: approval-batch
        title: 承認の対象を確認する
        body: 承認する提案を表で確認します。本文には、編集できる範囲・人間レビューの要否・エージェントが記載した理由が並びます。「承認する」を押すまで何も変わらず、「キャンセル」か Esc で閉じます。
        scene: { overlay: approval }
      - target: approval-plan
        title: 計画の順序を見る
        body: 計画を持つ親には、全体計画の図が出ます。線は「どの項がどの項を待つか」で、承認すると、この順序で進めることに合意したことになります。
        scene: { overlay: approval }
      - target: approve-confirm
        title: 承認する
        body: 「この N 件を承認する」で承認します。計画編集タブに未保存の変更がある親が一覧にあると、押せなくなって理由が出ます。
        scene: { overlay: approval }
      - target: approval-handover
        title: 承認のあと
        body: 承認できたら、Claude Code に伝える文が出ます。コピーして進行中のセッションに貼るか、新しいセッションで開いて渡します。
        scene: { overlay: done }

  - id: review
    title: レビュー待ちのフェーズに対応したいとき
    summary: 止まっているフェーズの見つけ方、指摘の対応方針の決め方、レビュー済みの連絡
    steps:
      - target: card-sample-c
        title: 止まっている親を見つける
        body: 親カードのフェーズ一覧で、「レビュー待ち」と「レビュー依頼済み」が付いたフェーズが、ユーザのレビューを待っています。依頼の前は「レビュー準備中」で、エージェントの番です。
      - target: badge-hold
        title: 子のバッジ
        body: そのフェーズの子のカードにも「レビュー待ち」のバッジが付きます。バッジは、ユーザが対応する必要がある状態だけに付きます。
      - target: mr
        title: マージリクエストを開く
        body: 「マージリクエスト」のリンクから、レビューの場を開きます。指摘はそこにコメントで記述します。ボードはマージリクエストの中身を読みません。
      - target: review-menu
        title: レビューの対応
        body: フェーズ行の「レビューの対応」を押すと、「対応方針を決める」と「レビュー済み連絡」のメニューが開きます。押しただけでは何も実行されません。
      - target: decide-threads
        title: 残った指摘の対応方針を選ぶ
        body: 未解決（Unresolved）の指摘を 1 件ずつ並べ、対応方針を選びます。「対応しない」は受け入れて進み、「このフェーズで直す」は追加対応用の子チケットを作成し、このフェーズを再開します。「issue に回す」は、フィードバック計画の承認後に選べます。
        scene: { overlay: decide }
      - target: decide-confirm
        title: 方針を決める
        body: 全部の指摘に対応方針を選ぶまで、「この対応方針を確定」は押せません。押すと選んだ内容が置かれ、取り返せません。指摘が 0 件なら、このフェーズをレビュー済みにするだけです。
        scene: { overlay: decide }
      - target: approval-prompt
        title: レビュー済みの連絡
        body: レビューを終えたことを Claude Code に伝える文を作ります。ボードは記録を置かず、文を受けたエージェントが確認の sh を実行してレビュー済みにします。コピーするか、新しいセッションで開いて渡します。
        scene: { overlay: reviewed }

  - id: attention
    title: 自分が対応する必要があるカードだけ見たいとき
    summary: 要対応のバッジの意味と、「要対応のみ」での絞り込み
    steps:
      - target: summary
        title: 件数で当たりを付ける
        body: 「承認待ち」や「不備」の件数が出ているときは、ユーザの対応が要ります。数は絞り込みに関係なく、ボード全体のものです。
      - target: filter-attention
        title: 要対応のみ
        body: 入れると、ユーザが対応する必要があるカードだけが残ります。対象は、承認待ち・レビュー準備中／レビュー待ち・ワークツリーなし・HIGH 以上のリスク・不備です。判定は実行ファイルがしていて、ボードは組み直しません。
        scene: { attention: true }
      - target: badge-risk
        title: HIGH 以上のリスク
        body: 変更の実績から測ったリスクが HIGH 以上のカードは、枠付きのバッジで出ます。MEDIUM 以下は、枠のない薄い文字の行に出ます。
        scene: { attention: true }
      - target: badge-worktree
        title: ワークツリーなし
        body: 承認済みなのにワークツリーがないカードに出ます。作業する場所がないので、エージェントは保存できません。
        scene: { attention: true }
      - target: issues
        title: 不備
        body: 不備は、読み手が気づくべき食い違いを実行ファイルが文にしたものです。ボードはそのまま出し、直し方も文に記載されています。
        scene: { attention: true }
      - target: badge-preds
        title: 先行待ち
        body: 先行のチケットがまだ終わっていないカードには「先行待ち」が付き、承認・着手はできません。先行が終われば進むので、「要対応のみ」には残りません。
        scene: {}

  - id: progress
    title: 親チケットの進み具合を確認したいとき
    summary: フェーズ一覧の読み方、動いた表示、列の畳み方
    steps:
      - target: card-sample-b
        title: 親のカード
        body: 親カードは、いまのステージとフェーズ一覧を持ちます。子のカードには「子 · 親 … / フェーズ N」と出て、親のフェーズに属します。
      - target: phases
        title: フェーズ一覧
        body: 1 行が 1 フェーズです。左の丸が進み具合（未着手・進行中・終了）で、右に状態・レビューの要否・リスクが全文で出ます。終わったフェーズのリスクは、変更の実績から測った値です。
      - target: moved
        title: 動いた表示
        body: 更新したとき、前回から列が変わったカードに「未着手 → 作業中」のような帯が付きます。次にどれかのカードの列が変わるまで残ります。
      - target: column-done
        title: 列を畳む
        body: 見出しを押すと列を畳めます。右端をドラッグすると幅を変えられ、ダブルクリックで元に戻ります。畳んだ列と幅は、画面を開き直しても残ります。
        scene: { fold: done }
      - target: refresh
        title: 更新
        body: チケットとワークツリーの状態を再読み込みします。承認やチケットの終了のあとは、ひとりでに再読み込みされます。

  - id: filter
    title: プロジェクトや親を絞って見たいとき
    summary: プロジェクトと親チケットでの絞り込みと、承認の対象への影響
    steps:
      - target: filter-project
        title: プロジェクトで絞る
        body: プロジェクトを選ぶと、そのプロジェクトのカードだけが残ります。「ワークスペース（プロジェクト外）」も選べます。プロジェクトが 1 つもないボードでは欄が出ません。
        scene: { project: web }
      - target: filter-parent
        title: 親で絞る
        body: 親チケットを選ぶと、その親と子のカードだけが残ります。
        scene: { parent: sample-b }
      - target: summary
        title: 集計は変わらない
        body: 上の集計は、絞り込んでもボード全体の数のままです。絞り込みで変わるのは、カードと、列の見出しの件数です。
        scene: { project: web }
      - target: approve
        title: 承認の対象も絞られる
        body: 承認のボタンの対象は、見えている承認待ちだけです。ここではプロジェクトを絞ったので、承認待ちが 0 件になりました。絞り込みは、画面を開き直しても覚えています。
        scene: { project: web }

  - id: closed
    title: 終わったチケットや取り消したチケットを振り返りたいとき
    summary: 完了・取り消し・アーカイブの列の見方
    steps:
      - target: column-done
        title: 完了
        body: 終わったチケットが並びます。フェーズのレビューが済むまでは、完了のカードにも「レビュー待ち」が付くことがあります。
      - target: card-sample-f
        title: 取り消し
        body: 取り消したチケットは、完了と同じ置き場に残り、取り消しの列に並びます。理由はカードに出ます。
      - target: filter-archived
        title: アーカイブを表示する
        body: 入れると、右端に「アーカイブ」の列が追加されます。親のレビューが済んで Draft を解除したときに、ローカルの logs/archive/ に移動した、クローズ済みのチケットです。初期状態では表示せず、集計にも数えません。
        scene: { archived: true }
      - target: column-archived
        title: アーカイブの列
        body: 退避したチケットは表示するだけで、承認などの操作は出ません。押すと退避したファイルを開きます。
        scene: { archived: true }

  - id: flow
    title: 子チケットの手順や計画の順序を見直したいとき
    summary: フローを開くボタンと計画編集を開くボタンの見分け方
    steps:
      - target: flow-create
        title: フローを作る
        body: "子カードの「フロー: 作成」から、その子の作業の手順（フロー）を図で作る画面を開きます。着手する前なら、いつでも作れます。"
      - target: flow-locked
        title: 着手中のフロー
        body: "着手すると、終わるまでフローは変更できません。ボタンは「フロー: 閲覧（着手中）」になり、読むだけの画面が開きます。レビュー中も同じです。"
      - target: workflow-button
        title: 計画の順序を直す
        body: 計画を持つ承認待ちの親には「計画編集」が出ます。計画の項どうしの順序（どの項がどの項を待つか）を図で直すタブを開きます。保存すると提案内容が変更されるため、承認画面を開き直してください。
      - target: edit-workflow
        title: 承認の画面から直す
        body: 承認の一覧にも、親ごとに「計画を編集」があります。押すとオーバーレイを閉じて、編集タブを開きます。
        scene: { overlay: approval }
