# ボード画面の案内。`sample:` は案内の間だけ画面に出す見本（実際のチケットではない）。
# 見本は `ccnavi --explain --json` と同じ形で書く（足りない欄は読み取りが既定値で埋め、`buildBoard` を通す）。
# 承認・残った指摘・渡す文のオーバーレイは `overlays:` に書く。描くだけで、拡張ホストへは何も送らない。
#
# `scene:` は手順ごとの画面の様子。手順ごとに全部を書く（前の手順を引き継がない）。鍵は次の 7 つ。
#   overlay    出すオーバーレイ。approval（承認の一覧）/ done（承認のあとに渡すプロンプト）/ decide（残った指摘の対応方針）。
#              書かなければ出さない
#   project    プロジェクトの絞り込み（見本の projects にある名前。空文字はワークスペース。書かなければ「すべて」）
#   parent     親の絞り込み（見本の親の識別子。書かなければ「すべて」）
#   attention  「要対応のみ」を入れる
#   archived   「アーカイブ済みチケットを表示」を入れる
#   fold       畳む列（todo / doing / done / cancelled / archived を , で区切る）
#   details    詳細を開いて見せるカードの識別子（, で区切る）
#   merge      マージ状況の帯（見本の merge）を出す
# 絞り込み・畳み・詳細の開閉は見本の上だけに効く。実際の絞り込み・列の畳み・幅・詳細の開閉には触れない。
#
# `target:` は `data-tour="…"` の印。使うものは次のとおり。
#   ヘッダ     summary / filter-project / filter-parent / filter-attention / filter-archived / refresh / merge-check / approve / tour
#   ボード     board / column-<列> / card-<識別子> / merge-band / merge-retire / merge-abandon
#   カード内   status（状態の札）/ turn（あなたの番）/ approve-one / review-done / mr / notes / badge-<種類>（blocked preds worktree
#              risk seen issue unsent）/ phases / phase-review / details / moved / flow-<状態>（create edit locked）/ workflow-button
#   承認の画面 approval-batch / approval-plan / approve-confirm / approval-prompt / approval-handover / edit-workflow /
#              decide-threads / decide-consult / decide-confirm
#
# 手順の `image:` と `alt:` は、画面の外（Claude Code・GitLab）の見た目を見せる画像で、2 つとも書く。名前は `tours/images/<名前>.png` と
# `tours/images.ts` の表にある。画像の手順は読み込みで高さが変わるので、`target:` は空にして中ほどに出す。
screen: board

