# テンプレート管理画面の案内。見本は使わず、いまの画面をそのまま指す。
# 案内の間も、更新・対象の切り替えなどの操作は実際には送らない。
# `target:` の印（画面の data-tour）:
#   summary   ヘッダの件数（テンプレート・下書き・error / warn / info）
#   target    対象の切り替え（共通の設定・ワークスペース・プロジェクト）
#   view      「足し算」と「層ごと」の切り替え
#   refresh   「更新」
#   list      テンプレートの一覧
#   template  一覧の最初の 1 件（開くと計画・フロー・本文が出る）
#   drafts    下書きの一覧
#   draft     下書きの最初の 1 件
#   draft-import  取り込める最初の 1 件の「取り込む…」（取り込める下書きが無ければ無い）
#   tour      「?」
screen: templates

courses:
  - id: intro
    title: 基本の案内
    summary: 画面の見方。テンプレートの一覧と下書き
    steps:
      - target: summary
        title: 件数と検査の結果
        body: テンプレートと下書きの数、そして検査の error・warn・info の数が出ます。error があるテンプレートは使えません。
      - target: target
        title: 対象を切り替える
        body: 共通の設定・ワークスペース・プロジェクトを切り替えて、どの設定のテンプレートを見るかを選びます。
      - target: view
        title: 足し算と層ごと
        body: 足し算は、共通と選んだ層を合わせて実際に使われる結果です。層ごとは、それぞれの層の生の中身を並べます。
      - target: list
        title: テンプレートの一覧
        body: 各テンプレートに、使える・使われない・捨てた理由の札が出ます。捨てた理由は、同じ中身があるか、読めないかなどです。
      - target: template
        title: 1 件を開く
        body: 見出しを押すと、計画の項・フロー・検査の指摘が見えます。本文を見るボタンで本文も読めます。本文では、見えない文字を \uXXXX の形で出します。
      - target: drafts
        title: 下書き
        body: エージェントが書いた下書きです。効力は無く、取り込むまでテンプレートとしては使われません。
      - target: refresh
        title: 更新
        body: 一覧を読み直します。ファイルを外で書き換えたあとに押します。
      - target: tour
        title: 案内
        body: ヘッダ右上の ? を押すと、基本の案内と、使い方ごとの案内を選べます。

  - id: read-drafts
    title: 下書きを読むとき
    summary: 下書きの検査と、取り込めるかを見る
    steps:
      - target: drafts
        title: 下書きとは
        body: 親チケットの中で書かれた、まだ効力の無いテンプレートです。ここで中身を読んでから取り込みます。
      - target: draft
        title: 取り込めるか
        body: 取り込めるは、読めて error が無いことです。同名ありは、取り込むと同じ名前のテンプレートを置き換えます。TODO が残っているものは、直してから取り込みます。
      - target: refresh
        title: 読み直す
        body: 下書きを直したあとは、更新を押して読み直します。

  - id: import
    title: 下書きを取り込むとき
    summary: 取り込み先を選び、下見で差分を読んでから取り込む
    steps:
      - target: draft
        title: 下書きを選ぶ
        body: 取り込む下書きの見出しを押すと、中身と問題が見えます。
      - target: draft-import
        title: 取り込む
        body: 取り込める下書きがあるときは、「取り込む…」で取り込みの欄が開きます。取り込み先と置き換えを選んで「下見」を押し、差分を読んでから「この内容で取り込む」を押すと書かれます（見せた下書きが途中で書き換わっていたら書かれません）。
      - target: refresh
        title: 読み直す
        body: 下書きを直したあとや、外で書き換えたあとは、更新を押して読み直します。
