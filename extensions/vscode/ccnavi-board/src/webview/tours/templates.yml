# テンプレート管理画面の案内。`sample:` は案内の間だけ画面に出す見本（実際のテンプレートではない）。
#   path       見本の層の置き場（画面には「（見本）」を付けて出す）
#   templates  見本の層（self）のテンプレート。name・description・when・plan・feedback・flows・problems・dropped（捨てた理由。あれば「使われない」）・text（本文）
#   drafts     見本の下書き。name・description・problems・plan・feedback・flows
#   sums       「統合結果」の見本。実行ファイルが出す索引の形（共通の設定 + 1 つの設定の和）
# `scene:` は手順ごとの画面の様子。手順ごとに全部を書く（前の手順を引き継がない）。
#   open     開くテンプレートの名前（, で区切って複数）
#   body     true なら、開いたテンプレートに見本の本文を出す
#   draft    開く下書きの名前（, で区切って複数）
#   sum      「統合結果」の枠を開き、選ぶ統合結果の名前（sample.sums の name）
# `diagrams:` は手順が引く時系列の図（形と `diagram:` / `focus:` の使い方は core/tour-def.ts の冒頭）。値は見本（sample）の名前・説明・パスと揃える。
# `target:` の印（画面の data-tour）:
#   summary         件数の行（テンプレート・下書き・error / warn / info）
#   target          対象の切り替えとパス
#   refresh         「更新」
#   list            テンプレートの一覧
#   template        一覧の最初の 1 件（開くと計画・フロー・本文が出る）
#   drafts          下書きの一覧
#   draft           下書きの最初の 1 件
#   handoff         「取り込み待ちを開く」
#   sum / sum-pick / sum-count / sum-table   統合結果の枠 / 選ぶ欄 / 件数 / 表
#   tour            「?」
screen: templates

sample:
  path: .ccnavi/config/project/templates/
  templates:
    - name: feature
      description: 機能を追加する親の計画
      when: 新しい機能を追加するとき
      plan:
        - type: design
          review: required
          after: []
        - type: implement
          review: none
          after: [0]
      feedback:
        - type: fix
          review: none
          after: []
      flows:
        - name: implement
          nodes: 4
          connections: 3
      text: |
        name: feature
        description: 機能を追加する親の計画
        when: 新しい機能を追加するとき
    - name: research
      description: 調べものの親の計画
      when: 先に調べてから決めるとき
      plan:
        - type: investigate
          review: none
          after: []
      dropped:
        reason: conflict
        detail: "`research` は共通と同じ名前で中身が違う。共通の定義を使う"
      text: |
        name: research
  drafts:
    - name: login
      description: ログイン画面を追加する親の計画
      problems:
        - severity: warn
          detail: 本文に TODO が残っている
      plan:
        - type: design
          review: required
          after: []
      flows:
        - name: implement
          nodes: 3
          connections: 2
    - name: broken
      description: 検査で error になる下書き
      problems:
        - severity: error
          detail: YAML として読み込めない
  sums:
    - name: self
      layers: [common, self]
      templates:
        - name: feature
          layer: common
        - name: research
          layer: common
        - name: feature
          layer: self
        - name: research
          layer: self
          dropped:
            reason: conflict
            detail: "`research` は共通と同じ名前で中身が違う。共通の定義を使う"
    - name: lib
      layers: [common, lib]
      templates:
        - name: feature
          layer: common
        - name: lib
          layer: lib

# 案内の手順が引く時系列の図。矢印の `value` は、見本（sample）の名前・値と揃えた実際の例（等幅で出す）。
diagrams:
  # 完了した親を閉じてから、下書きが wip/handoff/ に書かれるまで
  template-draft:
    actors: [エージェント, ccnavi, wip/handoff/]
    steps:
      - id: close
        from: エージェント
        to: ccnavi
        text: 計画を持つ親 login を閉じる（finish）
      - id: notice
        from: ccnavi
        to: エージェント
        text: 閉じた出力の最後に、テンプレートにする案内を 1 行足す
        value: "テンプレートにするなら、`ready` の前に `ccnavi --templates --draft login` で下書きを作る（…）"
      - id: draft
        from: エージェント
        to: ccnavi
        text: ready の前に、下書きを作らせる
        value: ccnavi --templates --draft login
      - id: write
        from: ccnavi
        to: wip/handoff/
        text: 親の計画と子のフローを、取り込み先と同じ相対パスに写す
        value: wip/handoff/.ccnavi/config/project/templates/login.yml
      - id: todo
        from: ccnavi
        text: 説明と使う場面に TODO の印を付ける
        value: |-
          description: TODO 一般化する: <親の題>
          when: TODO 一般化する: 「<親の題>」と同じ形の作業をするとき
      - id: fix
        from: エージェント
        to: wip/handoff/
        text: 固有名を一般化し、効かなかった手順を削り、TODO を消す
        value: "description: ログイン画面を追加する親の計画"
      - id: hold
        from: wip/handoff/
        text: 下書きに効力は無い。取り込むか消すまで、親の ready は止まる

  # 取り込み待ちの画面で、下書きを取り込むまで
  template-import:
    actors: [ユーザ, 取り込み待ち画面, ccnavi, templates/]
    steps:
      - id: pick
        from: ユーザ
        to: 取り込み待ち画面
        text: login の下書きを選び、［選んだ対象を取り込む…］から［この内容で取り込む］を押す
        value: .ccnavi/config/project/templates/login.yml
      - id: lock
        from: 取り込み待ち画面
        text: 作業中のチケットがあれば、テンプレートの取り込みは止める
      - id: look
        from: 取り込み待ち画面
        to: ccnavi
        text: そのパスだけを指して、見るだけでもう一度読み、ハッシュ（expect）を受け取る
        value: ccnavi user handoff .ccnavi/config/project/templates/login.yml --json
      - id: apply
        from: 取り込み待ち画面
        to: ccnavi
        text: 受け取ったハッシュを付けて、取り込ませる
        value: ccnavi user handoff .ccnavi/config/project/templates/login.yml --yes --expect <ハッシュ> --via board --json
      - id: write
        from: ccnavi
        to: templates/
        text: 下書きの中身を書く。取り込んだ下書きは消える
        value: .ccnavi/config/project/templates/login.yml
      - id: result
        from: ccnavi
        to: 取り込み待ち画面
        text: 取り込めた対象と、消した下書きを返す
        value: "取り込めた: .ccnavi/config/project/templates/login.yml"
      - id: use
        from: templates/
        text: これ以後、ticket new の --template login で引ける

  # テンプレートで次の親の提案を始める（フィードバック計画は書かない）
  template-propose:
    actors: [エージェント, ccnavi, templates/, wip/proposals/]
    steps:
      - id: list
        from: エージェント
        to: ccnavi
        text: 使えるテンプレートを探す
        value: ccnavi --templates --keyword 機能
      - id: found
        from: ccnavi
        to: エージェント
        text: 共通の設定と自分の層の和から、名前・説明・使う場面を返す
        value: |-
          ccnavi: テンプレート（共通 + self）
            feature  [self]  機能を追加する親の計画
                いつ: 新しい機能を追加するとき
      - id: new
        from: エージェント
        to: ccnavi
        text: feature を選んで、次の親 signup の提案を始める
        value: ccnavi ticket new signup --title "サインアップ画面を追加する" --template feature --issue 12 --mr 34
      - id: read
        from: ccnavi
        to: templates/
        text: 名前で引く。捨てられた・error がある・種類が phases.yml に無いときは、何も書かずに止まる
        value: .ccnavi/config/project/templates/feature.yml
      - id: write
        from: ccnavi
        to: wip/proposals/
        text: 親の提案と、子のフローの下書きを書く
        value: |-
          wip/proposals/todo/signup.md
          plan（2 項）: 1 design / 2 implement（待つ 1）
          wip/proposals/flows/signup-<NN>-01.yml（フローの下書き）
      - id: skip
        from: ccnavi
        to: エージェント
        text: フィードバック計画は書かず、あることだけ知らせる
        value: テンプレートにはフィードバック計画（1 項）がある。…`--with-feedback` を付けて作り直すか、提案を改版で追加します。
      - id: approve
        from: エージェント
        text: 提案は通常どおり承認を通る。フローの下書きは、ユーザがフロー編集画面で取り込むまで子に渡らない

  # 同じテンプレートに --with-feedback を付ける（値を変えると結果が変わる例）
  template-propose-feedback:
    actors: [エージェント, ccnavi, wip/proposals/]
    steps:
      - id: new
        from: エージェント
        to: ccnavi
        text: 同じ feature を、フィードバック計画も付けて使う
        value: ccnavi ticket new signup --title "サインアップ画面を追加する" --template feature --with-feedback --issue 12 --mr 34
      - id: write
        from: ccnavi
        to: wip/proposals/
        text: 全体計画に続けて、フィードバック計画も書く
        value: |-
          plan（2 項）: 1 design / 2 implement（待つ 1）
          feedback（1 項）: 3 fix
      - id: number
        from: ccnavi
        text: フィードバック計画の番号は、全体計画の続きになる（2 項のあとなので 3）

  # ccnavi を知らない人向け。テンプレートを溜めて、使い回すまでの全体像（具体的な図は、このあとの 2 本の案内で見る）
  template-first:
    actors: [エージェント, ユーザ, ccnavi]
    steps:
      - id: draft
        from: エージェント
        to: ccnavi
        text: 終わった作業から、テンプレートの下書き（まだ使えない控え）を作らせる
      - id: import
        from: ユーザ
        to: ccnavi
        text: 下書きを読んで取り込むと、使えるテンプレートになる。取り込みは「取り込み待ち」の画面で行う
      - id: look
        from: ユーザ
        text: このテンプレート管理の画面は、溜まったテンプレートと下書きを読む場所
      - id: use
        from: エージェント
        to: ccnavi
        text: 似た作業を始めるとき、テンプレートを指して次の親（まとまった 1 つの作業）の提案を始める
        value: ccnavi ticket new signup --title "サインアップ画面を追加する" --template feature --issue 12 --mr 34
      - id: result
        from: ccnavi
        to: エージェント
        text: テンプレートの計画とフローが、提案の下書きとして書かれる。提案は、ふだんどおり承認を通る

courses:
  - id: intro
    title: 基本の案内
    summary: 画面の見方。テンプレートの一覧、統合結果、下書き
    steps:
      - target: summary
        title: 件数と検査の結果
        body: テンプレートと下書きの数、そして検査の error・warn・info の数が出ます。error があるテンプレートは使えません。
        scene: {}
      - target: target
        title: 対象を切り替える
        body: 共通の設定・ワークスペース・プロジェクトを切り替えて、どの設定のテンプレートを見るかを選びます。パスは、いま見ている層の置き場です。
        scene: {}
      - target: list
        title: テンプレートの一覧
        body: 選んだ層のテンプレートが並びます。各テンプレートに、使用可否を示すラベルや、適用対象から除外された理由が表示されます。捨てた理由は、同じ中身があるか、読み込めないかなどです。
        scene: {}
      - target: template
        title: 1 件を開く
        body: 行は最初から開いていて、通常は計画の図と子のフローの図が出ます（この案内の見本では表で見せます）。見出しを押すと畳めます。「本文を見る」を押すと本文も読めます。本文では、見えない文字を \uXXXX の形で出します。
        scene:
          open: feature
          body: true
      - target: sum
        title: 統合結果
        body: 実際に使われるのは、共通の設定と選んだ層の和です。枠を開くと、どの名前がどの層から使われ、どれが捨てられたかの一覧が出ます。読み取り専用で、中身は上の一覧で読みます。
        scene:
          sum: self
      - target: drafts
        title: 下書き
        body: エージェントが作成した下書きです。効力は無く、取り込むまでテンプレートとしては使われません。この画面では読むだけで、取り込みは「取り込み待ち」の画面で行います。
        scene: {}
      - target: refresh
        title: 更新
        body: 一覧を再読み込みします。ファイルを外で変更したあとに押します。
        scene: {}
      - target: tour
        title: 案内
        body: ヘッダ右上の ? を押すと、基本の案内と、使い方ごとの案内を選べます。
        scene: {}

  - id: first-look
    title: テンプレートとは何かを、はじめて知る人向けに知りたいとき
    summary: ccnavi を知らなくても分かる全体像。溜める、読む、使い回すの流れ
    steps:
      - target: template
        title: テンプレートは、計画とフローの型
        body: 似た作業を何度もするとき、前に作った「計画とフローの型」を使い回せます。それがテンプレートです。計画は「設計してから実装する」のような作業の順番、フローは 1 つの作業の中の手順の流れです。見本の feature は、設計のあとに実装が続く計画を持っています。
        scene: { open: feature }
      - target: drafts
        title: 終わった作業から、下書きを作って溜める
        body: 作業が終わると、エージェントがその計画とフローからテンプレートの下書きを作れます。下書きはまだ使えない控えで、取り込むまでテンプレートとしては効きません。
        scene: {}
        diagram: template-first
        focus: draft
      - target: handoff
        title: 取り込むと、使えるテンプレートになる
        body: 下書きを読んで内容を確かめ、ユーザが取り込むと、使えるテンプレートになります。取り込みは「取り込み待ち」の画面で行います。
        scene: {}
        diagram: template-first
        focus: import
      - target: list
        title: この画面は、読む場所
        body: このテンプレート管理の画面は、溜まったテンプレートと下書きを読む場所です。下書きの取り込みは、ここではなく取り込み待ちの画面で行います。
        scene: {}
        diagram: template-first
        focus: look
      - target: template
        title: 次の作業の提案を、テンプレートから始める
        body: 似た作業を始めるとき、エージェントはテンプレートの名前を指して、次の作業の提案を始められます。提案はふだんどおり承認を通ります。次の案内では、下書きから取り込み、次の提案で使うまでを例で見られます。
        scene: { open: feature }
        diagram: template-first
        focus: use,result

  - id: how-drafts-flow
    title: 完了した作業からテンプレートを溜めたいとき
    summary: 親を閉じてから、下書きができて、取り込むまで。値の例つきの図で見る
    steps:
      - target: drafts
        title: 親を閉じると案内が出る
        body: 計画を持つ親を閉じると、ccnavi が閉じた出力の最後に、テンプレートにする案内を 1 行出します。出るのは、同じ識別子の下書きがまだ無く、同じ計画の形のテンプレートも取り込まれていないときだけです。
        scene: {}
        diagram: template-draft
        focus: close,notice
      - target: drafts
        title: ready の前に下書きを作る
        body: ready で閉じると下書きの材料が退避されて、拾えなくなります。下書きはエージェントが作り、取り込み先と同じ相対パスで wip/handoff/ に書かれます。既定の取り込み先はプロジェクトの層です（--to common で共通の層）。
        scene: {}
        diagram: template-draft
        focus: draft,write
      - target: draft
        title: TODO の印を直す
        body: 説明と使う場面に TODO の印が付きます。固有名を一般化し、効かなかった手順を削って、印を消します。印が残っていると、この画面の下書きに warn が出ます。
        scene: { draft: login }
        diagram: template-draft
        focus: todo,fix
      - target: draft
        title: この画面では読むだけ
        body: 下書きに効力は無く、この画面で直したり取り込んだりはできません。取り込むか消すまで、親の ready は止まります。
        scene: { draft: login }
        diagram: template-draft
        focus: hold
      - target: handoff
        title: 取り込み待ちの画面で取り込む
        body: 取り込みは「取り込み待ち」の画面で、ユーザが行います。error のある下書きは選べません。作業中のチケットがあるあいだは、テンプレートの取り込みも止まります。
        scene: {}
        diagram: template-import
        focus: pick,lock
      - target: handoff
        title: 押すと何が書かれるか
        body: 「この内容で取り込む」を押すと、画面は選んだパスだけをもう一度読んでハッシュを受け取り、そのハッシュ付きで ccnavi に取り込ませます。ファイルを書くのは ccnavi で、画面は書きません。見せたあとに下書きが変わっていたら書きません。
        scene: {}
        diagram: template-import
        focus: look,apply,write
      - target: list
        title: 取り込んだあと
        body: 取り込んだ下書きは消え、プロジェクトの層のテンプレートとして一覧に出ます。これ以後、エージェントが --template login で引けます。
        scene: {}
        diagram: template-import
        focus: result,use

  - id: how-templates-used
    title: テンプレートで次の親の提案を始めたいとき
    summary: テンプレートがいつ、どう引かれて、提案に何が書かれるか。値の例つきの図で見る
    steps:
      - target: list
        title: 使えるテンプレートを探す
        body: エージェントは ccnavi --templates で、共通の設定と自分の層の和を引きます。この画面の一覧と統合結果と同じ答えです。名前・説明・使う場面で絞れます。
        scene: {}
        diagram: template-propose
        focus: list,found
      - target: template
        title: 使う場面は when に書く
        body: 「新しい機能を追加するとき」のように、when に書いた場面でテンプレートを選びます。使えるのは、統合結果で使われていて、error の無いものだけです。
        scene: { open: feature }
        diagram: template-propose
        focus: found
      - target: template
        title: テンプレートを指して提案を始める
        body: ccnavi ticket new に --template と名前を渡すと、親の提案を始められます。捨てられたテンプレートや、error のあるテンプレート、phases.yml に無い種類を含むテンプレートでは、何も書かずに止まります。
        scene: { open: feature }
        diagram: template-propose
        focus: new,read
      - target: template
        title: 計画と子のフローの下書きが書かれる
        body: 全体計画（plan）はテンプレートから写し、待つ項の番号は提案の番号に付け直されます。子のフローは下書きとして書かれ、ユーザがフロー編集画面で取り込むまで効きません。
        scene: { open: feature }
        diagram: template-propose
        focus: write
      - target: template
        title: フィードバック計画は書かれない
        body: フィードバック計画は、全体計画の最後のレビューを見てから、改版で 1 回だけ足す決まりです。--with-feedback を付けなければ書かず、あることだけを知らせます。提案は通常の承認を通ります。
        scene: { open: feature }
        diagram: template-propose
        focus: skip,approve
      - target: template
        title: フィードバック計画も書くとき
        body: --with-feedback を付けると、全体計画に続く番号で feedback も書きます。値を変えると結果が変わるので、図を分けています。
        scene: { open: feature }
        diagram: template-propose-feedback
        focus: write,number
      - target: sum
        title: 捨てられたものは引けない
        body: 統合結果で捨てられたテンプレートは使われません。引けるかどうかは、表の「捨てた理由」で確かめます。
        scene:
          sum: self

  - id: read-sum
    title: 統合結果を確認するとき
    summary: どの名前が使われ、どれが捨てられたかを見る
    steps:
      - target: sum
        title: 統合結果の枠
        body: 枠を開くと、共通の設定と選んだ設定を追加した結果が出ます。
        scene:
          sum: self
      - target: sum-pick
        title: 統合結果を選ぶ
        body: ワークスペースの統合結果と、プロジェクトごとの統合結果を切り替えます。
        scene:
          sum: lib
      - target: sum-count
        title: 使われる件数
