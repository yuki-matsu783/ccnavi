# テンプレート管理画面の案内。`sample:` は案内の間だけ画面に出す見本（実際のテンプレートではない）。
#   path       見本の層の置き場（画面には「（見本）」を付けて出す）
#   templates  見本の層（self）のテンプレート。name・description・when・plan・feedback・flows・problems・dropped（破棄した理由。あれば「使われない」）・text（本文）
#   drafts     見本の下書き。name・description・problems・plan・feedback・flows
#   sums       「統合結果」の見本。実行ファイルが出す索引の形（共通の設定 + 1 つの設定の和）
# `scene:` は手順ごとの画面の様子。手順ごとに全部を書く（前の手順を引き継がない）。
#   open     開くテンプレートの名前（, で区切って複数）
#   body     true なら、開いたテンプレートに見本の本文を出す
#   draft    開く下書きの名前（, で区切って複数）
#   sum      「統合結果」の枠を開き、選ぶ統合結果の名前（sample.sums の name）
# `target:` の印（画面の data-tour）:
#   summary         件数の行（テンプレート・下書き・error / warn / info）
#   target          対象の切り替えとパス
#   refresh         「更新」
#   list            テンプレートの一覧
#   template        一覧の最初の 1 件（開くと計画・フロー・本文が出る）
#   drafts          下書きの一覧
#   draft           下書きの最初の 1 件
#   handoff         「取り込み待ちを開く」
#   sum / sum-pick / sum-count / sum-table   統合結果の枠 / 選ぶ欄 / 件数 / 表
#   tour            「?」
screen: templates

sample:
  path: .ccnavi/config/project/templates/
  templates:
    - name: feature
      description: 機能を追加する親の計画
      when: 新しい機能を追加するとき
      plan:
        - type: design
          review: required
          after: []
        - type: implement
          review: none
          after: [0]
      feedback:
        - type: fix
          review: none
          after: []
      flows:
        - name: implement
          nodes: 4
          connections: 3
      text: |
        name: feature
        description: 機能を追加する親の計画
        when: 新しい機能を追加するとき
    - name: research
      description: 調べものの親の計画
      when: 先に調べてから決めるとき
      plan:
        - type: investigate
          review: none
          after: []
      dropped:
        reason: conflict
        detail: "`research` は共通と同じ名前で中身が違う。共通の定義を使う"
      text: |
        name: research
  drafts:
    - name: login
      description: ログイン画面を追加する親の計画
      problems:
        - severity: warn
          detail: 本文に TODO が残っている
      plan:
        - type: design
          review: required
          after: []
      flows:
        - name: implement
          nodes: 3
          connections: 2
    - name: broken
      description: 検査で error になる下書き
      problems:
        - severity: error
          detail: YAML として読み込めない
  sums:
    - name: self
      layers: [common, self]
      templates:
        - name: feature
          layer: common
        - name: research
          layer: common
        - name: feature
          layer: self
        - name: research
          layer: self
          dropped:
            reason: conflict
            detail: "`research` は共通と同じ名前で中身が違う。共通の定義を使う"
    - name: lib
      layers: [common, lib]
      templates:
        - name: feature
          layer: common
        - name: lib
          layer: lib

courses:
  - id: intro
    title: 基本の案内
    summary: 画面の見方。テンプレートの一覧、統合結果、下書き
    steps:
      - target: summary
        title: 件数と検査の結果
        body: テンプレートと下書きの数、そして検査の error・warn・info の数が出ます。error があるテンプレートは無効になります。
        scene: {}
      - target: target
        title: 対象を切り替える
        body: 共通の設定・ワークスペース・プロジェクトを切り替えて、どの設定のテンプレートを見るかを選びます。パスは、いま見ている層の置き場です。
        scene: {}
      - target: list
        title: テンプレートの一覧
        body: 選んだ層のテンプレートが並びます。各テンプレートに、有効・無効を示すラベルや、適用対象から除外された理由が表示されます。破棄した理由は、同じ中身があるか、読み込めないかなどです。
        scene: {}
      - target: template
        title: 1 件を開く
        body: 見出しを押すと、計画のステップ・フロー・検査の指摘が見えます。本文を見るボタンで本文も読めます。本文では、見えない文字を \uXXXX の形で表示します。
        scene:
          open: feature
          body: true
      - target: sum
        title: 統合結果
        body: 実際に使われるのは、共通の設定と選んだ層の和です。枠を開くと、どの名前がどの層から使われ、どれが破棄されたかの一覧が出ます。読み取り専用で、中身は上の一覧で読みます。
        scene:
          sum: self
      - target: drafts
        title: 下書き
        body: エージェントが作成した下書きです。効力は無く、取り込むまでテンプレートとしては使われません。この画面では読むだけで、取り込みは「取り込み待ち」の画面で行います。
        scene: {}
      - target: refresh
        title: 更新
        body: 一覧を再読み込みします。ファイルを外で変更したあとに押します。
        scene: {}
      - target: tour
        title: 案内
        body: ヘッダ右上の ? を押すと、基本の案内と、使い方ごとの案内を選べます。
        scene: {}

  - id: read-sum
    title: 統合結果を確認するとき
    summary: どの名前が使われ、どれが破棄されたかを見る
    steps:
      - target: sum
        title: 統合結果の枠
        body: 枠を開くと、共通の設定と選んだ設定を追加した結果が出ます。
        scene:
          sum: self
      - target: sum-pick
        title: 統合結果を選ぶ
        body: ワークスペースの統合結果と、プロジェクトごとの統合結果を切り替えます。
        scene:
          sum: lib
      - target: sum-count
        title: 使われる件数
        body: 統合結果に入る層と、実際に使われる件数が出ます。
        scene:
          sum: self
      - target: sum-table
        title: 由来と破棄した理由
        body: 名前ごとに、どの層のものか、使われるか、破棄されたときの理由が出ます。同じ名前で中身が違うと、共通の側が使われます。
        scene:
          sum: self

  - id: read-drafts
    title: 下書きを確認するとき
    summary: 下書きの検査を見て、取り込み待ちの画面へ進む
    steps:
      - target: drafts
        title: 下書きとは
        body: 親チケットの中で作成された、まだ効力のないテンプレートです。ここで検査の指摘と計画を読めます。
        scene:
          draft: login
      - target: draft
        title: 検査の指摘
        body: error があるものは取り込めません。TODO が残っているものは、直してから取り込みます。この画面で下書きは直せません。
        scene:
          draft: login
      - target: handoff
        title: 取り込み待ちの画面へ
        body: 下書きの取り込みは「取り込み待ち」の画面で行います。差分を読んで、取り込む対象を選びます。
        scene: {}
      - target: refresh
        title: 再読み込みする
        body: 下書きを直したあとは、更新を押して再読み込みします。
        scene: {}
