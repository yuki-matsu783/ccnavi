# 計画編集画面の案内。`sample:` は案内の間だけ画面に出す見本（実際の提案ではない）。
#
# 見本は「実行ファイルの答え」（`--plan-order <親> --json` の答え）に名前を付けて並べたもの。実行ファイルの JSON と同じ形で書き、
# 欠けた欄は `core/tour-workflow.ts` の決まりで埋める（ticket・part・source_sha・項の from・proposed・loose の寄せ集め・writable など）。
#   base      その答えを引く前の答え。書かなかった計画（plan / feedback）は base のものを使う。点の置き場所・「案に戻す」・外で
#             変わった差分の元になる。書かない答えは「開いたときの答え」
#   after     振り直したあとの番号での、項ごとの直接の先行（実行ファイルは推移的に整理しない。書いたとおりに残る）
#   proposed  提案に記載されている先行（元の番号）。base を書けば base の値を使う
# 画面は答えをそのまま描く（未保存・番号の変わる項・保存できない理由は、実際と同じ読み取りで答えから出る）。
#
# `scene:` は手順ごとの画面の様子。手順ごとに全部を書く（前の手順を引き継がない）。書かなければ answer: open の素の画面。
#   answer    描く答えの名前（sample.answers の鍵）。既定は open
#   refused   断られた線の理由を下の一行に出す。この名前の答えの refused を読む（図は answer のまま）
#   checking  真なら、線を変えて ccnavi の答えを待っている間の画面（一言を出し、線を変えられない）
#   changed   外で変わった提案の名前（答えの鍵）。帯と、answer の base との差分を出す
#   diff      changed のとき、差分の表を出すか（既定は出す。偽なら帯の文だけ）
#   gone      真なら、提案が承認待ちから無くなった画面
#   review    真なら、保存の前の確かめを開く
#   pick      項の番号。押して詳細の欄を出す
#   tidy      真なら、点の置き場所を今の線から組み直した図にする（「並べ直す」を押したあと）
#
# 指す先（target）の印。図の中身は画面が実際の DOM に付ける（図の部品は共通なので触らない）。
#   graphs  図の領域全体            controls  ボタンの並び              relayout / revert / reload / save  各ボタン
#   summary  題と未保存の印の並び   dirty  「未保存」                   tour  「?」
#   status  下の一言                renumbered  番号が変わる項の一行    problems  理由の一覧
#   changed  外で変わった帯         changed-diff  差分の表              adopt  取り込む    gone  承認待ちから無くなった帯
#   review-numbers / review-children / review-note  保存の確かめの各欄
#   graph-plan / graph-feedback     計画ごとの図
#   detail-plan / notes-plan / zoom-plan            計画ごとの詳細の欄・図の下の一言・拡大縮小のボタン
#   node-<番号>   項の点（振り直したあとの番号）
#   edge-<先行>-<番号>  線。cut-<先行>-<番号>  その線の ×（引けた項どうしの線だけ）
screen: workflow

sample:
  ticket: sample-a
  answers:
    # 開いたとき。全体計画 1〜4（2 と 3 が 1 を待ち、4 が両方を待つ）と、フィードバック計画 5〜6
    open:
      plan:
        items:
          - { number: 1, type: research, title: 調査, review: none }
          - { number: 2, type: design, title: 設計, review: mr }
          - { number: 3, type: implement, title: 実装とテスト, review: mr }
          - { number: 4, type: docs, title: 文書, review: mr }
        after: { 2: [1], 3: [1], 4: [2, 3] }
        ready: [1]
      feedback: &feedback
        items:
          - { number: 5, type: design-feedback, title: 設計フィードバック対応, review: mr }
          - { number: 6, type: implement-feedback, title: 実装フィードバック対応, review: mr }
        after: { 6: [5] }
        ready: [5]

    # 並列にする案内の出発点。1 → 2 → 3 → 4 の一直線
    chain:
      plan:
        items:
          - { number: 1, type: research, title: 調査, review: none }
          - { number: 2, type: design, title: 設計, review: mr }
          - { number: 3, type: implement, title: 実装とテスト, review: mr }
          - { number: 4, type: docs, title: 文書, review: mr }
        after: { 2: [1], 3: [2], 4: [3] }
        ready: [1]
      feedback: *feedback
    # 4 が 2 と 3 の両方を待つ
    chain-join:
      base: chain
      plan:
        items:
          - { number: 1, type: research, title: 調査, review: none }
          - { number: 2, type: design, title: 設計, review: mr }
          - { number: 3, type: implement, title: 実装とテスト, review: mr }
          - { number: 4, type: docs, title: 文書, review: mr }
        after: { 2: [1], 3: [2], 4: [2, 3] }
        ready: [1]
    # 3 が 1 も待つ
    chain-add:
      base: chain
      plan:
        items:
          - { number: 1, type: research, title: 調査, review: none }
          - { number: 2, type: design, title: 設計, review: mr }
          - { number: 3, type: implement, title: 実装とテスト, review: mr }
          - { number: 4, type: docs, title: 文書, review: mr }
        after: { 2: [1], 3: [1, 2], 4: [2, 3] }
        ready: [1]
    # 3 が 2 を待たなくなり、2 と 3 が並列になった
    chain-cut:
      base: chain
      plan:
        items:
          - { number: 1, type: research, title: 調査, review: none }
          - { number: 2, type: design, title: 設計, review: mr }
          - { number: 3, type: implement, title: 実装とテスト, review: mr }
          - { number: 4, type: docs, title: 文書, review: mr }
        after: { 2: [1], 3: [1], 4: [2, 3] }
        ready: [1]
    # 4 → 2 の合流を作らずに 2 → 3 を消した形。2 が終端に届かず error
    chain-loose:
      base: chain
      plan:
        items:
          - { number: 1, type: research, title: 調査, review: none }
          - { number: 2, type: design, title: 設計, review: mr }
          - { number: 3, type: implement, title: 実装とテスト, review: mr }
          - { number: 4, type: docs, title: 文書, review: mr }
        after: { 2: [1], 3: [1], 4: [3] }
        loose: [2]
        ready: [1]
        problems:
          - "error: sample-a: `plan` の最後の項（4: docs）が 2 を待たない。終端は 1 つにしてください（最後の項がほかの全部を推移的に待つように `after` を入力する。独立した作業は最後に 1 項で受けるか、一直線に並べる）"

    # 線のつなぎ変えの案内。open に 2 → 3 を足し、1 → 3 を消す
    after-23:
      base: open
      plan:
        items:
          - { number: 1, type: research, title: 調査, review: none }
          - { number: 2, type: design, title: 設計, review: mr }
          - { number: 3, type: implement, title: 実装とテスト, review: mr }
          - { number: 4, type: docs, title: 文書, review: mr }
        after: { 2: [1], 3: [1, 2], 4: [2, 3] }
        ready: [1]
    after-23-cut:
      base: open
      plan:
        items:
          - { number: 1, type: research, title: 調査, review: none }
          - { number: 2, type: design, title: 設計, review: mr }
          - { number: 3, type: implement, title: 実装とテスト, review: mr }
          - { number: 4, type: docs, title: 文書, review: mr }
        after: { 2: [1], 3: [2], 4: [2, 3] }
        ready: [1]

    # 3 → 2 の線で 2 と 3 が入れ替わり、番号が振り直され、子の提案が付け替わる
    swap:
      base: open
      plan:
        items:
          - { number: 1, type: research, title: 調査, review: none }
          - { number: 2, from: 3, type: implement, title: 実装とテスト, review: mr }
          - { number: 3, from: 2, type: design, title: 設計, review: mr }
          - { number: 4, type: docs, title: 文書, review: mr }
        after: { 2: [1], 3: [1, 2], 4: [2, 3] }
        ready: [1]
      children: &children
        - { ticket: sample-a-02-01, new_ticket: sample-a-03-01, path: /ws/wip/proposals/todo/sample-a-02-01.md, new_path: /ws/wip/proposals/todo/sample-a-03-01.md, phase: 2, new_phase: 3, predecessors: [], new_predecessors: [] }
        - { ticket: sample-a-03-01, new_ticket: sample-a-02-01, path: /ws/wip/proposals/todo/sample-a-03-01.md, new_path: /ws/wip/proposals/todo/sample-a-02-01.md, phase: 3, new_phase: 2, predecessors: [], new_predecessors: [] }
        - { ticket: sample-a-04-01, new_ticket: sample-a-04-01, path: /ws/wip/proposals/todo/sample-a-04-01.md, new_path: /ws/wip/proposals/todo/sample-a-04-01.md, phase: 4, new_phase: 4, predecessors: [sample-a-02-01], new_predecessors: [sample-a-03-01] }
    # swap を保存して読み直したあと（提案に記載されている順序が新しい番号になり、未保存ではない）
    swapped-saved:
      plan:
        items:
          - { number: 1, type: research, title: 調査, review: none }
          - { number: 2, type: implement, title: 実装とテスト, review: mr }
          - { number: 3, type: design, title: 設計, review: mr }
          - { number: 4, type: docs, title: 文書, review: mr }
        after: { 2: [1], 3: [1, 2], 4: [2, 3] }
        ready: [1]
      feedback: *feedback

    # フィードバック計画だけ、6 → 5 の線で 5 と 6 が入れ替わった形
    fb-swap:
      base: open
      feedback:
        items:
          - { number: 5, from: 6, type: implement-feedback, title: 実装フィードバック対応, review: mr }
          - { number: 6, from: 5, type: design-feedback, title: 設計フィードバック対応, review: mr }
        after: { 6: [5] }
        proposed: { 6: [5] }
        ready: [5]

    # 3 が待たれず、最後の項（4）が 3 を待たない形。error で保存できない
    loose:
      base: open
      plan:
        items:
          - { number: 1, type: research, title: 調査, review: none }
          - { number: 2, type: design, title: 設計, review: mr }
          - { number: 3, type: implement, title: 実装とテスト, review: mr }
          - { number: 4, type: docs, title: 文書, review: mr }
        after: { 2: [1], 3: [1], 4: [2] }
        loose: [3]
        ready: [1]
        problems:
          - "error: sample-a: `plan` の最後の項（4: docs）が 3 を待たない。終端は 1 つにしてください（最後の項がほかの全部を推移的に待つように `after` を入力する。独立した作業は最後に 1 項で受けるか、一直線に並べる）"

    # 改版の提案。3（実装とテスト）は子が承認されている。4 は 1 と 3 を待つ
    locked-open:
      plan:
        items:
          - { number: 1, type: research, title: 調査, review: none }
          - { number: 2, type: design, title: 設計, review: mr }
          - { number: 3, type: implement, title: 実装とテスト, review: mr, locked: true }
          - { number: 4, type: docs, title: 文書, review: mr }
        after: { 2: [1], 3: [2], 4: [1, 3] }
        current: { 2: [1], 3: [2], 4: [1, 3] }
        ready: [1]
      feedback: *feedback
    # 1 → 2 を消すと、子が承認された 3 の待ち（いま 1, 2）が変わって通らない
    locked-cut:
      base: locked-open
      plan:
        items:
          - { number: 1, type: research, title: 調査, review: none }
          - { number: 2, type: design, title: 設計, review: mr }
          - { number: 3, type: implement, title: 実装とテスト, review: mr, locked: true }
          - { number: 4, type: docs, title: 文書, review: mr }
        after: { 3: [2], 4: [1, 3] }
        current: { 2: [1], 3: [2], 4: [1, 3] }
        ready: [1, 2]
      revision_problems:
        - "3 番目（implement）は子が承認されているので、待ちを変えられない（いま待つ: 1, 2、改版: 2）"
    # ccnavi が断った線の見本（refused だけを読む。図は locked-open のまま）
    unpackable:
      base: locked-open
      refused:
        - { kind: unpackable, number: 3, text: 子が承認された番号を動かさずに番号を振れない（3 番に置ける項がありません）。詰められないので、この線は引けない }

    # 番号が変わるが、子の提案を付け替えられない。計画と食い違う子の提案もある
    child-problems:
      base: open
      plan:
        items:
          - { number: 1, type: research, title: 調査, review: none }
          - { number: 2, from: 3, type: implement, title: 実装とテスト, review: mr }
          - { number: 3, from: 2, type: design, title: 設計, review: mr }
          - { number: 4, type: docs, title: 文書, review: mr }
        after: { 2: [1], 3: [1, 2], 4: [2, 3] }
        ready: [1]
      children: *children
      child_problems:
        - 承認済みチケット sample-a-03-01 が付け替える識別子と同じ（/ws/wip/approved/sample-a-03-01.md）
      mismatched:
        - { ticket: sample-a-07-01, path: /ws/wip/proposals/todo/sample-a-07-01.md, phase: 7, text: "sample-a-07-01 の phase: 7 は親の計画（1〜4 番）にありません" }

    # 外で変わった提案（エージェントが 3 の待ちと 4 の待ちを書き換えた）
    outside:
      plan:
        items:
          - { number: 1, type: research, title: 調査, review: none }
          - { number: 2, type: design, title: 設計, review: mr }
          - { number: 3, type: implement, title: 実装とテスト, review: mr }
          - { number: 4, type: docs, title: 文書, review: mr }
        after: { 2: [1], 3: [1, 2], 4: [3] }
        ready: [1]
      feedback: *feedback

courses:
  - id: intro
    title: 基本の案内
    summary: 画面の見どころを順に回ります
    steps:
      - target: graphs
        title: 図
        body: >-
          点は親の計画のステップで、線はどのステップにどのステップが先行するか（after）です。ステップの右の点から別のステップの左の点へドラッグすると、線の先のステップに、元のステップが先行します（逆向きでも引けます）。線の真ん中の × で先行を外せます。
          線を変えるたびに ccnavi が番号を振り直します。循環になる線と、子が承認された番号へ入る線は引けません。最後のステップから先行をたどっても届かないステップは、注意の色で出ます。
      - target: controls
        title: 直す手段
        body: 「並べ直す」は今の線で点の置き場所を組み直します（番号は変わりません）。「案に戻す」は提案に記載されている順序に戻し、「再読込」は提案を再読み込みします。
      - target: save
        title: この順序に決める
        body: >-
          番号の変わるステップと、付け替える子の提案を一覧で確認してから、提案の計画（plan: / feedback:）と子の提案を変更します。承認はしません。変更した提案はコミットされません。
          エージェントが提案を変更していたら、何も保存せずに差分を表示します。
      - target: summary
        title: 承認との関係
        body: >-
          未保存の変更があるあいだは、チケット管理画面でこの親を含む一覧を承認できません。保存したら、承認はチケット管理画面から開き直してください。
          保存したあとにエージェントが提案を変更すると、承認の画面に注意が出ます。
      - target: tour
        title: 案内
        body: ヘッダ右上の ? を押すと、使い方ごとの案内（線のつなぎ変え・並列にする・保存できない理由・外で変わった提案への対応など）の一覧が開きます。

  - id: reorder
    title: ステップの順序（after）をつなぎ変えたいとき
    summary: 線を引いて、余った線を消し、結果を確認して決める
    steps:
      - target: graph-plan
        title: まず図を確認する
        body: >-
          点は計画のステップで、番号・定義の題・見る場所（レビューの要否）を表示します。線は「右のステップに左のステップが先行する」ことを表し、開始から出る線と終了へ入る線は図だけの目印です。
          ここでは設計（2）と実装とテスト（3）の先行が、どちらも調査（1）だけです。
        scene: { answer: open }
      - target: node-2
        title: 設計のあとに実装を始めたい
        body: >-
          設計（2）の右の点から、実装とテスト（3）の左の点へドラッグします。線の先のステップ（3）に、元のステップ（2）が先行するようになります。
          3 の右の点から 2 の左の点へ引けば逆向きで、2 の先行が 3 になります。どちらの向きでも引けます。
        scene: { answer: open }
      - target: edge-2-3
        title: 線が増える
        body: >-
          線を引くと、画面は番号を決めずに ccnavi へ頼み、届いた答えで図を描き直します。ここでは 3 の先行が 1 と 2 になり、番号は変わりません。
          ヘッダに「未保存」が出ます。答えを待つあいだは、線を変えられません。
        scene: { answer: after-23 }
      - target: cut-1-3
        title: 余った線を削除
        body: >-
          3 の先行が 2 なら 1 も間接的に先行するので、1 → 3 の線は要りません。線の真ん中の × を押すと、3 の先行から 1 が外れます。
          開始・終了への仮の線は図が自動で引くので、× がありません。
        scene: { answer: after-23 }
      - target: graph-plan
        title: 削除した結果
        body: >-
          1 → 3 の線が消え、調査 → 設計 → 実装とテストの順になりました。線を削除しても番号は変わりません（番号が変わるのは、先行の順と番号の順が合わなくなったときだけです）。
          点の置き場所は動かさないので、線が見づらくなったら「並べ直す」で組み直せます。
        scene: { answer: after-23-cut }
      - target: save
        title: 決める
        body: >-
          線を変えると「この順序に決める」が押せます。押すと確認の一覧が開き、提案の計画（plan:）を変更します。承認はしません。
          番号の振り直しと子の提案の付け替えの確認方法は、「番号の振り直しと子の提案の付け替えを確認して保存したいとき」の案内で見られます。
        scene: { answer: after-23-cut }

  - id: parallel
    title: 並列にできるステップを作りたいとき
    summary: 一直線のステップを、同時に進められる形につなぎ直す
    steps:
      - target: graph-plan
        title: いまは一直線
        body: >-
          調査 → 設計 → 実装とテスト → 文書の順に、各ステップの先行は直前のステップだけです。設計と実装を同時に進めたいときは、実装（3）の先行を設計（2）から調査（1）へ付け替えます。
          最後のステップ（4）には、ほかの全部が（線をたどって）先行している必要があるので、先に最後のステップの先行を広げます。
        scene: { answer: chain }
      - target: node-2
        title: 先に合流を作る
        body: 設計（2）の右の点から、文書（4）の左の点へ線を引きます。最後のステップ（4）の先行が、設計と実装の両方になります。この線がないと、あとで実装（3）の先行から設計が外れたとき、設計がどこにもつながらなくなります。
        scene: { answer: chain }
      - target: edge-2-4
        title: 合流ができた
        body: 文書（4）の先行が設計（2）と実装とテスト（3）の両方になりました。番号は変わりません。
        scene: { answer: chain-join }
      - target: node-1
        title: 実装の先行を追加する
        body: 調査（1）の右の点から、実装とテスト（3）の左の点へ線を引きます。実装の先行は、調査と設計の両方になります。
        scene: { answer: chain-join }
      - target: cut-2-3
        title: 設計への線を削除
        body: 線の真ん中の × で 2 → 3 を削除すると、実装（3）の先行は調査（1）だけになり、設計（2）と実装（3）が並列になります。どちらも 1 が終われば始められます。
        scene: { answer: chain-add }
      - target: relayout
        title: 並べ直して確認する
        body: >-
          点の置き場所は動かさないので、並列にしても図では縦に並んだままです。「並べ直す」を押すと、今の線から置き場所を組み直し、2 と 3 が並んで見えます（番号は変わりません）。
          この手順は、押したあとの図を出しています。
        scene: { answer: chain-cut, tidy: true }
      - target: notes-plan
        title: 先に線を削除すると error になる
        body: >-
          合流の線（2 → 4）を作らずに 2 → 3 を削除すると、設計（2）がどのステップの先行にもならず、最後のステップ（4）に 2 が先行していない形になります。図の下に error が出て、保存できません（注意の色の線も出ます）。
          error が出たら、最後のステップへ線を追加するか、削除した線を戻します。
        scene: { answer: chain-loose }

  - id: feedback
    title: フィードバック計画を整えたいとき
    summary: 全体計画とは別の図で、フィードバックのステップの順序を引き直す
    steps:
      - target: graphs
        title: 計画は 2 枚
        body: >-
          親の提案の plan: が上の図、feedback: が下の図です。フィードバック計画の番号は全体計画の続きで、全体計画が 1〜4 なら 5 から始まります。
          番号の振り直しも、計画ごとに別に行います。
        scene: { answer: open }
      - target: graph-feedback
        title: 始まりと終わり
        body: >-
          フィードバック計画は、全体計画のレビューが済んだあとに始まり、終わると親をクローズします。左端と右端の仮の点が「全体計画のレビュー後」「親をクローズする」なのはそのためで、全体計画の開始・終了とは意味が違います。
        scene: { answer: open }
      - target: node-5
        title: 線は同じ図の中だけ
        body: 線を引けるのは、同じ計画のステップどうしだけです。全体計画のステップとフィードバック計画のステップを結ぶ線は引けません（図が別なので、点をつなげません）。フィードバックのステップの先行にできるのは、フィードバックのステップだけです。
        scene: { answer: open }
      - target: node-6
        title: 順序を入れ替える
        body: 実装フィードバック対応（6）の右の点から、設計フィードバック対応（5）の左の点へ引くと、5 の先行が 6 になります。
        scene: { answer: open }
      - target: renumbered
        title: 番号が振り直される
        body: フィードバック計画の 5 と 6 が入れ替わりました。全体計画の番号と線は、提案のままです。
        scene: { answer: fb-swap }
      - target: save
        title: 変えた計画だけが変更される
        body: "「この順序に決める」は、線を変えた計画の値だけを変更します。ここでは feedback: だけで、plan: は変わりません。承認はしません。"
        scene: { answer: fb-swap }

  - id: renumber
    title: 番号の振り直しと子の提案の付け替えを確認して保存したいとき
    summary: 順序を入れ替えて、番号の変わるステップと付け替わる子の提案を保存の前に確認する
    steps:
      - target: node-3
        title: 実装を先にしたい
        body: >-
          実装とテスト（3）を設計（2）より先に済ませたいときは、3 の右の点から 2 の左の点へ引きます（2 の先行が 3 になります）。
          先行の順と番号の順が合わなくなるので、ccnavi が番号を振り直します。
        scene: { answer: open }
      - target: renumbered
        title: 番号が変わるステップ
        body: 線を引くと、図の下に番号が変わるステップが出ます。振り直しは ccnavi が決め、画面は答えを描くだけです。
        scene: { answer: swap }
      - target: node-2
        title: 名札だけが変わる
        body: >-
          実装とテスト（いま 2 番）は、提案では 3 番でした。点の置き場所は動かさず、名札の番号だけが変わるので、どのステップかを見失いません。
          置き場所を組み直すには「並べ直す」を使います。
        scene: { answer: swap }
      - target: detail-plan
        title: 詳細で元の番号を見る
        body: >-
          ステップを押すと、右に詳細が出ます。「提案での番号」が元の番号、「番号」が振り直したあとの番号です。先行ステップ・後続ステップ・すぐ始まるか・最後のステップの先行になっていないか・番号の固定もここで読めます。
        scene: { answer: swap, pick: 2 }
      - target: review-numbers
        title: 保存の前の確認（番号）
        body: 「この順序に決める」を押すと、確認の一覧が開きます。最初の欄が、番号が変わるステップです。
        scene: { answer: swap, review: true }
      - target: review-children
        title: 付け替わる子の提案
        body: >-
          番号が変わるステップを指す子の提案（承認待ちの todo/ にあるもの）も、識別子と phase を新しい番号に変更します。「前 → 後」を並べて表示するので、何が変わるかを読めます。
          ほかの子の predecessors が付け替えた識別子を指していれば、それも直します。
        scene: { answer: swap, review: true }
      - target: review-note
        title: 保存前の注意
        body: >-
          変更するのは提案だけで、承認はしません。計画の値の中のコメントは消え、変更した提案はコミットされません。承認したあとに直すときは、子は取り消して出し直し、親は改版するか取り消すので、確認してから「保存する」を押します。
        scene: { answer: swap, review: true }
      - target: summary
        title: 保存したら
        body: 保存が通ると、画面は変更した提案から再読み込みし、「未保存」が消えます。承認は、チケット管理画面から開き直して行います。
        scene: { answer: swapped-saved }

  - id: blocked
    title: 保存できない理由を読みたいとき
    summary: 引けない線・断られる線・終端に届かないステップ・子の付け替えの問題を見分ける
    steps:
      - target: save
        title: 押せない理由はボタンに出る
        body: >-
          「この順序に決める」が押せないときは、ボタンにカーソルを合わせると理由が出ます。順序を変えていない・ccnavi の答えを待っている・提案が外で変わった・承認待ちから無くなった・順序の検査に error がある・
          子の提案を付け替えられない・改版で通らない形、のどれかです。次の手順から、図の側の理由を順に見ます。
        scene: { answer: open }
      - target: graph-plan
        title: 引けない線
        body: >-
          循環になる線（先行をたどると元のステップへ戻る線）と、子が承認された番号へ入る線は、ドラッグの最中に断られ、線になりません。放しても何も起きず、ccnavi への頼みも出ません。
          自分自身への線や、開始・終了の点への線も引けません。
        scene: { answer: open }
      - target: node-3
        title: 子が承認された番号
        body: >-
          改版の提案（承認済みの親への提案）では、子が承認された番号のステップに「子が承認済み」の印が付きます。このステップは、入る線を追加することも削除することもできません（× も出ず、左の点にも引けません）。
        scene: { answer: locked-open }
      - target: status
        title: ccnavi が断る線
        body: 引けた線でも、ccnavi が番号を振り直せないと断ることがあります。線は引く前の図のままで、断った理由が下の一行に出ます（ここは、子が承認された番号を動かさずに番号を振れない場合）。
        scene: { answer: locked-open, refused: unpackable }
      - target: notes-plan
        title: 終端に届かないステップ
        body: >-
          最後のステップには、ほかの全部が（線をたどって）先行している必要があります。ほかのステップの先行になっていないステップ（ここでは実装とテスト（3））には注意の色の線が出て、図の下に error が出て、保存できません。
          最後のステップへ線を追加するか、削除した線を戻します。
        scene: { answer: loose }
      - target: problems
        title: 子が承認されたステップの先行が変わる
        body: >-
          子が承認されたステップは、上流の線を変えて先行が変わる形も通りません。理由は図の上の一覧に出て、保存できません。ここでは調査（1）→ 設計（2）を削除したため、実装とテスト（3）の先行が変わります。
          削除した線を戻します。
        scene: { answer: locked-cut }
      - target: problems
        title: 子の提案を付け替えられない
        body: >-
          番号が変わるとき、付け替え先の識別子がすでにある・承認済みの側が付け替える識別子を指す、などでは何も反映できません。一覧の 1 行ずつが原因です。
          計画にない phase の子の提案は、知らせるだけで保存は止めません。この画面からは直せないので、手で直すか、取り消して出し直します。
        scene: { answer: child-problems }

  - id: tools
    title: 「案に戻す」「並べ直す」「再読込」を使い分けたいとき
    summary: 戻す・組み直す・再読み込みするの違い
    steps:
      - target: relayout
        title: 並べ直す
        body: 今の線で点の置き場所を組み直します。番号も線も変わりません。線を変えて図が見づらくなったときに使います。置き場所は保存しません。
        scene: { answer: swap }
      - target: revert
        title: 案に戻す
        body: 引いた線も番号の振り直しも捨てて、画面を開いたときの順序（提案に記載されている順序）へ戻します。ccnavi への往復はありません。線を変えていないときは押せません。
        scene: { answer: swap }
      - target: reload
        title: 再読込
        body: ccnavi に聞き直して、いま提案に記載されている順序を再読み込みします。エージェントが提案を変更したあとなどに使います。未保存の線があれば、捨ててよいかを確認します。
        scene: { answer: swap }
      - target: zoom-plan
        title: 図が見づらいとき
        body: 図の拡大・縮小・全体を表示のボタンと、図を画面いっぱいにする最大化のボタンで、見やすくします。見え方は保存する内容に関係しません。
        scene: { answer: swap }

  - id: external
    title: エージェントが提案を変更したとき
    summary: 外で変わった提案の差分を読み、取り込むか編集を続けるかを選ぶ
    steps:
      - target: changed
        title: 外で変わった知らせ
        body: >-
          開いているあいだに、エージェントが親の提案か子の提案を変更すると、この帯が出ます。変更後の提案を古い順序で上書きしないよう、保存はできなくなります。
        scene: { answer: swap, changed: outside }
      - target: changed-diff
        title: 差分を確認する
        body: 計画のステップごとに、開いたときと今の定義・先行ステップを並べます。変わらないステップは表示しません。エージェントが何を直したかを見て、取り込むかを決めます。
        scene: { answer: swap, changed: outside }
      - target: adopt
        title: 取り込む
        body: いまの提案から始め直します。未保存の線があれば捨てます（ボタンに「編集を捨てる」と出ます）。残したい線は、書き留めてから取り込みます。
        scene: { answer: swap, changed: outside }
      - target: changed
        title: 編集を続ける
        body: 「編集を続ける」を選ぶと差分が閉じ、帯の文だけが残ります。線は引き続き変えられますが、取り込むまで保存はできません。
        scene: { answer: swap, changed: outside, diff: false }
      - target: gone
        title: 承認待ちから無くなったとき
        body: 提案が承認された・取り下げられた・削除されたときは、読むだけの画面になり、理由が出ます。線は引けず、保存もできません。順序を変えたいときは、改版の提案を出してからタブを開き直します。
        scene: { answer: swap, gone: true }

  - id: approval
    title: 保存と承認の順序を知りたいとき
    summary: 未保存のあいだの承認の扱いと、保存したあとの手順
    steps:
      - target: dirty
        title: 未保存の印
        body: 線を変えて、答えが提案と違うあいだは「未保存」が出て、タブの題にも「●」が付きます。印は ccnavi の答えから決めるので、線を元に戻せば消えます。
        scene: { answer: swap }
      - target: status
        title: 答えを待つあいだも止まる
        body: >-
          線を変えた直後、ccnavi の答えが届くまでは「確認しています」と出て、線を変えられません。この間も、ボードでは承認を止めます。
          答えが届く前に承認が通ると、確認していない順序を承認することになるためです。
        scene: { answer: open, checking: true }
      - target: summary
        title: 未保存のあいだは承認できない
        body: 未保存の変更があるあいだは、チケット管理画面で、この親を含む一覧を承認できません。承認する前に、保存するか「案に戻す」で捨てます。
        scene: { answer: swap }
      - target: save
        title: 保存は承認ではない
        body: 「この順序に決める」は提案のファイルを変更するだけで、承認はしません。変更した提案はコミットされません。
        scene: { answer: swap }
      - target: summary
        title: 保存したあとの承認
        body: >-
          保存が通ったら、承認はチケット管理画面から開き直して行います。保存したあとにエージェントが提案を変更すると、承認の画面に注意が出るので、内容を確認してから承認します。
        scene: { answer: swapped-saved }
