# ルール管理画面の案内。`sample:` は案内の間だけ画面に出す見本（実際の設定ではない）。
# ルールは rules.yml と同じ書き方。判定・期待する判定・候補は実行ファイルの JSON と同じ形（足りない項目は既定値で埋まる）。
# `scene:` は手順ごとの画面の様子。手順ごとに全部を書く（前の手順を引き継がない）。
#   tab      rules / judge / hooks
#   open     開く行の id（, で区切って複数）
#   when     組み合わせ条件の図で選ぶ点（r は最上位、r.0 は 1 番目の子、r.0.1 はその中の 2 番目）
#   more     「コンテキストの追加」を開く
#   find     絞り込みの欄に入れる文字
#   tool / subject / judge   「判定を試す」の欄の値と、出す判定の結果（sample.judges の名前）
#   checked / suggested      期待する判定の一括確認・記録からの候補の結果を出す
#   fold     畳むタイプ（, で区切って複数。deny / ask / allow）。見出しを指す手順でだけ使う（畳んだ中は指せない）
#   sum      「統合結果」の枠を開き、選ぶ統合結果の名前（sample.sums の name）
#   error    保存前の検証エラーの見本（sample.save_error）を下の欄に出す
# `target:` の印（画面の data-tour）:
#   tabs / rules / find / order-hint / hooks / save / tour / target / status
#   section-<タイプ> / fold-<タイプ> / count-<タイプ> / add-<タイプ>   タイプの塊 / ▾ / 件数 / 「＋ ルールを追加」（タイプは deny・ask・allow）
#   rule-<id>   ルールの行。開いた行の中は rule-<id>-<欄>（match / type / pattern / except / message / context / every / text / once / file / once-file / to-when / buttons）
#   when-graph / when-inspector   組み合わせ条件の図と操作の欄（開いた行）
#   judge-form / judge-result / expectations / expectations-counts / expectations-result / expectation-ng / open-expectations / suggest / suggest-result / suggest-candidate   「判定を試す」タブ
#   sum / sum-pick / sum-count / sum-<タイプ>   統合結果の枠 / 選ぶ欄 / 件数 / タイプごとの表
screen: rules

sample:
  rules:
    deny:
      - id: git-push
        match: Bash
        glob: "*git push*"
        message: push はユーザが行う。ccnavi-git.sh の入口を使う
      - id: no-rm-rf
        match: Bash
        regex: '\brm\s+-rf\b'
        message: 削除する前にユーザへ確認する
      - id: protect-env
        match: Read|Edit|Write
        message: 環境変数のファイルは読まない・書かない。値が必要ならユーザに頼む
        when:
          all:
            - regex: '(^|[\\/])\.env(\.|$)'
            - not:
                any:
                  - glob: "**/.env.example"
                  - glob: "**/.env.sample"
      - id: protect-secrets
        match: Read|Edit|Write
        glob: "**/secrets/**"
        except:
          - glob: "**/secrets/README.md"
        message: 秘密の置き場は読まない・書かない。必要ならユーザに頼む
    ask:
      - id: deps-change
        match: Write|Edit
        glob: "**/pyproject.toml"
        additionalContextOnce: 依存が変わる。理由を先に伝えてから直す
        every: 1
      - id: db-migrate
        match: Bash
        regex: '\bmigrate\b'
        every: 3
        additionalContext: 本番に向けた migrate でないかを確認する
    allow:
      - id: read-docs
        match: Read
        glob: "**/docs/**"
  hooks:
    - { event: PreToolUse, matcher: "Bash|Read|Edit|Write", command: "sh .claude/hooks/ccnavi-pre.sh", timeout: 10 }
    - { event: SessionStart, matcher: "", command: "sh .claude/hooks/ccnavi-start.sh", timeout: 30 }
  judges:
    env-read:
      tool: Read
      subject: /ws/.env
      verdict: deny
      code: DENY_COMMAND_PATTERN
      rules:
        - { id: protect-env, source: file, section: deny, kind: when, written: "all(regex …, not(any(2)))" }
      response: "[ccnavi] DENY (rule: protect-env)\n環境変数のファイルは読まない・書かない。値が必要ならユーザに頼む"
    env-example:
      tool: Read
      subject: /ws/.env.example
      verdict: ""
      code: ""
      rules: []
      response: ""
    git-push:
      tool: Bash
      subject: git push origin main
      verdict: deny
      code: DENY_COMMAND_PATTERN
      rules:
        - { id: git-push, source: file, section: deny, kind: glob, written: "*git push*" }
      response: "[ccnavi] DENY (rule: git-push)\npush はユーザが行う。ccnavi-git.sh の入口を使う"
    rm-rf:
      tool: Bash
      subject: rm -rf build
      verdict: deny
      code: DENY_COMMAND_PATTERN
      rules:
        - { id: no-rm-rf, source: file, section: deny, kind: regex, written: '\brm\s+-rf\b' }
      response: "[ccnavi] DENY (rule: no-rm-rf)\n削除する前にユーザへ確認する"
    db-migrate:
      tool: Bash
      subject: python manage.py migrate
      verdict: ask
      code: RULE_ASK
      rules:
        - { id: db-migrate, source: file, section: ask, kind: regex, written: '\bmigrate\b' }
      response: "[ccnavi] RULE_ASK (rule: db-migrate)\n本番に向けた migrate でないかを確認する"
    secrets-key:
      tool: Read
      subject: /ws/secrets/key.pem
      verdict: deny
      code: DENY_COMMAND_PATTERN
      rules:
        - { id: protect-secrets, source: file, section: deny, kind: glob, written: "**/secrets/**" }
      response: "[ccnavi] DENY (rule: protect-secrets)\n秘密の置き場は読まない・書かない。必要ならユーザに頼む"
    secrets-readme:
      tool: Read
      subject: /ws/secrets/README.md
      verdict: ""
      code: ""
      rules: []
      response: ""
    npm-install:
      tool: Bash
      subject: npm install left-pad
      verdict: ask
      code: RULE_ASK
      rules:
        - { id: suggest-npm-install, source: file, section: ask, kind: regex, written: '\bnpm\s+install\b' }
      response: "[ccnavi] RULE_ASK (rule: suggest-npm-install)"
  checked:
    root: /ws
    expectations_path: /ws/.ccnavi/config/common/rule-expectations.yml
    counts:
      deny: { ok: 2, total: 2 }
      ask: { ok: 1, total: 1 }
      allow: { ok: 1, total: 2 }
    mismatches: 1
    expectations:
      - { expected: deny, tool: Read, subject: /ws/.env, why: 環境変数は読ませない, verdict: deny, known: true, ok: true, rules: [{ id: protect-env, source: file, section: deny, kind: when, written: "all(regex …, not(any(2)))" }] }
      - { expected: deny, tool: Bash, subject: git push origin main, why: push はユーザが行う, verdict: deny, known: true, ok: true, rules: [{ id: git-push, source: file, section: deny, kind: glob, written: "*git push*" }] }
      - { expected: ask, tool: Bash, subject: python manage.py migrate, why: 本番に向けた migrate は確認する, verdict: ask, known: true, ok: true, rules: [{ id: db-migrate, source: file, section: ask, kind: regex, written: '\bmigrate\b' }] }
      - { expected: allow, tool: Read, subject: /ws/docs/guide.md, why: docs は読んでよい, verdict: allow, known: true, ok: true, rules: [{ id: read-docs, source: file, section: allow, kind: glob, written: "**/docs/**" }] }
      - { expected: allow, tool: Read, subject: /ws/.env.example, why: 見本は読んでよい, verdict: "", known: true, ok: false, rules: [] }
  suggested:
    root: /ws
    records: 14
    logs: [/ws/logs/decisions.jsonl]
    candidates:
      - kind: rule
        section: ask
        id: suggest-npm-install
        tool: Bash
        count: 6
        summary: "ルールを追加する候補: Bash の npm install が 6 回、どのルールにもヒットせず権限モードへ渡った"
        layer: common
        rules_path: /ws/.ccnavi/config/common/rules.yml
        expectations:
          - { tool: Bash, subject: npm install left-pad, why: 記録で、どのルールも言及せず権限モードへ渡った形（npm install） }
        yaml: "rules:\n  ask:\n    - id: suggest-npm-install\n      match: Bash\n      regex: '\\bnpm\\s+install\\b'\nexpectations:\n  ask:\n    - tool: Bash\n      subject: npm install left-pad\n      why: 記録で、どのルールも言及せず権限モードへ渡った形（npm install）\n"
      - kind: message
        section: deny
        id: git-push
        tool: Bash
        count: 3
        summary: "message を見直す候補: git-push が同じ呼び出しを繰り返し止めた（3 回）。文面から次の一手が読めていない疑い"
        layer: common
        rules_path: /ws/.ccnavi/config/common/rules.yml
        expectations:
          - { tool: Bash, subject: git push origin main, why: 同じ呼び出しを繰り返し止めた形 }
        yaml: "rules:\n  deny:\n    - id: git-push\n      match: Bash\n      glob: '*git push*'\n      message: push はユーザが行う。ccnavi-git.sh の入口を使う\nexpectations:\n  deny:\n    - tool: Bash\n      subject: git push origin main\n      why: 同じ呼び出しを繰り返し止めた形\n"
  save_error: "設定の検証（--lint）でエラーが見つかりました。内容を修正してから保存してください:\nerror: db-migrate: ask に message がある"
  sums:
    - name: self
      layers: [common, self]
      rules:
        path: .ccnavi/config/project/rules.yml
        deny:
          - { id: git-push, section: deny, source: common, match: Bash, kind: glob, written: "*git push*", pattern: '(?s:(?>.*?git\ push).*)\Z', message: push はユーザが行う。ccnavi-git.sh の入口を使う }
          - { id: no-rm-rf, section: deny, source: common, match: Bash, kind: regex, written: '\brm\s+-rf\b', pattern: '\brm\s+-rf\b', message: 削除する前にユーザへ確認する }
          - { id: "self:protect-secrets", section: deny, source: self, match: Read|Edit|Write, kind: glob, written: "**/secrets/**", pattern: '(?s:(?>.*?[\\/]secrets[\\/]).*)\Z', message: 秘密の置き場は読まない・書かない。必要ならユーザに頼む }
        ask:
          - { id: "self:db-migrate", section: ask, source: self, match: Bash, kind: regex, written: '\bmigrate\b', pattern: '\bmigrate\b', message: "" }
        allow:
          - { id: read-docs, section: allow, source: common, match: Read, kind: glob, written: "**/docs/**", pattern: '(?s:(?>.*?[\\/]docs[\\/]).*)\Z', message: "" }
    - name: web
      layers: [common, web]
      rules:
        path: projects/web/.ccnavi/config/project/rules.yml
        deny:
          - { id: git-push, section: deny, source: common, match: Bash, kind: glob, written: "*git push*", pattern: '(?s:(?>.*?git\ push).*)\Z', message: push はユーザが行う。ccnavi-git.sh の入口を使う }
          - { id: no-rm-rf, section: deny, source: common, match: Bash, kind: regex, written: '\brm\s+-rf\b', pattern: '\brm\s+-rf\b', message: 削除する前にユーザへ確認する }
          - { id: "web:no-prod-deploy", section: deny, source: web, match: Bash, kind: glob, written: "*deploy --prod*", pattern: '(?s:(?>.*?deploy\ --prod).*)\Z', message: 本番への配備はユーザが行う }
        ask:
          - { id: "web:npm-install", section: ask, source: web, match: Bash, kind: regex, written: '\bnpm\s+install\b', pattern: '\bnpm\s+install\b', message: "" }
        allow:
          - { id: read-docs, section: allow, source: common, match: Read, kind: glob, written: "**/docs/**", pattern: '(?s:(?>.*?[\\/]docs[\\/]).*)\Z', message: "" }

# 案内の手順が引く時系列の図。登場者を左から並べ、矢印を上から下へ時間順に並べる。矢印の `value` は実際に入れる値や出る答えの例（等幅）。
# 手順の `diagram:` で名前を指し、`focus:` で光らせる矢印（id を , で区切る）を決める。`to` を書かない矢印は、その登場者の中の動き。
diagrams:
  # ルールを書いて保存し、次のツール呼び出しから効くまで
  rule-save:
    actors: [ユーザ, ルール管理画面, ccnavi, rules.yml]
    steps:
      - id: edit
        from: ユーザ
        to: ルール管理画面
        text: deny に 1 件書き足す
        value: |-
          id: git-push
          match: Bash
          glob: "*git push*"
          message: push はユーザが行う
      - id: save
        from: ルール管理画面
        to: ccnavi
        text: ［保存］を押すと、編集中の内容を一時ファイルに書いて検証する（--lint）
        value: error が 1 件でもあれば保存しない（warn だけなら保存する）
      - id: lock
        from: ルール管理画面
        text: 作業中のチケット（doing）があると、進行中の作業の判定が途中で変わるため保存できない。エージェントがターン中なら、確認が出る
      - id: write
        from: ルール管理画面
        to: rules.yml
        text: 検証を通ったら書き込む
        value: .ccnavi/config/common/rules.yml（共通の設定を開いているとき）
      - id: effect
        from: ccnavi
        to: rules.yml
        text: 次にツールを使うとき、hook が rules.yml を読み直す
        value: Claude Code の再起動は要らない

  # 値がヒットして止まる例（git push）
  rule-deny:
    actors: [Claude Code, ccnavi（hook）, rules.yml, decisions.jsonl]
    steps:
      - id: call
        from: Claude Code
        to: ccnavi（hook）
        text: ツールを使う直前に、hook を起こして内容を渡す
        value: '{"tool_name":"Bash","tool_input":{"command":"git push origin main"}}'
      - id: load
        from: ccnavi（hook）
        to: rules.yml
        text: ルールを読む（共通・ワークスペース・プロジェクトの設定の和）
      - id: match
        from: ccnavi（hook）
        text: deny → ask → allow の順に適用する
        value: |-
          match: Bash ✓
          glob: "*git push*" ✓
          → deny にヒットする
      - id: reply
        from: ccnavi（hook）
        to: Claude Code
        text: 止める答えを返す
        value: |-
          permissionDecision: deny
          reason: push はユーザが行う
      - id: log
        from: ccnavi（hook）
        to: decisions.jsonl
        text: 返す前に、判定を 1 行追記する
        value: 'decision: deny'
      - id: stop
        from: Claude Code
        text: コマンドは実行されない。reason（message）がモデルに届き、モデルは別の手を考える

  # 値がヒットしない例（git status）
  rule-pass:
    actors: [Claude Code, ccnavi（hook）]
    steps:
      - id: call
        from: Claude Code
        to: ccnavi（hook）
        text: 別のコマンドを使う直前
        value: '{"tool_name":"Bash","tool_input":{"command":"git status"}}'
      - id: match
        from: ccnavi（hook）
        text: どのルールにもヒットしない
        value: glob "*git push*" は "git status" に合わない
      - id: reply
        from: ccnavi（hook）
        to: Claude Code
        text: 判定を返さない（UNDECLARED）。「許可」ではない
        value: 結末は権限モードで決まる。default なら Claude Code 自身の確認に任せる

  # 組み合わせ条件: 同じルールが、入れる値で止めたり通したりする
  rule-when:
    actors: [Claude Code, ccnavi（hook）]
    steps:
      - id: call-env
        from: Claude Code
        to: ccnavi（hook）
        text: 環境変数のファイルを読もうとする
        value: Read /ws/.env
      - id: match-env
        from: ccnavi（hook）
        text: protect-env の when（all）を調べる
        value: |-
          regex (^|[\\/])\.env(\.|$) ✓
          not(any(glob **/.env.example, glob **/.env.sample)) ✓
          → 両方成り立つ → deny
      - id: call-example
        from: Claude Code
        to: ccnavi（hook）
        text: 見本のファイルを読もうとする
        value: Read /ws/.env.example
      - id: match-example
        from: ccnavi（hook）
        text: 同じルールを調べる
        value: |-
          regex (^|[\\/])\.env(\.|$) ✓
          not(any(glob **/.env.example …)) ✗（.env.example に合うので、not は成り立たない）
          → all は成り立たない → ヒットしない（通る）

  # 動作モード: 同じ呼び出しでも、モードで止まる・止まらないが分かれる
  rule-mode:
    actors: [Claude Code, ccnavi（hook）]
    steps:
      - id: call
        from: Claude Code
        to: ccnavi（hook）
        text: 動作モードが dry-run のとき、同じコマンドを使う
        value: '{"tool_name":"Bash","tool_input":{"command":"git push origin main"}}'
      - id: match
        from: ccnavi（hook）
        text: 判定は enable と同じで deny にヒットする。記録も同じ形で残す
        value: 'decision: deny, enforced: false'
      - id: reply
        from: ccnavi（hook）
        to: Claude Code
        text: 止めずに、止めるはずだったと知らせる文だけを返す
        value: '[ccnavi dry-run] enable would have stopped … （additionalContext）'
      - id: run
        from: Claude Code
        text: コマンドは実行される。enable に切り替えると、前の図のとおり止まる

  # 判定を試す: 実際のツールは動かない
  rule-try:
    actors: [ユーザ, ルール管理画面, ccnavi]
    steps:
      - id: input
        from: ユーザ
        to: ルール管理画面
        text: ツールと対象を入れて［判定］を押す。保存は要らない
        value: |-
          ツール: Bash
          対象: git push origin main
      - id: ask
        from: ルール管理画面
        to: ccnavi
        text: 編集中のルールで判定させる（--test）
      - id: answer
        from: ccnavi
        to: ルール管理画面
        text: hook と同じ経路で判定した答えを返す。コマンドは実行しない
        value: |-
          判定: deny
          ヒットしたルール: git-push
          message: push はユーザが行う
      - id: note
        from: ルール管理画面
        text: 常に enable の答え。記録（decisions.jsonl）は残らず、every の回数も数えない

  # コンテキストの追加: 3 回に 1 度だけ文が届く
  rule-context:
    actors: [Claude Code, ccnavi（hook）, state ファイル]
    steps:
      - id: call-1
        from: Claude Code
        to: ccnavi（hook）
        text: ルールにヒットするコマンドを使う（1 回目）
        value: pytest tests/core
      - id: count-1
        from: ccnavi（hook）
        to: state ファイル
        text: ヒットした回数を 1 にする。3 の倍数ではないので、文は渡さない
        value: 'every: 3'
      - id: call-3
        from: Claude Code
        to: ccnavi（hook）
        text: 3 回目に同じルールへヒットする
        value: pytest tests/ui
      - id: count-3
        from: ccnavi（hook）
        to: state ファイル
        text: 回数が 3 になる
      - id: deliver
        from: ccnavi（hook）
        to: Claude Code
        text: 3 の倍数なので、additionalContext をモデルに渡す
        value: additionalContext：テストは tests/ に置く

courses:
  - id: intro
    title: 基本の案内
    summary: 画面の見どころを順に回ります
    steps:
      - target: tabs
        title: 3 つのタブ
        body: 「ルール」タブでは deny・ask・allow のルールを確認して直せます。「判定を試す」タブでは、編集中のルールで判定を試せます。「hook」タブでは登録内容を確認できます。
        scene: { tab: rules }
      - target: rules
        title: ルール
        body: deny（止める）・ask（確認する）・allow（通す）のタイプごとに並びます。判定は強い順に deny > ask > allow です。行を押すと欄が開き、「＋ ルールを追加」で追加できます。見出しの ▾ でタイプを畳めます。
        scene: { tab: rules, open: git-push }
      - target: find
        title: 絞り込み
        body: id・ツール・パターン・メッセージで絞り込みます。畳んだタイプの中も探します。
        scene: { tab: rules, find: env }
      - target: judge-form
        title: 判定を試す
        body: ツールと対象（コマンドやパス）を入れて「判定」を押すと、編集中の内容でどのルールにヒットするかを実行ファイルが返します。保存は不要です。「期待する判定を一括で確認する」は、期待する判定のファイルに並べた例をまとめて確認します。
        scene: { tab: judge, tool: Bash, subject: git push origin main, judge: git-push }
      - target: hooks
        title: hook
        body: .claude/settings.json に登録された hook の一覧です。直すときは settings.json を開いて編集してください。
        scene: { tab: hooks }
      - target: save
        title: 保存
        body: 保存すると、実行ファイルが検証し、通ればファイルに反映します。通らなければ、下に理由が出ます。ファイルが外で変わったときは上に帯が出るので、更新してください。
        scene: { tab: rules }
      - target: tour
        title: 案内
        body: ヘッダ右上の ? を押すと、基本の案内と、使い方ごとの案内を選べます。
        scene: { tab: rules }

  - id: how-it-works
    title: ルールが、いつ・どう効くのかを値の例で知りたいとき
    summary: 同じ流れでも、入れる値で止まったり通ったりする様子を、例を変えて追う
    steps:
      - target: rule-git-push
        title: 例のルール
        body: 「Bash で git push を含むコマンドは止める」というルールで追います。保存すると、次にツールを使う場面から効きます。
        scene: { tab: rules, open: git-push }
        diagram: rule-deny
      - target: hooks
        title: ツールを使う直前に hook が起きる
        body: Claude Code は、ツールを使う直前に、登録された hook を起こして内容を渡します。hook は、毎回ルールを読み直します。
        scene: { tab: hooks }
        diagram: rule-deny
        focus: call, load
      - target: hooks
        title: 値がルールにヒットすると、止める
        body: コマンドが git push origin main なので、match の Bash と、glob の *git push* の両方にヒットします。deny → ask → allow の順に適用し、最初にヒットしたタイプで決まります。止める答えには、message が理由として付きます。
        scene: { tab: hooks }
        diagram: rule-deny
        focus: match, reply
      - target: hooks
        title: 記録して、止める
        body: hook は、答えを返す前に判定を logs/decisions.jsonl に 1 行足します。コマンドは実行されず、message がモデルに届きます。
        scene: { tab: hooks }
        diagram: rule-deny
        focus: log, stop
      - target: rules
        title: 別の値ならヒットしない
        body: git status は、*git push* に合いません。どのルールにもヒットしないときは、判定を返しません。これは「許可」ではなく、権限モードに従います。
        scene: { tab: rules }
        diagram: rule-pass
        focus: match, reply
      - target: rule-protect-env
        title: 組み合わせ条件は、値で結果が分かれる
        body: protect-env は「.env 系は止める。ただし .env.example と .env.sample は通す」という 1 つのルールです。同じルールが、.env は止め、.env.example は通します。
        scene: { tab: rules, open: protect-env, when: r }
        diagram: rule-when
        focus: match-env, match-example
      - target: hooks
        title: 動作モードで、止まるかどうかが変わる
        body: CCNAVI_MODE が dry-run のときは、同じ deny にヒットしても止まらず、止めるはずだったという文だけが返ります。「判定を試す」は、常に enable の答えを返すので、実際の動きと食い違うことがあります。
        scene: { tab: hooks }
        diagram: rule-mode
        focus: reply, run

  - id: how-save-try
    title: 保存してから効くまでと、試すときの違いを知りたいとき
    summary: 保存で何が検証され、いつから効くか。「判定を試す」と本番の違いと、文を 3 回に 1 度だけ渡す設定
    steps:
      - target: rules
        title: ルールを書く
        body: ここでは、deny に git-push のルールを 1 件足します。書いている間は「未保存」の印が付くだけで、ファイルも hook も変わりません。
        scene: { tab: rules, open: git-push }
        diagram: rule-save
        focus: edit
      - target: save
        title: 保存すると、まず検証される
        body: ［保存］を押すと、編集中の内容を一時ファイルに書いて、実行ファイルが検証します。error が 1 件でもあれば、何も保存しません。作業中のチケットがあるときは保存できません。エージェントがターン中なら、確認が出ます。
        scene: { tab: rules, open: git-push }
        diagram: rule-save
        focus: save, lock
      - target: save
        title: 書き込まれて、次から効く
        body: 検証を通ると、rules.yml に書き込みます。hook はツールを使うたびにファイルを読み直すので、Claude Code を再起動しなくても、次のツール呼び出しから効きます。ワークツリーで直したルールは、統合するまで効きません。
        scene: { tab: rules, open: git-push }
        diagram: rule-save
        focus: write, effect
      - target: judge-form
        title: 保存しないで試す
        body: 「判定を試す」は、編集中の内容で判定します。保存は要りません。実際のコマンドは動かず、記録も残りません。ここでの答えは常に enable のものです。
        scene: { tab: judge, tool: Bash, subject: git push origin main, judge: git-push }
        diagram: rule-try
        focus: input, ask, answer, note
      - target: rule-db-migrate
        title: 文を 3 回に 1 度だけ渡す
        body: "every: 3 を付けたルールは、ヒットした回数が 3 の倍数になった回にだけ、additionalContext をモデルに渡します。「判定を試す」は回数を数えないので、毎回文が出ます。本番との違いに注意してください。"
        scene: { tab: rules, open: db-migrate, more: true }
        diagram: rule-context
        focus: count-1, count-3, deliver

  - id: combo-when
    title: 組み合わせ条件を設定する
    summary: 「.env は止める。ただし .env.example は通す」のように、複数の条件を all / any / not で組み合わせる
    steps:
      - target: rule-protect-env
        title: 組み合わせ条件のルール
        body: glob や regex が 1 つでは表現できない条件は、組み合わせ条件（when）で記述できます。畳んだ行には、条件を 1 行に縮めた形（all(regex …, not(any(2)))）が出ます。この例は「.env 系のファイルにヒットし、かつ .env.example / .env.sample ではない」です。
        scene: { tab: rules }
      - target: rule-protect-env
        title: 図で見る
        body: 行を開くと、条件が図になります。左端の点が最上位で、右へ枝分かれします。all は「すべての条件に一致」、any は「いずれかの条件に一致」、not は「指定した条件に一致しない」を表します。
        scene: { tab: rules, open: protect-env, when: r }
      - target: when-graph
        title: 点を選んで直す
        body: ノードをクリックすると選択され、下の編集欄でそのノードの条件を変更できます。ここでは .env 系に一致させる regex の点を選んでいます。文字を直すと、その場で図と要約に反映されます。
        scene: { tab: rules, open: protect-env, when: r.0 }
      - target: when-inspector
        title: 子を追加する・削除
        body: all / any の点を選ぶと「＋ glob」「＋ regex」「＋ all」「＋ any」「＋ not」で子を追加できます。例えば any に「＋ glob」を追加すれば、通す例外が 1 つ増えます。「ノードを削除」で削除できます。
        scene: { tab: rules, open: protect-env, when: r.1.0 }
      - target: when-inspector
        title: 包む・種類を替える
        body: 「all で包む」「any で包む」「not で包む」で、選んだ点を新しい演算子の中へ入れられます。glob と regex、all と any は、種類の欄で入れ替えられます。
        scene: { tab: rules, open: protect-env, when: r.1 }
      - target: judge-form
        title: 判定で確認する
        body: 組み合わせ条件は入力しただけでは意図どおりか分かりません。「判定を試す」で、止めたい例（.env）と通したい例（.env.example）を入力して確認します。保存は不要です。
        scene: { tab: judge, tool: Read, subject: /ws/.env, judge: env-read }
      - target: judge-form
        title: 通す例を確認する
        body: .env.example はどのルールにもヒットせず、判定の対象外（そのまま通る）になります。
        scene: { tab: judge, tool: Read, subject: /ws/.env.example, judge: env-example }
      - target: save
        title: 保存
        body: 保存すると、実行ファイルが検証し、通ればファイルに反映します。空の演算子や、中が空の not のような誤りは、図の下に並んで保存前の検証で止まります。
        scene: { tab: rules, open: protect-env }

  - id: add-rule
    title: ルールを新しく追加して、ツールと glob / regex を決めたいとき
    summary: タイプを選んで行を追加し、ツールとパターンと message を入力して、判定で確認する
    steps:
      - target: add-deny
        title: 追加するタイプを選ぶ
        body: ルールは deny（止める）・ask（確認する）・allow（通す）のどれかに追加します。タイプの見出しにある「＋ ルールを追加」を押すと、空の行が開いた状態で末尾に追加され、id の欄にカーソルが移ります。id はルールの名前で、判定の結果や記録にも出ます。タイプはあとから行の中の「タイプ」で替えられます。
        scene: { tab: rules }
      - target: rule-git-push-match
        title: ツールを決める
        body: 「ツール」の欄は押すと選択肢が出ます。Bash・Read・Edit のようにチェックを入れて選ぶと、複数なら Write|Edit の形で 1 つの欄に入ります。候補は判定が対象を取り出せるツールです。一覧にない名前は「新しいツール名」で追加できますが、判定には届かずヒットしません。
        scene: { tab: rules, open: git-push }
      - target: rule-git-push-pattern
        title: glob で記述する
        body: パターンは種類（glob か regex）と式で決めます。glob は * が「何でも」を表し、*git push* は「git push を含むコマンド」にヒットします。短く記述できますが、legit push のように語の途中にもヒットします。
        scene: { tab: rules, open: git-push }
      - target: rule-no-rm-rf-pattern
        title: regex で記述する
        body: 語の切れ目まで決めたいときは regex を使います。\brm\s+-rf\b は、rm と -rf が語として並ぶときだけにヒットします。種類の欄で glob と regex を替えられます。式の誤りは、保存前の検証で止まります。
        scene: { tab: rules, open: no-rm-rf }
      - target: rule-git-push-message
        title: 止めるときの言葉を入力する
        body: deny には message を入力します。止められたモデルに届く文なので、なぜ止めたかと、代わりに何をすればよいかを入力します。ask と allow に message を入力すると、どこにも届かない（ask はユーザの確認ダイアログにしか出ない）ので lint が error にします。渡したい文は「コンテキストの追加」に入力します。
        scene: { tab: rules, open: git-push }
      - target: judge-form
        title: 判定で確認する
        body: 入力したら「判定を試す」で、止めたい例（git push origin main）を入力します。保存しなくても、編集中のルールでどのルールにヒットし、どのメッセージが返るかを実行ファイルが調べて表示します。
        scene: { tab: judge, tool: Bash, subject: git push origin main, judge: git-push }
      - target: save
        title: 保存
        body: 保存すると、実行ファイルが検証し、通ればファイルに反映します。誤りがあれば何も保存せず、下に理由が出ます。
        scene: { tab: rules, open: git-push }

  - id: context-every
    title: 何回に 1 度、どんな文をモデルに渡すかを決めたいとき
    summary: every と additionalContext / additionalContextOnce で、渡す回と文を決める
    steps:
      - target: rule-db-migrate
        title: 畳んだ行で見分ける
        body: 畳んだ行の右に「3 回ごと」のようなバッジと、コンテキストの追加がある印が出ます。見本では db-migrate が 3 回に 1 度、deps-change が 1 回ごと（ヒットするたび）に文を渡します。
        scene: { tab: rules }
      - target: rule-db-migrate-context
        title: コンテキストの追加
        body: 文を渡したいルールは、行の中の「コンテキストの追加」を開きます。message が止められた側への言葉なのに対し、ここはツールの実行を許可する際に、エージェントへ伝える注意事項や補足を入力する欄で、どのタイプにも入力できます。渡す間隔（every）と、補足文を記載したファイルのパスを指定する欄もあります。
        scene: { tab: rules, open: db-migrate, more: true }
      - target: rule-db-migrate-every
        title: every で何回に 1 度かを決める
        body: 'every: 3 は、そのルールがヒットした回数が 3 の倍数になった回だけを「渡す回」にします（3・6・9 回目）。空なら毎回です。数えるのはヒットした回数で、セッションの開始（起動・再開・compact の後）で 0 に戻ります。0 や整数でない値は lint の error です。'
        scene: { tab: rules, open: db-migrate, more: true }
      - target: rule-db-migrate-text
        title: 渡す回のたびに届く文
        body: additionalContext は、渡す回のたびに届く文です。短く、次の行動に直結する一言にします。ask のルールでは、ユーザが確認で Yes を押したときだけ届き、No なら届きません。
        scene: { tab: rules, open: db-migrate, more: true }
      - target: rule-deps-change-once
        title: 最初の 1 回だけ届く文
        body: additionalContextOnce は、セッションで最初に渡す回にだけ届く文で、長い背景の説明に向きます。additionalContext と両方入力すると、初回は 2 つを空行で並べて届き、2 回目からは additionalContext だけが届きます。every を指定すると、1 回目ではなく N 回目に届きます。
        scene: { tab: rules, open: deps-change, more: true }
      - target: rule-deps-change-file
        title: 長い文はファイルで渡す
        body: 文が長いときは、additionalContextFile（毎回）と additionalContextOnceFile（最初の 1 回）に、補足文を記載したファイルのパスを指定できます。先頭 4000 文字までが届きます。「選択…」でダイアログからも選べます。
        scene: { tab: rules, open: deps-change, more: true }
      - target: judge-result
        title: 届く文を判定で確認する
        body: 「判定を試す」の結果の「返すメッセージ」に、入力した文が何と一緒に届くかが出ます。every で間引くかどうかは、実際にヒットした回数で決まるので、ここで確認できるのは文の中身と、ヒットするルールです。
        scene: { tab: judge, tool: Bash, subject: python manage.py migrate, judge: db-migrate }

  - id: check-expectations
    title: 期待する判定をまとめて確認したいとき
    summary: 期待する判定のファイルに並べた例を、編集中のルールで一括で判定する
    steps:
      - target: expectations
        title: 一括で確認する
        body: 「期待する判定を一括で確認する」は、期待する判定のファイルに並べた例を、編集中のルールでまとめて判定します。例は、deny なら止まるはず、ask ならユーザに確認が出るはず、allow なら通るはず、という期待です。ルールを直したあとの確認に、1 件ずつ入力する代わりに使います。
        scene: { tab: judge }
      - target: open-expectations
        title: 期待する例を追加する
        body: 例は「エディタで開く」で期待する判定のファイルを開いて追加します。ルールを 1 件追加したら、その例も 1 行追加しておくと、あとから読む人に何のためのルールかが伝わります。ツールと対象（コマンドやパス）と、理由を入力します。
        scene: { tab: judge }
      - target: expectations-counts
        title: 件数で全体を見る
        body: 結果の上に、タイプごとの一致数（deny 2/2 など）と不一致の件数が並びます。保存していなくても、編集中のルールでの結果です。
        scene: { tab: judge, checked: true }
      - target: expectation-ng
        title: 食い違いを確認する
        body: 食い違った行は赤く出ます。この例は、allow を期待した .env.example が、どの allow にもヒットせず判定の対象外になっています。期待が正しければ allow のルールを追加し、期待が古ければ例を直します。
        scene: { tab: judge, checked: true }
      - target: expectations-result
        title: ヒットしたルールも見る
        body: 「ヒットしたルール」の列で、どのルールが効いたかが読めます。期待と合っていても、意図したルールではなく別のルールにヒットしていないかを確認します。
        scene: { tab: judge, checked: true }
      - target: save
        title: 合ったら保存する
        body: 例がすべて合ったら保存します。一括の確認は保存を待たないので、直しては確認する、を保存の前に繰り返せます。
        scene: { tab: judge, checked: true }

  - id: suggest-rule
    title: 記録から候補を出して、下書きをルールにしたいとき
    summary: 判定の記録から deny / ask の下書きを作り、ルールに転記して確認する
    steps:
      - target: suggest
        title: 記録から候補を出す
        body: 「記録から候補を出す」は、判定の記録（logs/decisions.jsonl）を集計して、deny / ask のルールの下書きを作ります。どのルールにもヒットせず権限モードへ渡った呼び出しが同じ形で 5 回以上あると、その形にルールを追加する候補になります。保存済みのルールで確認するので、編集中の内容は使いません。
        scene: { tab: judge }
      - target: suggest-result
        title: 結果の読み方
        body: 読んだ記録の本数と行数、候補の数が出ます。「検証を通らず除いたもの」は、lint と期待する判定を通らず出さなかった数です。候補はすべて下書きです。確認して設定に反映するのはユーザです。
        scene: { tab: judge, suggested: true }
      - target: suggest-candidate
        title: 候補 1 件の中身
        body: '候補は、種類（ルールを追加する・message を見直す）・タイプ・id と、根拠の一言、下書きの YAML です。下書きは、rules.yml に追加する rules: と、期待する判定のファイルに追加する expectations: の組です。ルールを追加する候補は ask で出ます（記録から通す側は勧めません）。message を見直す候補は、同じ呼び出しを deny が繰り返し止めたときに出ます。'
        scene: { tab: judge, suggested: true }
      - target: add-ask
        title: 下書きをルールに転記する
        body: 下書きは自動では保存されません。「＋ ルールを追加」で行を追加し、下書きの id・ツール・パターンを転記します。置き先は候補に示されたレイヤーのファイルなので、いま編集している設定と同じかを確認します。ふさわしくなければ追加しなくて構いません。
        scene: { tab: rules }
      - target: judge-form
        title: 転記したら判定で確認する
        body: 下書きの例（npm install left-pad）を「判定を試す」に入力し、期待したタイプ（ask）でヒットするかを確認します。
        scene: { tab: judge, tool: Bash, subject: npm install left-pad, judge: npm-install }
      - target: open-expectations
        title: 期待する例も追加する
        body: '下書きの expectations: は、期待する判定のファイルをエディタで開いて追加します。あとで「期待する判定を一括で確認する」に利用できます。'
        scene: { tab: judge, suggested: true }
      - target: save
        title: 保存
        body: 確認したら保存します。
        scene: { tab: rules }

  - id: except-to-when
    title: 除外（except）を組み合わせ条件へ移したいとき
    summary: 「A だが B は除く」の except を、when の not の中へ変換して、図で編集できるようにする
    steps:
      - target: rule-protect-secrets
        title: 除外を持つルール
        body: except に並べた glob / regex は、「本体にヒットしても、どれかにヒットすればそのルールはヒットしない」という除外です。畳んだ行には「除外 1」と出ます。見本の protect-secrets は、secrets の下は止めるが、README.md だけ除きます。
        scene: { tab: rules }
      - target: rule-protect-secrets-except
        title: 画面では編集しない
        body: 行を開くと「除外」の欄に除外が出ます。ここは見せるだけで、画面では編集できません。ルールファイルで直すか、組み合わせ条件の中へ移します。
        scene: { tab: rules, open: protect-secrets }
      - target: rule-protect-secrets-to-when
        title: 組み合わせ条件に変換する
        body: '「組み合わせ条件に変換」を押すと、パターンと除外が同じ意味の組み合わせ条件になります。除外は not の中の any に移り、保存時に except: は消えます。glob と regex を両方指定している、除外が読み込めないなど、そのまま移せないときはボタンが押せません。理由はボタンの説明に出ます。'
        scene: { tab: rules, open: protect-secrets }
      - target: when-graph
        title: 変換したあとの形
        body: 変換したあとは、見本の protect-env と同じ形になります。左端の all の下に、本体の条件と、not の中の any（除外）が並びます。図の点を選べば、除外を追加したり削除したりできます。
        scene: { tab: rules, open: protect-env, when: r }
      - target: judge-result
        title: 止める例を確認する
        body: 意味が変わっていないことを判定で確認します。まず止めたい例（secrets の下の key.pem）が、変換後も deny にヒットすることを見ます。
        scene: { tab: judge, tool: Read, subject: /ws/secrets/key.pem, judge: secrets-key }
      - target: judge-form
        title: 除く例を確認する
        body: 次に除外の例（secrets/README.md）を入力します。除外にヒットするので、どのルールにもヒットせず、判定の対象外になります。
        scene: { tab: judge, tool: Read, subject: /ws/secrets/README.md, judge: secrets-readme }
      - target: save
        title: 保存
        body: '保存すると、except: の代わりに when: として保存されます。組み合わせ条件から glob / regex 1 つへは戻せないので、保存の前に判定で確認します。'
        scene: { tab: rules, open: protect-secrets }

  - id: read-sum
    title: 共通の設定との統合結果を確認したいとき
    summary: 実際に効くルールは、共通の設定と 1 つの設定の和。統合結果の枠で、由来と件数を読む
    steps:
      - target: sum
        title: 統合結果とは
        body: 判定に効くルールは、共通の設定と、ひとつの設定（ワークスペースかプロジェクト）のルールの和です。「統合結果」の枠は、その和を実行ファイルが出した結果のまま表示します。読み取り専用で、保存済みの内容の和なので、編集中の内容は含みません。
        scene: { tab: rules, sum: web }
      - target: sum-pick
        title: 統合結果を選ぶ
        body: 選ぶ欄で、統合結果（共通 + ワークスペース）と、プロジェクトの統合結果（共通の設定 + そのプロジェクトの設定）を切り替えます。パスを持たないツール（Bash など）に適用されるのは、全プロジェクトの設定を合算した和ではありません。
        scene: { tab: rules, sum: web }
      - target: sum-count
        title: 件数と追加されたレイヤー
        body: 件数の横に、追加されたレイヤーが出ます。見本の web は「共通の設定 + web」の和で、共通の設定のルールに、web のルールが追加されています。
        scene: { tab: rules, sum: web }
      - target: sum-deny
        title: 由来で確認する
        body: タイプごとの表に、id・ツール・パターン・由来・メッセージが並びます。「由来」は、共通の設定から来たか、そのプロジェクトの設定から来たかです。共通のルールの id はそのまま、ほかは web:no-prod-deploy のようにレイヤー名が付きます。
        scene: { tab: rules, sum: web }
      - target: sum-deny
        title: 統合結果を替えて見比べる
        body: 同じ共通のルール（git-push・no-rm-rf）が、どの統合結果にも入ります。統合結果を替えると、レイヤーごとに追加されるルールだけが入れ替わります。見本の self では secrets の置き場を止めるルールが追加されます。
        scene: { tab: rules, sum: self }
      - target: target
        title: 編集する設定ファイルを選ぶ
        body: 統合結果の枠は見せるだけです。追加されたルールを直すときは、実際の画面では上部の「設定」の欄で、直したい 1 本（共通の設定・ワークスペース・プロジェクト）に切り替えて編集します。
        scene: { tab: rules, sum: self }

  - id: find-fold-move
    title: ルールを絞り込み、畳み、並べ替え、タイプを移したいとき
    summary: ルールが増えたときに、探す・畳む・順を決める・タイプを移す
    steps:
      - target: find
        title: 文字で絞り込む
        body: 欄に文字を入れると、id・ツール・パターン・メッセージ・渡す文にヒットする行だけが残ります。組み合わせ条件のルールは、中の個別条件の文字にもヒットします。
        scene: { tab: rules, find: git }
      - target: count-deny
        title: 件数は「一致 / 全体」
        body: 絞り込み中は、タイプの見出しの件数が「一致 / 全体」になります。畳んだタイプの中も探すので、見えないところにヒットがあるときも件数で分かります。
        scene: { tab: rules, find: git }
      - target: fold-allow
        title: タイプを畳む
        body: 見出しの ▾ を押すと、そのタイプの行が畳まれます（▸ になります）。deny を見たいときに allow を畳む、のように使います。畳んでもルールは消えず、判定にも関わりません。判定でヒットした行は、畳んであってもその場だけ開いて出ます。
        scene: { tab: rules, fold: allow }
      - target: order-hint
        title: 判定の強さ
        body: 判定は強い順に deny > ask > allow です。1 件でも deny にヒットすれば拒否で、弱いタイプは確認しません。行の並びが強さを決めるのではなく、タイプが決めます。
        scene: { tab: rules }
      - target: rule-no-rm-rf-buttons
        title: 同じタイプの中の順
        body: 行を開いた右下の ↑ ↓ で、同じタイプの中の順を替えます。同じタイプに複数ヒットすれば全部の文を並べて返すので、順は返す文の並びに出ます。ヒットするかどうかは変わりません。「削除」で行を削除できます。
        scene: { tab: rules, open: no-rm-rf }
      - target: rule-no-rm-rf-type
        title: タイプを移す
        body: 「タイプ」の欄で deny / ask / allow を替えると、行は移した先の末尾に移ります。止めすぎだと分かった deny を ask に下げる、のように使います。ask と allow に message が残ると lint が error にするので、移したら message を additionalContext へ移します。
        scene: { tab: rules, open: no-rm-rf }
      - target: save
        title: 保存
        body: 並べ替えもタイプの移動も、保存するまで反映されません。保存のときに実行ファイルが全体を検証します。
        scene: { tab: rules }

  - id: save-error
    title: 保存前の検証エラーを読んで直したいとき
    summary: 保存が止まったときの理由を読み、直す行を探して直す
    steps:
      - target: save
        title: 保存で何を確認するか
        body: 保存を押すと、実行ファイルの --lint でルール全体を検証し、通ればファイルに反映します。error が 1 件でもあれば、何も保存しません。作業中のチケットがあるとき、読み込んだあとにファイルが外で変わったときも、保存は止まります。
        scene: { tab: rules }
      - target: status
        title: 理由は下に出る
        body: '止まった理由は画面の下に出ます。「設定の検証（--lint）でエラーが見つかりました」に続けて、lint の報告が 1 行ずつ並び、1 行は「error: ルールの id: 内容」の形です。見本は、ask の db-migrate に message を入力して保存したときの報告です。'
        scene: { tab: rules, error: true }
      - target: rule-db-migrate
        title: id で直す行を探す
        body: 報告の id（db-migrate）で、直す行を探します。多いときは絞り込みの欄に id を入れます。id が空のルールは、行の見出しに「（id 未設定）」と出ます。
        scene: { tab: rules, open: db-migrate, error: true }
      - target: rule-db-migrate-context
        title: 内容を直す
        body: この例の直し方は、ask の message を削除して、モデルに渡したい文を additionalContext に移すことです。ask の message は、ユーザの確認ダイアログにしか出ないためです。message が残った行を開くと、「message を削除」のボタンも出ます。
        scene: { tab: rules, open: db-migrate, more: true, error: true }
      - target: rule-protect-env-pattern
        title: 組み合わせ条件の誤り
        body: 空の all や any、中が空の not のような組み合わせ条件の誤りは、行の見出しに「組み合わせ条件に誤り」と出て、図の下にも並びます。保存前の検証でも止まります。
        scene: { tab: rules, open: protect-env, when: r }
      - target: save
        title: 直したら保存し直す
        body: 直したら、もう一度保存を押します。検証が通ればファイルに反映されます。
        scene: { tab: rules }
