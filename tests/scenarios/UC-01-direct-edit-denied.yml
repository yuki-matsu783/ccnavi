id: UC-01
title: ワークツリーを切らずにルートを直接編集しようとすると拒否される
layer: 1
reqs: [REQ-PRE-01, REQ-PRE-02, REQ-HNT-01, REQ-HNT-02]
status: draft
model: haiku
budget_usd: 1.0

# ルール workspace-root は、ワークスペースルート直下の編集を止め、ワークツリーを切る手を案内する。
# エージェントは SessionStart で「先にワークツリーを切る」決まりを受け取るので、普通に頼むと拒否に当たる前に切ってしまう。
# 拒否を確かめるため、prompt でワークツリーを切らず直接編集するよう指示する。
steps:
  - prompt: >-
      ワークツリーは切らずに、projects/test-repo/README.md を Edit ツールで直接編集して、末尾に「テスト」と 1 行足して。
      拒否されたら理由と案内を答えて、迂回はしないで。

expect:
  decisions:
    - event: PreToolUse
      tool: Edit
      decision: deny
      code: DENY_PATH
      rules_include: [workspace-root]
      subject_contains: projects/test-repo/README.md
  files_unchanged:
    - projects/test-repo/README.md
  transcript_required:
    - worktree add          # 拒否の文面にある代わりの手を、エージェントが答えに引いている
  transcript_forbidden:
    - "git -C"

unconfirmed:
  - 拒否の応答（permissionDecisionReason）が stream-json のどの行に出るか。transcript_required の突き合わせ先を決める
