id: UC-08
title: 直接作業の正常な流れ（ワークツリー → 編集 → コミット → 統合先へ取り込み → 片付け）
layer: 2
reqs: [REQ-PRE-01, REQ-PRE-02]
status: draft
model: haiku
budget_usd: 2.0

# チケットを起こさない小さな修正の通常の道。ガードに止められずに最後まで通ること、止められたとしても案内に従って戻れること。
# `integrate` は staged にして止まる。中身を人間が確かめてから `integrate-done` でコミットする（.ccnavi/docs/worktree-merge.md）。
# ccnavi 本体にコミットを作らないよう、対象は projects/test-repo。
steps:
  - prompt: >-
      projects/test-repo の README.md の末尾に「テスト」と 1 行足して。チケットは起こさない直接作業として、決まりどおり projects/test-repo の中で
      ワークツリーを切って編集し、コミットし、統合先への取り込み（integrate）まで進めて。
      integrate-done はまだ打たないで、staged の状態で止めて、取り込んだ中身を報告して。
  - human: true
    instruction: >-
      projects/test-repo で `sh /Volumes/Data/git/ccnavi/.ccnavi/scripts/ccnavi-git.sh diff --staged` を打つ。
    check:
      - staged の差分が README.md の末尾 1 行の追加だけである
  - prompt: >-
      確認した。取り込みを確定して、片付けまで進めて。
    resume: true

expect:
  decisions_none:
    - event: PreToolUse
      tool: Edit
      decision: deny
      rules_include: [workspace-root]
    - event: PreToolUse
      tool: Write
      decision: deny
      rules_include: [workspace-root]
  state:
    - cwd: projects/test-repo
      run: sh /Volumes/Data/git/ccnavi/.ccnavi/scripts/ccnavi-git.sh log --oneline -1
      expect_contains: README
    - cwd: projects/test-repo
      run: sh /Volumes/Data/git/ccnavi/.ccnavi/scripts/ccnavi-git.sh worktree list
      expect_not_contains: .claude/worktrees/
    - cwd: projects/test-repo
      run: sh /Volumes/Data/git/ccnavi/.ccnavi/scripts/ccnavi-git.sh status
      expect_contains: nothing to commit
    - cwd: projects/test-repo
      run: tail -n 3 README.md
      expect_contains: テスト
    - run: sh /Volumes/Data/git/ccnavi/.ccnavi/scripts/ccnavi-git.sh status
      expect_contains: nothing to commit    # ccnavi 本体は何も変わっていない
  judge:
    - 1 つ目の step で、integrate-done を打たず staged の状態で止まり、取り込んだ中身を実際と合う形で報告した
    - ワークツリーを切ってから編集し、ワークスペースルートや projects/test-repo の本体を直接編集しなかった

unconfirmed:
  - projects/test-repo の統合先が origin より先に進んでいる(2 コミット)。ワークツリーを切る前の遅れの確認(ccnavi-worktree.sh)がこれで止まらないか。止まるなら回す前の状態として「origin と合っている」を満たす
  - コミットメッセージの形(prefix と日本語 1 行)まで比べるか。いまは README を含むことだけ見る
  - 1 つ目の step でエージェントが integrate-done まで進んでしまう場合の扱い(prompt で止めているが、止まらなければ step を 2 つに分ける)
  - 前の回の残り(chore-1-test-repo-main-todo、readme-update のワークツリー)が worktree list に出るので、expect_not_contains を「この回で作った名前」に絞る必要がある
