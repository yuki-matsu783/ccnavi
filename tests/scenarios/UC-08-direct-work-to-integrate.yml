id: UC-08
title: 直接作業の正常な流れ（ワークツリー → 編集 → コミット → 取り込み先へ取り込み → 片付け）
layer: 2
reqs: [REQ-PRE-01, REQ-PRE-02]
status: verified
model: haiku
budget_usd: 2.0
test_repo: true                  # projects/test-repo にブランチ・コミットを作る。回す前に確認事項 2 を確かめる

# チケットを起こさない小さな修正の通常の道。ガードに止められずに最後まで通ること、止められたとしても案内に従って戻れること。
# `integrate` は取り込み結果を一時ワークツリー（logs/direct-tmp/）に展開して止まり、ユーザのチェックアウトには何も書かない。
# 中身を人間が確かめてから `integrate-done` で 1 コミットにして取り込み先へ載せる（.ccnavi/docs/direct-flow.md）。
# projects/test-repo のユーザのチェックアウトが開いているブランチが取り込み先になる。ずれが無ければ確認なしで切れる。
# ccnavi 本体にコミットを作らないよう、対象は projects/test-repo。
steps:
  - prompt: >-
      projects/test-repo の README.md の末尾に「テスト」と 1 行足して。チケットは起こさない直接作業として、決まりどおり projects/test-repo の中で
      ワークツリーを切って編集し、コミットし、取り込み（integrate）まで進めて。
      integrate-done はまだ打たないで、一時ワークツリーに展開した状態で止めて、取り込む中身を報告して。
  - human: true
    instruction: >-
      projects/test-repo で integrate が出力した「次:」の diff のコマンド（`ccnavi-git.sh diff HEAD <C>`）を打ち、`ccnavi-git.sh status` でユーザのチェックアウトに何も載っていないことも確かめる。
    check:
      - 差分が README.md の末尾 1 行の追加だけである
      - ユーザのチェックアウトの status は変わっていない（staged が無い）
  - prompt: >-
      確認した。取り込みを確定して、片付けまで進めて。
    resume: true

expect:
  decisions_none:
    - event: PreToolUse
      tool: Edit
      decision: deny
      rules_include: [.ccnavi/config/common/rules.yml:workspace-root]
    - event: PreToolUse
      tool: Write
      decision: deny
      rules_include: [.ccnavi/config/common/rules.yml:workspace-root]
  state:
    - cwd: projects/test-repo
      run: sh /Volumes/Data/git/ccnavi/.ccnavi/scripts/ccnavi-git.sh log --oneline -1
      expect_contains: README
    - cwd: projects/test-repo
      run: sh /Volumes/Data/git/ccnavi/.ccnavi/scripts/ccnavi-git.sh worktree list
      expect_contains: worktree  1 行    # 回す前と同じ 1 行（本体のみ）。この回で切ったワークツリーが片付いた
    - cwd: projects/test-repo
      run: sh /Volumes/Data/git/ccnavi/.ccnavi/scripts/ccnavi-git.sh status
      expect_contains: nothing to commit
    - cwd: projects/test-repo
      run: sh /Volumes/Data/git/ccnavi/.ccnavi/scripts/ccnavi-git.sh diff HEAD~1 HEAD -- README.md
      expect_contains: +テスト    # この回の取り込みが README に 1 行足したこと。回す前の HEAD は merge で、HEAD~1 との差分は空
    - run: sh /Volumes/Data/git/ccnavi/.ccnavi/scripts/ccnavi-git.sh status
      expect_contains: nothing to commit    # ccnavi 本体は何も変わっていない
  judge:
    - 1 つ目の step で、integrate-done を打たず、一時ワークツリーに展開した状態で止まり、取り込む中身を実際と合う形で報告した
    - ワークツリーを切ってから編集し、ワークスペースルートや projects/test-repo の本体を直接編集しなかった

unconfirmed:
  - コミットメッセージの形(prefix と日本語 1 行)まで比べるか。いまは README を含むことだけ見る（回した回では docs: README の末尾に「テスト」の 1 行を追加 だった）
  - 回すたびに projects/test-repo の main に「テスト」のコミットが 1 つ残り、README.md の末尾に行が足される。繰り返し回すなら、戻す手順（revert など）を決める
  - ターンの途中で切ったワークツリーの確認不能の警告は、分岐点から数えるようにして出さなくした（issue #378）。次に回すとき、Stop にこの警告が出ないことを確かめる
  - worktree list の行数（1 行）は、回す前の projects/test-repo の状態に依る。残ったワークツリーが増えたら、行数を直す（残骸は `worktree prune` で片付けた）
