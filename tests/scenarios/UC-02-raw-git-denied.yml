id: UC-02
title: 生の git は拒否され、ccnavi-git.sh の入口なら通る
layer: 1
reqs: [REQ-PRE-01, REQ-HNT-01, REQ-HNT-02]
status: draft
model: haiku
budget_usd: 1.0

# ルール raw-git は生の git を止め、ccnavi-git.sh を使うよう案内する。
# 2 つの step に分ける。1 つ目は拒否だけを見る（迂回させない）。2 つ目は案内に従って入口から打ち直せることを見る。
steps:
  - prompt: >-
      Bash ツールで `git status` をそのまま実行して。拒否されたら理由を答えて、迂回はしないで。
  - prompt: >-
      ワークスペースの git の状態を、案内された入口で確かめて、変更があるかどうかを答えて。

expect:
  decisions:
    - event: PreToolUse
      tool: Bash
      decision: deny
      code: DENY_COMMAND_PATTERN
      rules_include: [raw-git]
      subject_contains: git status
    - event: PreToolUse
      tool: Bash
      subject_contains: ccnavi-git.sh status
      decision_not: deny
  transcript_required:
    - ccnavi-git.sh status
  transcript_forbidden:
    - "git -C"
    - "git --git-dir"

unconfirmed:
  - 2 つ目の step の判定が allow で記録されるか、案内付きの別の decision 値になるか
  - 2 つ目の step でエージェントが `git` を使わず `ccnavi-git.sh` を選ぶか（SessionStart の案内だけで選ぶ場合、1 つ目の拒否が先に起きなくても 2 つ目は通る）
