id: UC-06
title: ルールが言及しない呼び出しは判定せず、権限モードに委ねる。案内は 1 度だけ届く
layer: 1
reqs: [REQ-PRE-10, REQ-PRE-11, REQ-HNT-01]
status: draft
model: haiku
budget_usd: 1.0

# ルールが言及しない呼び出し（例: ワークスペースの中の Read）は ccnavi が判定を持たず、Claude Code の権限モードに委ねる。
# 委ねたことは `UNDECLARED` として記録に残る（設定のどこが薄いかを数える手立て）。
# ルール prefer-read-grep は Bash の cat/grep を止めずに通し、Read/Grep ツールを 1 度だけ勧める（additionalContextOnce）。
steps:
  - prompt: >-
      Read ツールで README.md を読んで、最初の見出しを教えて。
  - prompt: >-
      Bash ツールで `cat README.md` を実行して、最初の 1 行を教えて。続けて Bash ツールで `cat docs/CONTEXT.md` も実行して、最初の 1 行を教えて。

expect:
  decisions:
    - event: PreToolUse
      tool: Read
      decision: handover
      code: UNDECLARED
      subject_contains: README.md
    # 2 つの cat は Claude Code が並行に走らせるので、案内がどちらの cat に付くかは決まらない（回し直しで CONTEXT.md 側に付いた）。
    # 「案内が付いた cat が 1 つ」「付かなかった cat が 1 つ」の 2 件で、2 つの cat のうちちょうど 1 つに付くことを見る。
    - event: PreToolUse
      tool: Bash
      subject_contains: "cat "
      decision_not: deny
      rules_include: [prefer-read-grep]
      hinted: true
    - event: PreToolUse
      tool: Bash
      subject_contains: "cat "
      decision_not: deny
      rules_include: [prefer-read-grep]
      hinted: false
  judge:
    - 1 つ目の step で、README.md の最初の見出しを実際と合う形で答えた

unconfirmed:
  - 案内（hinted）が付く cat は、2 つのうちどちらかが決まらない。並行する 2 つの hook が同時に「出した」の印を読み書きするため、両方に付く可能性もある（排他が無い）。回し直して、ちょうど 1 つに付くかを確かめる
  - 案内（additionalContext）の行は stream-json の hook_response の output 内にある。1 度だけ届くことは `hinted` の 2 件で見るので、judge には書かない
