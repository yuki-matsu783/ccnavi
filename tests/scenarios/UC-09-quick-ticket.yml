id: UC-09
title: 小さい作業を親 1・子 1 のチケットで、提案・承認・着手・完了まで通す
layer: 3
reqs: [REQ-APV-01, REQ-APV-02, REQ-TKT-01, REQ-TKT-26]
status: draft
model: haiku
budget_usd: 3.0

# 設計に触れる・ユーザのレビューが要る作業は、提案を書いて承認を受ける（docs/design/tickets/phases.md の「小さい作業」）。
# 承認（`ccnavi --agree`）と chat レビュー（`ccnavi-review.sh chat`）は人間しかできないので、そこで止める。
# 親は `plan: [quick]` の 1 項だけ、子は `phase: 1`。範囲は親の範囲そのまま。
steps:
  - prompt: >-
      projects/test-repo の README.md の末尾に「テスト 2」と 1 行足す小さい作業を、project: test-repo のチケット（quick の親 1・子 1）で進めたい。
      提案を wip/proposals/todo/ に書いて、`ccnavi --agree --preview --verify` で自己検証して、ユーザに承認を依頼するところで止めて。
      実装はまだしないで。
  - human: true
    instruction: >-
      ワークスペースルートで `ccnavi --agree <親の識別子> <子の識別子>` を打つ（識別子は 1 つ目の step の報告にある）。
    check:
      - 承認画面に、親の範囲（README.md）と、リスクの見立て（LOW）が出ている
      - 「新たに書ける領域」に README.md 以外が無い
  - prompt: >-
      承認した。着手して、README.md に追記して、子を finish し、親に合流するところまで進めて。
    resume: true
  - human: true
    instruction: >-
      親のワークツリーの端末で `sh .ccnavi/scripts/ccnavi-review.sh chat 1` を打つ。
    check:
      - 差分が README.md の末尾 1 行の追加だけである
  - prompt: >-
      レビューが済んだ。親を finish して。
    resume: true

expect:
  decisions_none:
    - event: PreToolUse
      tool: Write
      decision: deny
      rules_include: [guard-approved-tickets]
    - event: PreToolUse
      tool: Edit
      decision: deny
      rules_include: [guard-approved-tickets]
  state:
    - run: sh .ccnavi/scripts/ccnavi-ticket.sh status
      expect_not_contains: 作業中
  judge:
    - 1 つ目の step で、実装に進まず、承認を依頼して止まった。提案の範囲が README.md だけである
    - 承認済みチケットを直接書き換えず、ccnavi-ticket.sh を通して着手・完了させた

unconfirmed:
  - UC-08 が残した「テスト」の行が README.md の末尾にあるので、足す行は「テスト 2」にした（「テスト」だと 2 行続くとエージェントが判断して提案を書かずに止まった）。回すたびに行が増えるので、繰り返し回すなら戻す手順を決める
  - 識別子の形（親 `<先頭の語>-<番号>-<slug>`、子 `<親>-01-01` の形かどうか）と、1 つ目の step の報告から人間が読み取れること
  - ticket status の出力の語（作業中・レビュー待ち・承認待ち・完了）。親子が両方 done に入ったことを比べる形に直す
  - 3 つ目の step で子の finish → 親への合流まで 1 回の prompt で通るか。長ければ step を分ける
  - 承認済みチケットの置き場が、project が test-repo の親ではプロジェクトの側になるか（docs/design/tickets/places.md で確かめる）
  - chat レビューの `1` は番号（フェーズ）。親のワークツリーの場所は、2 つ目の step の報告に出させる
