id: UC-09
title: 小さい作業を親 1・子 1 のチケットで、提案・承認・着手・完了まで通す
layer: 3
reqs: [REQ-APV-01, REQ-APV-02, REQ-TKT-01, REQ-TKT-26]
status: draft
model: haiku
budget_usd: 3.0
test_repo: true                  # projects/test-repo にブランチ・MR を作る。回す前に確認事項 2 を確かめる
setup:
  issue:                         # 回すたびに test-repo へ issue を新しく作り、prompt の {issue} に番号を入れる
    repo: projects/test-repo
    title: "README の末尾に 1 行を足す（受け入れシナリオ UC-09 用）"
    body: "受け入れシナリオ UC-09 で使う issue。README.md の末尾に「テスト 2」を 1 行足す作業の着手に使う。"
    close: true                  # 回したあとに閉じる

# 設計に触れる・ユーザのレビューが要る作業は、提案を書いて承認を受ける（docs/design/tickets/phases.md の「小さい作業」）。
# 承認（`ccnavi-user-agree.sh`。承認のあと、承認済みチケットのコミットと push まで行う）とマージリクエストのレビュー（ホスト上）は人間しかできないので、そこで止める。
# 実行ファイルの `ccnavi user agree` は承認だけでコミットも push もしないので、使わない（使うと着手と子の提案が未 push で止まる）。
# 親は `plan: [quick]` の 1 ステップだけ、子は `phase: 1`。範囲は親の範囲そのまま。
steps:
  - prompt: >-
      projects/test-repo の issue #{issue} を指定された小さい作業（README.md の末尾に「テスト 2」と 1 行足す）を、project: test-repo のチケット（quick の親 1・子 1）で進めたい。
      issue #{issue} で `sh .ccnavi/scripts/ccnavi-start.sh --issue {issue}` を打って、出た親のワークツリーに提案を wip/proposals/todo/ に書いて、`ccnavi --agree --preview --verify` で自己検証して、ユーザに承認を依頼するところで止めて。
      実装はまだしないで。
  - human: true
    instruction: >-
      ワークスペースルートで `sh .ccnavi/scripts/ccnavi-user-agree.sh <親の識別子> <子の識別子>` を打つ（識別子は 1 つ目の step の報告にある）。
    check:
      - 承認画面に、親の範囲（README.md）と、リスクの見立て（LOW）が出ている
      - 承認のあとに「pushしました」と出ている（承認済みチケットが親のブランチに送られている）
      - 「新たに書ける領域」に README.md 以外が無い
  - prompt: >-
      承認した。着手して、README.md に追記して、子を finish し、親に合流し、ELI5 の HTML を wip/eli5/phase-1.html に書いてコミットして push し、`sh .ccnavi/scripts/ccnavi-review.sh request --phase 1 --body-file <依頼文> --eli5 wip/eli5/phase-1.html` でレビューを依頼するところまで進めて。
    resume: true
  - human: true
    instruction: >-
      依頼で作られたマージリクエスト（test-repo。ホストの認証が要る）を開き、指摘なしでレビューする。
    check:
      - 差分が README.md の末尾 1 行の追加と、ELI5 の HTML（wip/eli5/phase-1.html）だけである
  - prompt: >-
      レビューが済んだ。`sh .ccnavi/scripts/ccnavi-review.sh confirm --phase 1` で確認し、親を finish して push し、`sh .ccnavi/scripts/ccnavi-review.sh ready` で Draft を外して。
    resume: true

expect:
  decisions_none:
    - event: PreToolUse
      tool: Write
      decision: deny
      rules_include: [builtin:ticket-approved]
    - event: PreToolUse
      tool: Edit
      decision: deny
      rules_include: [builtin:ticket-approved]
  state:
    - run: sh .ccnavi/scripts/ccnavi-ticket.sh status
      expect_not_contains: 作業中
  judge:
    - 1 つ目の step で、実装に進まず、承認を依頼して止まった。提案の範囲が README.md だけである
    - 承認済みチケットを直接書き換えず、ccnavi-ticket.sh を通して着手・完了させた

unconfirmed:
  - UC-08 が残した「テスト」の行が README.md の末尾にあるので、足す行は「テスト 2」にした（「テスト」だと 2 行続くとエージェントが判断して提案を書かずに止まった）。回すたびに行が増えるので、繰り返し回すなら戻す手順を決める
  - 識別子の形（親 `<先頭の語>-<番号>-<slug>`、子 `<親>-01-01` の形かどうか）と、1 つ目の step の報告から人間が読み取れること
  - ticket status の出力の語（作業中・レビュー待ち・承認待ち・完了）。親子が両方 done に入ったことを比べる形に直す
  - 3 つ目の step で子の finish → 親への合流まで 1 回の prompt で通るか。長ければ step を分ける
  - 承認済みチケットの置き場が、project が test-repo の親ではプロジェクトの側になるか（docs/design/tickets/places.md で確かめる）
  - マージリクエストの作成に test-repo のホスト認証が要る。無い環境では 4 つ目の step から先を回せない
