# 手動の確認用の GitLab CE。起動・停止・確認は docker_gitlab.py が行う（直接 compose を打たない）。
# 環境変数は docker_gitlab.py が渡す。ポート・版・メモリ上限は docker_gitlab.py の定数が 1 か所の正本。
name: ccnavi-gitlab

services:
  gitlab:
    image: ${GITLAB_IMAGE:?docker_gitlab.py の GITLAB_IMAGE で渡す}
    container_name: gitlab
    # 起動時に Docker Desktop が勝手に上げないよう、自動では再起動しない
    restart: "no"
    hostname: gitlab.localhost
    # GitLab の共有メモリは既定の 64MB では足りない
    shm_size: 256m
    # CE は 4GB が要る。OOM で落ちないよう余裕をとった値（docker_gitlab.py の MEM_LIMIT）
    mem_limit: ${GITLAB_MEM_LIMIT:?docker_gitlab.py の GITLAB_MEM_LIMIT で渡す}
    environment:
      GITLAB_ROOT_PASSWORD: ${GITLAB_ROOT_PASSWORD:?docker_gitlab.py の GITLAB_ROOT_PASSWORD で渡す}
      # external_url と公開ポートは同じ値にする。崩れると clone URL と web_url が壊れる
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://127.0.0.1:${GITLAB_PORT}'
        nginx['listen_port'] = ${GITLAB_PORT}
        nginx['listen_https'] = false
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
    ports:
      # LAN に出さない
      - "127.0.0.1:${GITLAB_PORT}:${GITLAB_PORT}"
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab

volumes:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
